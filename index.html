<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GMAT Prep Tracker</title>
<meta name="description" content="Track your GMAT Focus Edition preparation — exam countdown, daily & weekly targets, per-topic logging, and an activity calendar." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1B212B" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GMAT Prep" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<style>
  :root {
    color-scheme: light dark;
    --paper:#F6F4EE; --surface:#FFFFFF; --surface-2:#F0EDE5; --ink:#1B2130;
    --ink-soft:#545B6B; --ink-faint:#8A8F9C; --line:#E4E0D6; --line-soft:#EDEAE2;
    --accent:#2E6E67; --accent-ink:#21534E; --accent-wash:#E4EEEC;
    --gold:#B0791E; --gold-wash:#F3EBD8;
    --c-quant:#2E6E67; --c-data:#3F4E9E; --c-overall:#B0791E; --c-verbal:#A6543C; --c-cr:#8E5572;
    --radius:14px; --radius-s:9px;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 8px 24px -14px rgba(20,25,40,.18);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#14181F; --surface:#1B212B; --surface-2:#232B37; --ink:#E9EBEF;
      --ink-soft:#A6ADBB; --ink-faint:#6E7686; --line:#2B333F; --line-soft:#232B36;
      --accent:#5FB3A8; --accent-ink:#8FCDC4; --accent-wash:#1E2F2D;
      --gold:#D8A64A; --gold-wash:#2C2718;
      --c-quant:#5FB3A8; --c-data:#8A96D9; --c-overall:#D8A64A; --c-verbal:#D0846A; --c-cr:#C58AA8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --paper:#F6F4EE; --surface:#FFFFFF; --surface-2:#F0EDE5; --ink:#1B2130;
    --ink-soft:#545B6B; --ink-faint:#8A8F9C; --line:#E4E0D6; --line-soft:#EDEAE2;
    --accent:#2E6E67; --accent-ink:#21534E; --accent-wash:#E4EEEC;
    --gold:#B0791E; --gold-wash:#F3EBD8;
    --c-quant:#2E6E67; --c-data:#3F4E9E; --c-overall:#B0791E; --c-verbal:#A6543C; --c-cr:#8E5572;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 8px 24px -14px rgba(20,25,40,.18);
  }
  :root[data-theme="dark"] {
    --paper:#14181F; --surface:#1B212B; --surface-2:#232B37; --ink:#E9EBEF;
    --ink-soft:#A6ADBB; --ink-faint:#6E7686; --line:#2B333F; --line-soft:#232B36;
    --accent:#5FB3A8; --accent-ink:#8FCDC4; --accent-wash:#1E2F2D;
    --gold:#D8A64A; --gold-wash:#2C2718;
    --c-quant:#5FB3A8; --c-data:#8A96D9; --c-overall:#D8A64A; --c-verbal:#D0846A; --c-cr:#C58AA8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }

  /* ---------- Top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
  .tb-inner { max-width: 940px; margin: 0 auto; padding: 11px 18px; display: flex; align-items: center; gap: 14px; }
  .tb-count { display: flex; align-items: center; gap: 11px; margin-right: auto; background: none; border: none; padding: 4px 6px; border-radius: 12px; text-align: left; }
  .tb-count:hover { background: var(--surface-2); }
  .tb-days { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--gold); line-height: 1; letter-spacing: -.02em; }
  .tb-days.past { color: var(--c-verbal); }
  .tb-meta { display: flex; flex-direction: column; gap: 1px; }
  .tb-meta .l { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .tb-meta .d { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--accent-wash); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    font-weight: 700; font-size: 16px; font-family: var(--serif);
    display: grid; place-items: center; transition: .15s;
  }
  .avatar:hover { filter: brightness(.97); }
  .avatar svg { width: 20px; height: 20px; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 18px 40px; }

  /* ---------- Bottom nav ---------- */
  .botnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); display: flex; justify-content: center;
  }
  .botnav-inner { width: 100%; max-width: 500px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
  .bn {
    border: none; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; color: var(--ink-faint); font-size: 10.5px; font-weight: 700;
    letter-spacing: .01em; transition: color .15s;
  }
  .bn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bn.active { color: var(--tabc); }
  .bn .lab { line-height: 1; }
  /* center hub */
  .bn.center { position: relative; }
  .bn.center .hub {
    width: 54px; height: 54px; border-radius: 50%; margin-top: -24px; margin-bottom: 2px;
    background: var(--c-overall); color: #fff; display: grid; place-items: center;
    border: 4px solid var(--paper); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--c-overall) 70%, transparent);
    transition: transform .15s;
  }
  .bn.center .hub svg { width: 26px; height: 26px; stroke-width: 2; }
  .bn.center.active { color: var(--c-overall); }
  .bn.center.active .hub { transform: translateY(-2px); }
  .bn.center .lab { margin-top: 1px; }

  /* ---------- Section head ---------- */
  .sec-head { margin: 4px 0 6px; }
  .sec-head h2 {
    font-family: var(--serif); font-size: 25px; font-weight: 600; margin: 0; letter-spacing: -.01em;
    text-wrap: balance; display: flex; align-items: center; gap: 11px;
  }
  .sec-head h2 .bar { width: 6px; height: 24px; border-radius: 3px; background: var(--secc); flex: none; }
  .sec-head p { margin: 8px 0 0; color: var(--ink-soft); max-width: 62ch; font-size: 14.5px; }
  .sec-stat { display: inline-flex; align-items: baseline; gap: 6px; margin-top: 13px; font-size: 13px; color: var(--ink-soft); }
  .sec-stat b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- Subject cards ---------- */
  .subjects { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .subject { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .subj-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; }
  .subj-head:hover { background: var(--surface-2); }
  .subj-head .chev { color: var(--ink-faint); transition: transform .2s; font-size: 12px; }
  .subject.collapsed .chev { transform: rotate(-90deg); }
  .subj-head .title { font-weight: 650; font-size: 15.5px; margin-right: auto; letter-spacing: -.01em; }
  .subj-head .count {
    font-size: 12.5px; font-weight: 600; color: var(--secc);
    background: color-mix(in srgb, var(--secc) 12%, transparent); padding: 3px 10px; border-radius: 20px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .subject.collapsed .topics { display: none; }
  .topic { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--line-soft); }
  .topic .tname { font-size: 14px; margin-right: auto; }
  .topic .tval { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; min-width: 40px; text-align: right; }
  .topic .tval.zero { color: var(--ink-faint); font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .step {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    height: 30px; min-width: 34px; padding: 0 8px; border-radius: 8px; font-size: 13px; font-weight: 700;
    transition: .12s; line-height: 1;
  }
  .step:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .step.minus { min-width: 30px; }
  .step:disabled { opacity: .35; cursor: not-allowed; background: var(--surface); color: var(--ink-faint); border-color: var(--line); }

  /* ---------- Goals (rings) ---------- */
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; display: flex; align-items: center; gap: 14px; }
  .ring-wrap { position: relative; width: 66px; height: 66px; flex: none; }
  .ring { width: 66px; height: 66px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .goal .gt { min-width: 0; }
  .goal .gk { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; }
  .goal .gv { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .goal .gs { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .goal-empty { grid-column: 1 / -1; text-align: left; }
  .goal-empty .link { color: var(--accent); font-weight: 700; background: none; border: none; padding: 0; text-decoration: underline; }

  /* ---------- Stats / panels ---------- */
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .stat .v { font-family: var(--serif); font-size: 32px; font-weight: 600; margin-top: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 17px 19px; margin-top: 14px; }
  .panel h3 { margin: 0 0 3px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .panel .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  .breakdown { display: flex; flex-direction: column; gap: 13px; }
  .bd-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 12px; align-items: center; }
  .bd-row .bl { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .bd-row .bl .d { width: 9px; height: 9px; border-radius: 50%; background: var(--rc); flex: none; }
  .track { height: 9px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--rc); border-radius: 6px; transition: width .5s ease; }
  .bd-row .bv { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; min-width: 40px; text-align: right; }

  .spark { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin-top: 4px; }
  .spark .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .spark .bcol .b { width: 100%; max-width: 40px; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 6px 6px 3px 3px; min-height: 3px; transition: height .4s ease; }
  .spark .bcol.has .b { background: var(--accent); border-color: var(--accent); }
  .spark .bcol .bn { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; height: 13px; }
  .spark .bcol .bd { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .spark .bcol.today .bd { color: var(--accent); font-weight: 700; }

  /* ---------- Profile page ---------- */
  .profile { position: fixed; inset: 0; z-index: 70; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .profile[hidden] { display: none; }
  .pf-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
  .pf-head-in { max-width: 640px; margin: 0 auto; padding: 13px 18px; display: flex; align-items: center; gap: 12px; }
  .pf-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .pf-close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
  .pf-close:hover { color: var(--ink); border-color: var(--ink-faint); }
  .pf-body { max-width: 640px; margin: 0 auto; padding: 18px 18px 60px; display: flex; flex-direction: column; gap: 14px; }

  .pf-id { display: flex; align-items: center; gap: 15px; }
  .pf-id .big {
    width: 58px; height: 58px; border-radius: 50%; flex: none; background: var(--accent-wash);
    color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    font-family: var(--serif); font-size: 24px; font-weight: 600; display: grid; place-items: center;
  }
  .pf-id .nm { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .pf-id .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .pf-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; background: var(--surface-2); color: var(--ink-soft); }
  .chip.hot { background: var(--gold-wash); color: var(--gold); }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; background: var(--paper); color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .tgt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .tgt-row:first-of-type { border-top: none; }
  .tgt-info { margin-right: auto; }
  .tgt-k { font-weight: 650; font-size: 14.5px; }
  .tgt-s { font-size: 12.5px; color: var(--ink-soft); }
  .tgt-val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; min-width: 34px; text-align: center; }
  .tgt-prog { margin-top: 4px; }
  .tgt-bar { height: 7px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin-top: 7px; }
  .tgt-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .5s ease; }
  .tgt-cap { font-size: 12px; color: var(--ink-soft); margin-top: 6px; display: flex; justify-content: space-between; }

  /* calendar */
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-title { font-weight: 700; margin-right: auto; font-size: 14.5px; }
  .cal-nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
  .cal-nav:hover { color: var(--ink); border-color: var(--ink-faint); }
  .cal-nav:disabled { opacity: .35; cursor: not-allowed; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); text-align: center; font-weight: 700; padding-bottom: 3px; }
  .cal-cell { aspect-ratio: 1; border-radius: 7px; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 5px; font-size: 10.5px; font-weight: 700; }
  .cal-cell.blank { background: none; }
  .cal-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hl0 { background: var(--surface-2); color: var(--ink-faint); }
  .hl1 { background: color-mix(in srgb, var(--accent) 26%, var(--surface)); color: var(--ink-soft); }
  .hl2 { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); color: var(--ink); }
  .hl3 { background: color-mix(in srgb, var(--accent) 72%, var(--surface)); color: #fff; }
  .hl4 { background: var(--accent); color: #fff; }
  .cal-legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 12px; font-size: 11px; color: var(--ink-faint); }
  .cal-legend i { width: 15px; height: 15px; border-radius: 4px; display: inline-block; }

  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); padding: 9px; border-radius: 10px; font-size: 13.5px; font-weight: 600; transition: .12s; }
  .seg button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

  .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 11px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; transition: .15s; }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-danger { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 600; }
  .btn-danger:hover { color: var(--c-verbal); border-color: var(--c-verbal); }

  /* ---------- Onboarding modal ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15,18,26,.55); display: grid; place-items: center; z-index: 80; padding: 20px; backdrop-filter: blur(3px); }
  .scrim[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); width: 100%; max-width: 420px; padding: 26px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); }
  .modal .kick { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .modal h2 { font-family: var(--serif); font-size: 24px; margin: 6px 0 4px; font-weight: 600; letter-spacing: -.01em; }
  .modal p.lead { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .modal .btn-primary { margin-top: 4px; }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }

  .footnote { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 30px; }

  @media (max-width: 430px) {
    .tb-days { font-size: 26px; }
    .sec-head h2 { font-size: 22px; }
    .bd-row { grid-template-columns: 92px 1fr auto; }
    .goal { padding: 13px; gap: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-inner">
    <button class="tb-count" id="tb-count" title="Exam countdown — tap to edit">
      <span class="tb-days tnum" id="tb-days">—</span>
      <span class="tb-meta">
        <span class="l" id="tb-label">days to exam</span>
        <span class="d" id="tb-date">set your date</span>
      </span>
    </button>
    <button class="avatar" id="btn-profile" title="Your profile, targets & activity">P</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="botnav"><div class="botnav-inner" id="botnav"></div></nav>

<!-- Onboarding -->
<div class="scrim" id="onboard" hidden>
  <div class="modal">
    <span class="kick">Welcome</span>
    <h2>Let's set up your prep</h2>
    <p class="lead">Two quick things and you're in. You can change everything later from your profile.</p>
    <div class="field">
      <label for="ob-name">Your name</label>
      <input id="ob-name" type="text" placeholder="e.g. Pranav" autocomplete="off" />
    </div>
    <div class="field">
      <label for="ob-date">Exam date</label>
      <input id="ob-date" type="date" />
      <div class="hint">The banner counts down the days for you.</div>
    </div>
    <button class="btn-primary" id="ob-save">Start tracking</button>
  </div>
</div>

<!-- Profile page -->
<div class="profile" id="profile" hidden>
  <div class="pf-head"><div class="pf-head-in">
    <h2 class="pf-title">Profile</h2>
    <button class="pf-close" id="pf-close" title="Close">✕</button>
  </div></div>
  <div class="pf-body" id="pf-body"></div>
</div>

<script>
(function () {
  "use strict";

  /* ===================== Course content ===================== */
  const ICON = {
    quant: '<svg viewBox="0 0 24 24"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="7.5" cy="7.5" r="2.4"/><circle cx="16.5" cy="16.5" r="2.4"/></svg>',
    data:  '<svg viewBox="0 0 24 24"><path d="M5 20V13"/><path d="M12 20V5"/><path d="M19 20V10"/><line x1="3" y1="20" x2="21" y2="20"/></svg>',
    overall:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.6"/></svg>',
    rc:    '<svg viewBox="0 0 24 24"><path d="M12 6c-2.2-1.3-5-1.3-7.5 0v12c2.5-1.3 5.3-1.3 7.5 0 2.2-1.3 5-1.3 7.5 0V6c-2.5-1.3-5.3-1.3-7.5 0z"/><line x1="12" y1="6" x2="12" y2="18"/></svg>',
    cr:    '<svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H9l-4 3V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12.5" x2="13" y2="12.5"/></svg>',
    person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>'
  };

  const SECTIONS = [
    { id:"quant", nav:"Quant", color:"var(--c-quant)", icon:ICON.quant,
      title:"Quantitative Reasoning",
      blurb:"Part of the score alongside Verbal and Data Insights. 45 min · 21 Problem-Solving questions — arithmetic and algebra only (no geometry, no calculator).",
      subjects:[
        { name:"Arithmetic & Number Properties", topics:[
          "Integers, factors & multiples","Prime numbers & factorization","LCM & GCD",
          "Divisibility & remainders","Odd / even & sign rules","Fractions & decimals","Absolute value"] },
        { name:"Percentages, Ratios & Proportions", topics:[
          "Percentages & percent change","Ratios & proportions","Profit, loss & discount","Simple & compound interest"] },
        { name:"Powers, Roots & Exponents", topics:[
          "Exponent rules","Roots & radicals","Scientific notation & estimation"] },
        { name:"Algebra", topics:[
          "Linear equations","Systems of equations","Quadratic equations",
          "Inequalities & absolute value","Functions & custom symbols","Expressions & factoring","Sequences & series"] },
        { name:"Word Problems", topics:[
          "Speed, distance & time","Work & rate","Mixtures & solutions","Overlapping sets (Venn)","Age & number problems"] },
        { name:"Statistics, Counting & Probability", topics:[
          "Mean, median & mode","Range & standard deviation","Weighted averages","Permutations & combinations","Probability"] }
      ]},

    { id:"data", nav:"Data", color:"var(--c-data)", icon:ICON.data,
      title:"Data Insights",
      blurb:"45 min · 20 questions. The signature Focus-Edition section — data literacy across five formats, including Data Sufficiency (moved here from Quant).",
      subjects:[
        { name:"Data Sufficiency", topics:[
          "Value questions","Yes / No questions","Statement-combination strategy","Common traps & C-trap"] },
        { name:"Multi-Source Reasoning", topics:[
          "Reading across tabs","Synthesizing multiple sources","Inference from combined data","True / False judgment sets"] },
        { name:"Table Analysis", topics:[
          "Sorting & filtering","Statistics from a table","Ratios & proportions in tables"] },
        { name:"Graphics Interpretation", topics:[
          "Scatter plots & correlation","Bar & line graphs","Interpreting relationships","Dropdown completion"] },
        { name:"Two-Part Analysis", topics:[
          "Quantitative two-part","Verbal / logical two-part","Trade-off & optimization"] }
      ]},

    { id:"overall", nav:"Overall", color:"var(--c-overall)", icon:ICON.overall, dashboard:true,
      title:"Overall Progress",
      blurb:"Your whole preparation at a glance — targets, total questions practiced, how effort is spread across the four practice areas, and recent activity." },

    { id:"rc", nav:"RC", color:"var(--c-verbal)", icon:ICON.rc,
      title:"Reading Comprehension",
      blurb:"One of the two Verbal question types (Verbal is 45 min · 23 questions). Passages with question sets testing main idea, detail, inference, and structure.",
      subjects:[
        { name:"Question Types", topics:[
          "Main idea / primary purpose","Supporting detail","Inference",
          "Function of a detail or paragraph","Author's tone & attitude","Passage structure","Application / extension"] },
        { name:"Passage Practice by Domain", topics:[
          "Science & technology passages","Business & economics passages","Social science & humanities passages","Long, dense passages"] }
      ]},

    { id:"cr", nav:"CR", color:"var(--c-cr)", icon:ICON.cr,
      title:"Critical Reasoning",
      blurb:"The other Verbal question type. Short arguments testing your reasoning — assumptions, strengthen / weaken, flaws, paradoxes, and structure.",
      subjects:[
        { name:"Foundations", topics:[
          "Deconstructing arguments","Finding the conclusion","Spotting assumptions"] },
        { name:"Question Types", topics:[
          "Assumption","Strengthen","Weaken","Evaluate the argument","Inference / must be true",
          "Explain the paradox","Identify the flaw","Boldface & method of reasoning","Complete the argument"] }
      ]}
  ];
  const bySub = SECTIONS.filter(s => s.subjects);

  /* ===================== State ===================== */
  const KEY = "gmat_tracker_v2";
  const defaults = { name:"", examDate:"", counts:{}, daily:{}, collapsed:{}, active:"overall", targets:{ daily:20, weekly:120 } };
  let state = load();
  let calCursor = new Date(); calCursor.setDate(1);

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) {
      const p = JSON.parse(raw);
      return Object.assign({}, defaults, p, { targets: Object.assign({}, defaults.targets, p.targets || {}) });
    } } catch (e) {}
    // migrate v1 if present
    try { const old = JSON.parse(localStorage.getItem("gmat_tracker_v1") || "null");
      if (old) return Object.assign({}, defaults, { name: old.name || "", examDate: old.examDate || "", daily: old.daily || {} });
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaults));
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const dkey = (d) => { const x = d || new Date(); const y = x.getFullYear(), m = String(x.getMonth()+1).padStart(2,"0"), da = String(x.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; };
  const topicId = (s, subj, t) => `${s}::${subj}::${t}`;
  const getCount = (id) => state.counts[id] || 0;

  function log(id, delta) {
    const cur = getCount(id), next = Math.max(0, cur + delta), applied = next - cur;
    if (!applied) return;
    state.counts[id] = next;
    const k = dkey();
    state.daily[k] = Math.max(0, (state.daily[k] || 0) + applied);
    save(); renderView(); renderBotnav();
  }

  const sectionTotal = (sec) => sec.subjects ? sec.subjects.reduce((a,su)=>a+su.topics.reduce((b,t)=>b+getCount(topicId(sec.id,su.name,t)),0),0) : 0;
  const subjectTotal = (secId, su) => su.topics.reduce((a,t)=>a+getCount(topicId(secId,su.name,t)),0);
  const grandTotal = () => bySub.reduce((a,s)=>a+sectionTotal(s),0);
  const topicCountTotal = () => bySub.reduce((a,s)=>a+s.subjects.reduce((b,su)=>b+su.topics.length,0),0);
  const topicsTouched = () => { let n=0; bySub.forEach(s=>s.subjects.forEach(su=>su.topics.forEach(t=>{ if(getCount(topicId(s.id,su.name,t))>0) n++; }))); return n; };

  function daysLeft() {
    if (!state.examDate) return null;
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.round((new Date(state.examDate+"T00:00:00") - now) / 86400000);
  }
  function startOfWeek(d) { const x = new Date(d); x.setHours(0,0,0,0); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function weekTotal() { const s = startOfWeek(new Date()); let n=0; for (let i=0;i<7;i++){ const dd=new Date(s); dd.setDate(s.getDate()+i); n+=state.daily[dkey(dd)]||0; } return n; }
  function todayTotal() { return state.daily[dkey()] || 0; }
  function streak() {
    let n = 0, cur = new Date();
    if (!(state.daily[dkey(cur)] > 0)) cur.setDate(cur.getDate()-1);
    while (state.daily[dkey(cur)] > 0) { n++; cur.setDate(cur.getDate()-1); }
    return n;
  }
  function heatLevel(count) {
    if (count <= 0) return 0;
    const t = state.targets.daily || 20, r = count / t;
    if (r < 0.34) return 1; if (r < 0.67) return 2; if (r < 1) return 3; return 4;
  }

  /* ===================== Top bar ===================== */
  function renderTop() {
    const d = daysLeft();
    const days = document.getElementById("tb-days");
    const lbl = document.getElementById("tb-label");
    const dt = document.getElementById("tb-date");
    days.classList.remove("past");
    const av = document.getElementById("btn-profile");
    av.innerHTML = state.name ? esc(state.name.trim()[0].toUpperCase()) : ICON.person;
    if (d === null) { days.textContent = "—"; lbl.textContent = "days to exam"; dt.textContent = "set your date"; return; }
    const nice = new Date(state.examDate+"T00:00:00").toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    if (d > 0) { days.textContent = d; lbl.textContent = "days to exam"; dt.textContent = nice; }
    else if (d === 0) { days.textContent = "0"; lbl.textContent = "exam day"; dt.textContent = nice; }
    else { days.textContent = Math.abs(d); days.classList.add("past"); lbl.textContent = "days since exam"; dt.textContent = nice; }
  }

  /* ===================== Bottom nav ===================== */
  function renderBotnav() {
    const nav = document.getElementById("botnav");
    nav.innerHTML = "";
    SECTIONS.forEach(sec => {
      const b = document.createElement("button");
      b.className = "bn" + (sec.dashboard ? " center" : "") + (state.active === sec.id ? " active" : "");
      b.style.setProperty("--tabc", sec.color);
      b.innerHTML = sec.dashboard
        ? `<span class="hub">${sec.icon}</span><span class="lab">${sec.nav}</span>`
        : `${sec.icon}<span class="lab">${sec.nav}</span>`;
      b.onclick = () => { state.active = sec.id; save(); render(); window.scrollTo({ top:0 }); };
      nav.appendChild(b);
    });
  }

  /* ===================== Views ===================== */
  function renderView() {
    const view = document.getElementById("view");
    const sec = SECTIONS.find(s => s.id === state.active) || SECTIONS.find(s => s.dashboard);
    view.innerHTML = sec.dashboard ? overallHTML() : sectionHTML(sec);
  }

  function sectionHTML(sec) {
    const total = sectionTotal(sec);
    let h = `<div class="sec-head" style="--secc:${sec.color}">
      <h2><span class="bar"></span>${esc(sec.title)}</h2>
      <p>${esc(sec.blurb)}</p>
      <span class="sec-stat"><b>${total}</b> questions logged across <b>${sec.subjects.length}</b> areas</span>
    </div><div class="subjects">`;
    sec.subjects.forEach(su => {
      const ckey = sec.id + "::" + su.name;
      const collapsed = state.collapsed[ckey] ? " collapsed" : "";
      const st = subjectTotal(sec.id, su);
      h += `<section class="subject${collapsed}" style="--secc:${sec.color}">
        <div class="subj-head" data-collapse="${esc(ckey)}">
          <span class="chev">▼</span><span class="title">${esc(su.name)}</span>
          <span class="count">${st} done · ${su.topics.length} topics</span>
        </div><div class="topics">`;
      su.topics.forEach(t => {
        const id = topicId(sec.id, su.name, t), v = getCount(id);
        h += `<div class="topic">
          <span class="tname">${esc(t)}</span>
          <div class="stepper">
            <button class="step minus" data-log="${esc(id)}" data-d="-1" ${v===0?"disabled":""}>−</button>
            <button class="step" data-log="${esc(id)}" data-d="1">+1</button>
            <button class="step" data-log="${esc(id)}" data-d="5">+5</button>
            <button class="step" data-log="${esc(id)}" data-d="10">+10</button>
          </div>
          <span class="tval ${v===0?"zero":""}">${v}</span>
        </div>`;
      });
      h += `</div></section>`;
    });
    return h + `</div>`;
  }

  function ring(pct, color) {
    const r = 26, c = 2*Math.PI*r, off = c * (1 - Math.max(0, Math.min(1, pct)));
    return `<svg viewBox="0 0 64 64" class="ring">
      <circle class="ring-bg" cx="32" cy="32" r="${r}"/>
      <circle class="ring-fg" cx="32" cy="32" r="${r}" style="stroke:${color};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/>
    </svg>`;
  }

  function overallHTML() {
    const gt = grandTotal(), touched = topicsTouched(), totalTopics = topicCountTotal();
    const dl = daysLeft(), today = todayTotal(), week = weekTotal(), st = streak();
    const dT = state.targets.daily || 0, wT = state.targets.weekly || 0;

    let h = `<div class="sec-head" style="--secc:var(--c-overall)">
      <h2><span class="bar"></span>Overall Progress</h2>
      <p>${esc(SECTIONS.find(s=>s.dashboard).blurb)}</p></div>`;

    // goals
    if (dT > 0 || wT > 0) {
      h += `<div class="goals">`;
      if (dT > 0) {
        const p = today / dT;
        h += `<div class="goal"><div class="ring-wrap">${ring(p, "var(--accent)")}<span class="ring-pct">${Math.round(p*100)}%</span></div>
          <div class="gt"><div class="gk">Today</div><div class="gv">${today} / ${dT}</div>
          <div class="gs">${today>=dT?"target hit 🎯":(dT-today)+" to go"}</div></div></div>`;
      }
      if (wT > 0) {
        const p = week / wT;
        h += `<div class="goal"><div class="ring-wrap">${ring(p, "var(--gold)")}<span class="ring-pct">${Math.round(p*100)}%</span></div>
          <div class="gt"><div class="gk">This week</div><div class="gv">${week} / ${wT}</div>
          <div class="gs">${week>=wT?"weekly goal met ✨":(wT-week)+" to go"}</div></div></div>`;
      }
      h += `</div>`;
    } else {
      h += `<div class="goals"><div class="goal goal-empty">Set a <button class="link" data-open-profile="1">daily & weekly target</button> to track your pace here.</div></div>`;
    }

    // stat tiles
    h += `<div class="grid-stats">
      <div class="stat"><div class="k">Total logged</div><div class="v">${gt}</div><div class="s">questions, all areas</div></div>
      <div class="stat"><div class="k">Day streak</div><div class="v" style="color:var(--gold)">${st}</div><div class="s">${st>0?"consecutive active days":"log today to start one"}</div></div>
      <div class="stat"><div class="k">Syllabus covered</div><div class="v">${Math.round(touched/totalTopics*100)}<span style="font-size:18px">%</span></div><div class="s">${touched} / ${totalTopics} topics touched</div></div>
      <div class="stat"><div class="k">${dl===null?"Exam":dl>0?"Countdown":"Exam"}</div><div class="v">${dl===null?"—":Math.abs(dl)}</div><div class="s">${dl===null?"set your date":dl>0?"days remaining":dl===0?"today — good luck!":"days ago"}</div></div>
    </div>`;

    // breakdown
    const secs = bySub.map(s => ({ s, n: sectionTotal(s) }));
    const max = Math.max(1, ...secs.map(x => x.n));
    h += `<div class="panel"><h3>Effort by area</h3><p class="sub">Where your practice has gone. Keep all four areas moving.</p><div class="breakdown">`;
    secs.forEach(({ s, n }) => {
      const pct = n===0 ? 2 : Math.round(n/max*100), share = gt>0 ? Math.round(n/gt*100) : 0;
      h += `<div class="bd-row" style="--rc:${s.color}">
        <span class="bl"><span class="d"></span>${esc(s.title)}</span>
        <span class="track"><i style="width:${pct}%"></i></span>
        <span class="bv">${n} <span style="color:var(--ink-faint);font-weight:600">· ${share}%</span></span></div>`;
    });
    h += `</div></div>`;

    // 7-day
    h += `<div class="panel"><h3>Last 7 days</h3><p class="sub">Questions logged each day.</p><div class="spark">`;
    const now = new Date(); now.setHours(0,0,0,0);
    const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const arr = [];
    for (let i=6;i>=0;i--){ const dd=new Date(now); dd.setDate(now.getDate()-i); arr.push({ label:i===0?"Today":wd[dd.getDay()], n:state.daily[dkey(dd)]||0, today:i===0 }); }
    const dmax = Math.max(1, ...arr.map(a=>a.n));
    arr.forEach(a => {
      const hp = a.n===0 ? 3 : Math.max(8, Math.round(a.n/dmax*100));
      h += `<div class="bcol ${a.n>0?"has":""} ${a.today?"today":""}"><span class="bn">${a.n||""}</span><div class="b" style="height:${hp}%"></div><span class="bd">${a.label}</span></div>`;
    });
    h += `</div></div>`;

    if (dl !== null && dl > 0) {
      h += `<div class="panel"><h3>Pacing</h3><p class="sub" style="margin:0">You have <b style="color:var(--ink)">${dl} day${dl===1?"":"s"}</b> to go.
        ${gt>0?`You've logged <b style="color:var(--ink)">${gt}</b> questions so far` : `A common benchmark is 1,500–2,000 practice questions before test day`} — steady daily reps across all four areas keep every topic warm.</p></div>`;
    }
    h += `<p class="footnote">Progress saves on this device · GMAT Focus Edition</p>`;
    return h;
  }

  /* ===================== Profile ===================== */
  function profileHTML() {
    const st = streak(), gt = grandTotal(), today = todayTotal(), week = weekTotal();
    const dT = state.targets.daily || 0, wT = state.targets.weekly || 0, dl = daysLeft();
    const themePref = localStorage.getItem("gmat_theme") || "system";

    let h = `<section class="panel"><div class="pf-id">
      <div class="big">${state.name ? esc(state.name.trim()[0].toUpperCase()) : ICON.person}</div>
      <div><div class="nm">${state.name ? esc(state.name) : "Your Study Log"}</div>
      <div class="meta">${dl===null ? "No exam date set" : dl>0 ? `Exam in ${dl} days · ${esc(new Date(state.examDate+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))}` : "Exam date passed"}</div>
      <div class="pf-chips"><span class="chip hot">🔥 ${st}-day streak</span><span class="chip">${gt} logged</span></div></div>
    </div></section>`;

    // details
    h += `<section class="panel"><h3>Details</h3><p class="sub">Your name and target exam date.</p>
      <div class="field"><label for="pf-name">Name</label><input id="pf-name" type="text" value="${esc(state.name)}" placeholder="Your name" autocomplete="off"/></div>
      <div class="field"><label for="pf-date">Exam date</label><input id="pf-date" type="date" value="${esc(state.examDate)}"/></div>
      <button class="btn-primary" data-save-details="1">Save details</button></section>`;

    // targets
    h += `<section class="panel"><h3>Daily & weekly targets</h3><p class="sub">How many questions you aim to practise. These drive the rings and the calendar colours.</p>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Daily target</div><div class="tgt-s">questions per day</div></div>
        <div class="stepper"><button class="step minus" data-tgt="daily" data-d="-5">−</button><span class="tgt-val">${dT}</span><button class="step" data-tgt="daily" data-d="5">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${dT?Math.min(100,Math.round(today/dT*100)):0}%"></i></div>
        <div class="tgt-cap"><span>Today</span><span>${today} / ${dT||"—"}</span></div></div>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Weekly target</div><div class="tgt-s">questions this week (Mon–Sun)</div></div>
        <div class="stepper"><button class="step minus" data-tgt="weekly" data-d="-10">−</button><span class="tgt-val">${wT}</span><button class="step" data-tgt="weekly" data-d="10">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${wT?Math.min(100,Math.round(week/wT*100)):0}%;background:var(--gold)"></i></div>
        <div class="tgt-cap"><span>This week</span><span>${week} / ${wT||"—"}</span></div></div></section>`;

    // calendar
    h += `<section class="panel"><h3>Activity calendar</h3><p class="sub">Every day you log questions, coloured by how close you got to your daily target.</p>${calendarHTML()}</section>`;

    // appearance
    h += `<section class="panel"><h3>Appearance</h3><p class="sub">Choose how the app looks.</p>
      <div class="seg">
        <button data-theme-set="light" class="${themePref==='light'?'on':''}">Light</button>
        <button data-theme-set="dark" class="${themePref==='dark'?'on':''}">Dark</button>
        <button data-theme-set="system" class="${themePref==='system'?'on':''}">System</button>
      </div></section>`;

    // danger
    h += `<section class="panel"><h3>Reset</h3><p class="sub">Clear every logged question. Your name, exam date and targets stay.</p>
      <button class="btn-danger" data-reset="1">Reset all logged questions</button></section>`;

    return h;
  }

  function calendarHTML() {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    const first = new Date(y, m, 1), lead = first.getDay(), days = new Date(y, m+1, 0).getDate();
    const title = calCursor.toLocaleDateString(undefined, { month:"long", year:"numeric" });
    const tk = dkey();
    const nextDisabled = (y > new Date().getFullYear() || (y === new Date().getFullYear() && m >= new Date().getMonth())) ? "disabled" : "";
    let h = `<div class="cal-head"><span class="cal-title">${esc(title)}</span>
      <button class="cal-nav" data-cal="-1" title="Previous month">‹</button>
      <button class="cal-nav" data-cal="1" ${nextDisabled} title="Next month">›</button></div><div class="cal-grid">`;
    ["S","M","T","W","T","F","S"].forEach(d => h += `<div class="cal-dow">${d}</div>`);
    for (let i=0;i<lead;i++) h += `<div class="cal-cell blank"></div>`;
    for (let d=1;d<=days;d++){
      const key = dkey(new Date(y, m, d)), c = state.daily[key] || 0, lvl = heatLevel(c);
      const isToday = key === tk ? " today" : "";
      h += `<div class="cal-cell hl${lvl}${isToday}" title="${c} question${c===1?"":"s"} on ${esc(new Date(y,m,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}))}">${d}</div>`;
    }
    h += `</div><div class="cal-legend">Less <i class="hl0"></i><i class="hl1"></i><i class="hl2"></i><i class="hl3"></i><i class="hl4"></i> More</div>`;
    return h;
  }

  function renderProfile() { document.getElementById("pf-body").innerHTML = profileHTML(); }

  function openProfile() { calCursor = new Date(); calCursor.setDate(1); renderProfile(); document.getElementById("profile").hidden = false; document.body.style.overflow = "hidden"; }
  function closeProfile() { document.getElementById("profile").hidden = true; document.body.style.overflow = ""; render(); }

  /* ===================== Events ===================== */
  // view delegation
  document.getElementById("view").addEventListener("click", (e) => {
    const l = e.target.closest("[data-log]"); if (l) { log(l.getAttribute("data-log"), parseInt(l.getAttribute("data-d"),10)); return; }
    const c = e.target.closest("[data-collapse]"); if (c) { const k=c.getAttribute("data-collapse"); state.collapsed[k]=!state.collapsed[k]; save(); renderView(); return; }
    const p = e.target.closest("[data-open-profile]"); if (p) { openProfile(); }
  });

  // profile delegation
  document.getElementById("profile").addEventListener("click", (e) => {
    const tgt = e.target.closest("[data-tgt]");
    if (tgt) { const key=tgt.getAttribute("data-tgt"), d=parseInt(tgt.getAttribute("data-d"),10);
      state.targets[key] = Math.max(0, (state.targets[key]||0)+d); save(); renderProfile(); return; }
    if (e.target.closest("[data-save-details]")) {
      state.name = document.getElementById("pf-name").value.trim();
      state.examDate = document.getElementById("pf-date").value || "";
      save(); renderTop(); renderProfile(); return;
    }
    const th = e.target.closest("[data-theme-set]");
    if (th) { const v=th.getAttribute("data-theme-set"); setTheme(v); renderProfile(); return; }
    const cal = e.target.closest("[data-cal]");
    if (cal) { calCursor.setMonth(calCursor.getMonth() + parseInt(cal.getAttribute("data-cal"),10)); renderProfile(); return; }
    if (e.target.closest("[data-reset]")) {
      if (confirm("Reset every logged question to zero? Name, exam date and targets stay. This cannot be undone.")) {
        state.counts = {}; state.daily = {}; save(); renderProfile();
      }
    }
  });

  document.getElementById("btn-profile").onclick = openProfile;
  document.getElementById("tb-count").onclick = openProfile;
  document.getElementById("pf-close").onclick = closeProfile;

  // onboarding
  document.getElementById("ob-save").onclick = () => {
    state.name = document.getElementById("ob-name").value.trim();
    state.examDate = document.getElementById("ob-date").value || "";
    save(); document.getElementById("onboard").hidden = true; render();
  };

  /* ===================== Theme ===================== */
  function setTheme(v) {
    if (v === "system") { document.documentElement.removeAttribute("data-theme"); try { localStorage.setItem("gmat_theme","system"); } catch(e){} }
    else { document.documentElement.setAttribute("data-theme", v); try { localStorage.setItem("gmat_theme", v); } catch(e){} }
  }
  (function initTheme(){ const t = localStorage.getItem("gmat_theme"); if (t && t !== "system") document.documentElement.setAttribute("data-theme", t); })();

  /* ===================== Boot ===================== */
  function render() { renderTop(); renderBotnav(); renderView(); }
  render();
  if (!state.examDate && !state.name) document.getElementById("onboard").hidden = false;
})();
</script>

<script>
/* PWA: install prompt + offline service worker */
(function () {
  "use strict";
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  // capture install prompt so it can be offered from the profile later if desired
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__gmatInstall = e; });
})();
</script>
