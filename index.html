<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GMAT Prep Tracker</title>
<meta name="description" content="Track your GMAT Focus Edition prep — exam countdown, daily & weekly targets, per-topic accuracy, weak-spot focus areas, and an activity calendar." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#E6EDFA" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#070C17" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GMAT Prep" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="stylesheet" href="katex/katex.min.css" />
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --paper:#E6EDFA; --surface:rgba(255,255,255,.86); --surface-2:rgba(255,255,255,.66); --ink:#111B31;
    --ink-soft:#2F3B52; --ink-faint:#55617A; --line:rgba(70,90,130,.16); --line-soft:rgba(70,90,130,.09);
    --accent:#2563EB; --accent-ink:#1D4ED8; --accent-wash:rgba(37,99,235,.12);
    --gold:#0E7490; --gold-wash:rgba(14,116,137,.12);
    --good:#2F8F6B; --warn:#B0791E; --bad:#C1553B;
    --c-quant:#2563EB; --c-data:#0EA5E9; --c-overall:#1E3A8A; --c-verbal:#4F46E5; --c-cr:#6366F1;
    --glass-hi:rgba(255,255,255,.85); --bar:rgba(255,255,255,.74); --blur:saturate(185%) blur(22px);
    --radius:17px; --radius-s:11px;
    --shadow:0 1px 1px rgba(20,25,40,.04),0 14px 34px -16px rgba(20,25,40,.22);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#070C17; --surface:rgba(30,42,63,.78); --surface-2:rgba(255,255,255,.06); --ink:#E7ECF5;
      --ink-soft:#C2CBDC; --ink-faint:#939EB4; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
      --accent:#5B9BF3; --accent-ink:#93BEFA; --accent-wash:rgba(91,155,243,.16);
      --gold:#38BDF8; --gold-wash:rgba(56,189,248,.14);
      --good:#5FC79E; --warn:#D8A64A; --bad:#E08869;
      --c-quant:#5B9BF3; --c-data:#4FC3F7; --c-overall:#8AB0F5; --c-verbal:#8A93F0; --c-cr:#9BA6F7;
      --glass-hi:rgba(255,255,255,.16); --bar:rgba(11,18,33,.76);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 38px -18px rgba(0,0,0,.72);
    }
  }
  :root[data-theme="light"] {
    --paper:#E6EDFA; --surface:rgba(255,255,255,.86); --surface-2:rgba(255,255,255,.66); --ink:#111B31;
    --ink-soft:#2F3B52; --ink-faint:#55617A; --line:rgba(70,90,130,.16); --line-soft:rgba(70,90,130,.09);
    --accent:#2563EB; --accent-ink:#1D4ED8; --accent-wash:rgba(37,99,235,.12);
    --gold:#0E7490; --gold-wash:rgba(14,116,137,.12);
    --good:#2F8F6B; --warn:#B0791E; --bad:#C1553B;
    --c-quant:#2563EB; --c-data:#0EA5E9; --c-overall:#1E3A8A; --c-verbal:#4F46E5; --c-cr:#6366F1;
    --glass-hi:rgba(255,255,255,.85); --bar:rgba(255,255,255,.74);
    --shadow:0 1px 1px rgba(20,25,40,.04),0 14px 34px -16px rgba(20,25,40,.22);
  }
  :root[data-theme="dark"] {
    --paper:#070C17; --surface:rgba(30,42,63,.78); --surface-2:rgba(255,255,255,.06); --ink:#E7ECF5;
    --ink-soft:#C2CBDC; --ink-faint:#939EB4; --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055);
    --accent:#5B9BF3; --accent-ink:#93BEFA; --accent-wash:rgba(91,155,243,.16);
    --gold:#38BDF8; --gold-wash:rgba(56,189,248,.14);
    --good:#5FC79E; --warn:#D8A64A; --bad:#E08869;
    --c-quant:#5B9BF3; --c-data:#4FC3F7; --c-overall:#8AB0F5; --c-verbal:#8A93F0; --c-cr:#9BA6F7;
    --glass-hi:rgba(255,255,255,.16); --bar:rgba(11,18,33,.76);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 38px -18px rgba(0,0,0,.72);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  /* Liquid-glass ambient backdrop — soft coloured light the frosted panels refract. */
  body::before {
    content: ""; position: fixed; inset: -12%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 32% at 12% 4%, rgba(59,130,246,.22), transparent 62%),
      radial-gradient(34% 30% at 90% 8%, rgba(99,102,241,.20), transparent 62%),
      radial-gradient(44% 42% at 50% 106%, rgba(14,165,233,.18), transparent 60%),
      radial-gradient(30% 34% at 94% 80%, rgba(139,92,246,.14), transparent 60%),
      radial-gradient(28% 30% at 4% 68%, rgba(16,185,129,.10), transparent 60%);
    background-attachment: fixed;
  }
  /* Frosted glass on the primary surfaces (the essence of the Liquid Glass look). */
  .topbar, .botnav, .panel, .qcard, .fc-card, .modal, .pf-head, .stat, .goal,
  .rc-passage, .rn-score, .cta-session, .btn-soft, .seg, .modebtn, .fc-modebtn,
  .sc-seg button, .navbtn, .fc-nav button, .cn-nav button, .jchip, .av-chip,
  .cn-tocrow, .fc-deckrow, .setrow, .subject, .task, .badge, .goal, .modechooser {
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  }
  /* Bright top rim (specular highlight) on the main cards. */
  .panel, .qcard, .fc-card, .stat, .goal, .rc-passage, .rn-score {
    box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
  }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--bar); border-bottom: 1px solid var(--line); }
  .tb-inner { max-width: 940px; margin: 0 auto; padding: 11px 18px; display: flex; align-items: center; gap: 14px; }
  .tb-count { display: flex; align-items: center; gap: 11px; margin-right: auto; background: none; border: none; padding: 4px 6px; border-radius: 12px; text-align: left; }
  .tb-count:hover { background: var(--surface-2); }
  .tb-days { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--gold); line-height: 1; letter-spacing: -.02em; }
  .tb-days.past { color: var(--c-verbal); }
  .tb-meta { display: flex; flex-direction: column; gap: 1px; }
  .tb-meta .l { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .tb-meta .d { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--accent-wash); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 700; font-size: 16px; font-family: var(--serif); display: grid; place-items: center; transition: .15s; }
  .avatar:hover { filter: brightness(.97); }
  .avatar svg { width: 20px; height: 20px; }
  .tb-trophy { position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--surface-2); border: 1px solid var(--line); font-size: 19px; line-height: 1; display: grid; place-items: center; cursor: pointer; transition: .15s; }
  .tb-trophy:hover { filter: brightness(.97); }
  .tb-trophy .dot { position: absolute; top: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
  .tb-trophy.alldone { background: linear-gradient(135deg, #FFD65A, #F5A623); border-color: #E9A00E; box-shadow: 0 0 0 3px color-mix(in srgb, #F5A623 22%, transparent); }
  .tb-trophy.alldone .dot { display: none; }
  /* topbar layout: trophy sits right before the avatar */
  .tb-inner .tb-trophy + .avatar { margin-left: 8px; }

  /* Achievements page */
  .av-hero { text-align: center; padding: 6px 0 18px; }
  .av-trophy { font-size: 52px; line-height: 1; filter: drop-shadow(0 6px 14px color-mix(in srgb, #F5A623 40%, transparent)); }
  .av-lvl { font-family: var(--serif); font-size: 24px; font-weight: 600; margin-top: 8px; }
  .av-xpbar { height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin: 12px auto 6px; max-width: 320px; }
  .av-xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--c-overall)); border-radius: 5px; transition: width .3s; }
  .av-xpsub { font-size: 13.5px; color: var(--ink-faint); }
  .av-chips { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .av-chip { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
  .av-panel { margin-top: 14px; }
  .av-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .av-head h3 { margin: 0; }
  .av-count { margin-left: auto; font-weight: 800; font-size: 14.5px; color: var(--ink-soft); background: var(--surface-2); padding: 3px 10px; border-radius: 999px; }
  .av-count.all { color: #fff; background: var(--good); }
  .av-prog { height: 8px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-bottom: 12px; }
  .av-prog i { display: block; height: 100%; background: var(--good); border-radius: 5px; transition: width .3s; }
  .av-done-note { color: var(--good); font-weight: 700; font-size: 14.5px; margin: -4px 0 12px; }
  .av-reset { font-size: 13px; color: var(--ink-faint); margin: 12px 0 0; text-align: center; }
  .tasks { display: flex; flex-direction: column; gap: 9px; }
  .task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .task.done { background: color-mix(in srgb, var(--good) 9%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, var(--line)); }
  .task-ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; background: var(--surface-2); }
  .task.done .task-ic { background: var(--good); color: #fff; font-weight: 800; }
  .task-meta { min-width: 0; flex: 1; }
  .task-lbl { font-weight: 700; font-size: 14px; }
  .task.done .task-lbl { color: var(--ink-soft); }
  .task-sub { font-size: 13.5px; color: var(--ink-faint); margin-top: 2px; }
  .task-bar { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 7px; }
  .task-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { text-align: center; padding: 14px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); opacity: .55; filter: grayscale(1); }
  .badge.got { opacity: 1; filter: none; background: color-mix(in srgb, var(--gold) 10%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
  .badge-ic { font-size: 26px; line-height: 1; }
  .badge-lbl { display: block; font-size: 13px; font-weight: 700; margin-top: 7px; color: var(--ink-soft); }
  .badge.got .badge-lbl { color: var(--ink); }

  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 18px 40px; }

  /* Bottom nav */
  .botnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bar); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); display: flex; justify-content: center; }
  .botnav-inner { width: 100%; max-width: 500px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
  .bn { border: none; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-faint); font-size: 12px; font-weight: 700; transition: color .15s; }
  .bn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bn.active { color: var(--tabc); }
  .bn.center { position: relative; }
  .bn.center .hub { width: 54px; height: 54px; border-radius: 50%; margin-top: -24px; margin-bottom: 2px; background: var(--c-overall); color: #fff; display: grid; place-items: center; border: 4px solid var(--paper); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--c-overall) 70%, transparent); transition: transform .15s; }
  .bn.center .hub svg { width: 26px; height: 26px; stroke-width: 2; }
  .bn.center.active { color: var(--c-overall); }
  .bn.center.active .hub { transform: translateY(-2px); }

  /* Section head */
  .sec-head { margin: 4px 0 6px; }
  .sec-head h2 { font-family: var(--serif); font-size: 25px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; display: flex; align-items: center; gap: 11px; }
  .sec-head h2 .bar { width: 6px; height: 24px; border-radius: 3px; background: var(--secc); flex: none; }
  .sec-head p { margin: 8px 0 0; color: var(--ink-soft); max-width: 62ch; font-size: 14.5px; }
  .sec-head p.sec-exam { font-size: 14.5px; font-weight: 600; color: var(--ink-soft); margin-top: 7px; }
  .sec-stat { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 13px; font-size: 14.5px; color: var(--ink-soft); }
  .sec-stat b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sec-stat .acc { color: var(--good); }

  /* Subject cards */
  .subjects { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .subject { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .subj-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .subj-head:hover { background: var(--surface-2); }
  .subj-head .chev { color: var(--ink-faint); transition: transform .2s; font-size: 13.5px; }
  .subject.collapsed .chev { transform: rotate(-90deg); }
  .subj-head .title { font-weight: 650; font-size: 15.5px; margin-right: auto; letter-spacing: -.01em; }
  .subj-head .count { font-size: 14px; font-weight: 600; color: var(--secc); background: color-mix(in srgb, var(--secc) 12%, transparent); padding: 3px 10px; border-radius: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .subject.collapsed .topics { display: none; }

  .topic { display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-top: 1px solid var(--line-soft); }
  .topic .tname { font-size: 14px; margin-right: auto; line-height: 1.3; }
  .acts { display: flex; gap: 5px; flex: none; }
  .mk { width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 800; line-height: 1; display: grid; place-items: center; transition: .12s; }
  .mk.right { color: var(--good); }
  .mk.right:hover { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: var(--good); }
  .mk.wrong { color: var(--bad); }
  .mk.wrong:hover { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border-color: var(--bad); }
  .tstat { display: flex; flex-direction: column; align-items: flex-end; gap: 0; min-width: 50px; border: none; background: none; padding: 3px 3px; border-radius: 8px; flex: none; }
  .tstat:hover { background: var(--surface-2); }
  .tstat .td { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tstat .td.zero { color: var(--ink-faint); font-weight: 600; }
  .tstat .tacc { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .acc-hi { color: var(--good); } .acc-mid { color: var(--warn); } .acc-lo { color: var(--bad); }

  /* Goals rings */
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  /* min-width:0 — without it a grid item refuses to shrink below its content
     and the two rings push the page into a horizontal scroll on small phones. */
  .goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .goal .gt { min-width: 0; }
  .ring-wrap { position: relative; width: 66px; height: 66px; flex: none; }
  .ring { width: 66px; height: 66px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .goal .gk { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; }
  .goal .gv { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .goal .gs { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; }
  .goal-empty { grid-column: 1 / -1; }
  .link { color: var(--accent); font-weight: 700; background: none; border: none; padding: 0; text-decoration: underline; font-size: inherit; cursor: pointer; }

  /* Stats / panels */
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .stat .v { font-family: var(--serif); font-size: 32px; font-weight: 600; margin-top: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 14px; color: var(--ink-soft); margin-top: 5px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 17px 19px; margin-top: 14px; }
  .panel h3 { margin: 0 0 3px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .panel .sub { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 14px; }
  /* Numbered section header used on each subject tab (Concepts / Practice / Logged).
     A full-width colored band tinted with the section's own accent gives the
     app contrast and makes the three sections read at a glance. */
  .pf-adv { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; vertical-align: 2px;
    padding: 3px 7px; border-radius: 999px; margin-left: 7px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink-faint); }
  .ai-status { font-size: 13.5px; font-weight: 600; margin: 12px 0 0; color: var(--ink-faint); }
  .ai-status.ok { color: var(--good); }
  .ai-status.bad { color: var(--bad); }
  /* ---- Difficulty recalibrated from your own results ---- */
  /* A recalibrated level is marked with words, not a caret: a dashed outline
     plus a "▾" read as a dropdown the user was meant to operate. */
  .lvl-recal i { font-style: normal; font-weight: 700; margin-left: 4px; opacity: .72; }
  .recal { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--secc, var(--accent)) 38%, var(--line)); background: color-mix(in srgb, var(--secc, var(--accent)) 6%, var(--surface)); }
  .recal h4 { margin: 0 0 4px; font-size: 14px; font-weight: 800; color: color-mix(in srgb, var(--secc, var(--accent)) 60%, var(--ink)); }
  .recal p { margin: 0 0 9px; font-size: 13px; color: var(--ink-faint); line-height: 1.45; }
  .recal ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .recal li { font-size: 13.5px; color: var(--ink-soft); display: flex; align-items: baseline; gap: 7px; }
  .recal li b { font-weight: 700; color: var(--ink); }
  .recal .rdir { flex: none; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
  .recal .rdir.up { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
  .recal .rdir.down { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
  /* ---- Generate practice ---- */
  .gen-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 14px; }
  .gen-chip { font: inherit; font-size: 13.5px; font-weight: 650; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); transition: background .15s, border-color .15s, color .15s; }
  .gen-chip[aria-pressed="true"] { background: color-mix(in srgb, var(--secc, var(--accent)) 16%, var(--surface));
    border-color: color-mix(in srgb, var(--secc, var(--accent)) 55%, var(--line)); color: color-mix(in srgb, var(--secc, var(--accent)) 70%, var(--ink)); }
  .gen-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
  .gen-row label { font-size: 13.5px; font-weight: 650; color: var(--ink-faint); }
  .gen-row select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .gen-go { font: inherit; font-size: 14.5px; font-weight: 750; padding: 9px 16px; border-radius: 11px; cursor: pointer; border: 0;
    background: var(--secc, var(--accent)); color: #fff; margin-left: auto; }
  .gen-go[disabled] { opacity: .45; cursor: not-allowed; }
  .gen-note { font-size: 13px; color: var(--ink-faint); margin: 11px 0 0; line-height: 1.45; }
  /* Progress & stats: one toggle instead of four dashboards on first load. */
  .prog-toggle { display: flex; align-items: center; gap: 10px; width: 100%; margin: 0 0 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .prog-toggle:hover { border-color: color-mix(in srgb, var(--c-overall) 40%, var(--line)); }
  .prog-toggle .t { font-weight: 700; font-size: 15px; }
  .prog-toggle .s { flex: 1; color: var(--ink-faint); font-size: 13px; }
  .prog-toggle .chev { flex: none; color: var(--ink-faint); transition: transform .2s; }
  .prog-toggle.on .chev { transform: rotate(180deg); }
  .prog-toggle:focus-visible { outline: 2px solid var(--c-overall); outline-offset: 1px; }

  /* Sub-nav: one pane of a subject tab at a time. */
  /* Wraps rather than scrolls: five labels do not fit one row on a 320px phone,
     and a row that scrolls sideways hides the last tab with no affordance. */
  .subnav { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; padding: 4px; background: var(--surface-2, color-mix(in srgb, var(--ink) 5%, var(--surface))); border: 1px solid var(--line); border-radius: 12px; }
  .subnav-b { flex: 1 1 auto; min-width: max-content; padding: 8px 12px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-faint); font: inherit; font-size: 14px; font-weight: 650; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .subnav-b:hover { color: var(--ink); }
  .subnav-b.on { background: var(--surface); color: color-mix(in srgb, var(--secc, var(--accent)) 78%, var(--ink)); box-shadow: 0 1px 2px rgba(0,0,0,.09); }
  .subnav-b:focus-visible { outline: 2px solid var(--secc, var(--accent)); outline-offset: 1px; }
  .tabsec-head.plain .tabsec-meta { flex: none; align-self: flex-start; }
  .tabsec { scroll-margin-top: 70px; padding-top: 0; overflow: hidden; }
  .tabsec-head { display: flex; align-items: center; gap: 12px; margin: 0 -19px 16px; padding: 13px 17px; background: linear-gradient(135deg, color-mix(in srgb, var(--secc, var(--accent)) 20%, var(--surface)), color-mix(in srgb, var(--secc, var(--accent)) 8%, var(--surface))); border-bottom: 1px solid color-mix(in srgb, var(--secc, var(--accent)) 22%, var(--line)); }
  .tabsec-head[data-tabsec] { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .tabsec-head[data-tabsec]:hover { background: linear-gradient(135deg, color-mix(in srgb, var(--secc, var(--accent)) 26%, var(--surface)), color-mix(in srgb, var(--secc, var(--accent)) 11%, var(--surface))); }
  .tabsec-chev { flex: none; margin-left: 6px; color: color-mix(in srgb, var(--secc, var(--accent)) 60%, var(--ink-faint)); font-size: 15px; transition: transform .2s; }
  .tabsec.collapsed .tabsec-chev { transform: rotate(-90deg); }
  .tabsec.collapsed { padding-bottom: 0; }
  .tabsec.collapsed .tabsec-head { margin-bottom: 0; }
  .tabsec.collapsed .tabsec-body { display: none; }
  .tabsec-n { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--secc, var(--accent)); color: #fff; font-weight: 800; font-size: 15px; display: grid; place-items: center; box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--secc, var(--accent)) 60%, transparent); }
  .tabsec-n svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tabsec-h { min-width: 0; margin-right: auto; }
  .tabsec-h h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; color: color-mix(in srgb, var(--secc, var(--accent)) 62%, var(--ink)); }
  .tabsec-h p { color: color-mix(in srgb, var(--ink) 88%, var(--secc, var(--accent))); font-size: 14.5px; font-weight: 500; line-height: 1.4; margin: 3px 0 0; }
  .tabsec-meta { flex: none; }

  .breakdown { display: flex; flex-direction: column; gap: 13px; }
  .bd-row { display: grid; grid-template-columns: 128px 1fr auto; gap: 12px; align-items: center; }
  .bd-row .bl { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .bd-row .bl .d { width: 9px; height: 9px; border-radius: 50%; background: var(--rc); flex: none; }
  .track { height: 9px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--rc); border-radius: 6px; transition: width .5s ease; }
  .bd-row .bv { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; min-width: 74px; text-align: right; }
  .bd-row .bv .ac { font-weight: 700; font-size: 13.5px; }

  /* Focus areas */
  .focus { display: flex; flex-direction: column; }
  .focus-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line-soft); }
  .focus-row:first-child { border-top: none; }
  .focus-row .fn { font-size: 15px; margin-right: auto; min-width: 0; }
  .focus-row .fn .fq { display: block; font-size: 12.5px; color: var(--ink-faint); margin-top: 1px; }
  .fchip { font-size: 12.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: color-mix(in srgb, var(--fc) 14%, transparent); color: var(--fc); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
  .focus-row .facc { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }

  .spark { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin-top: 4px; }
  .spark .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .spark .bcol .b { width: 100%; max-width: 40px; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 6px 6px 3px 3px; min-height: 3px; transition: height .4s ease; }
  .spark .bcol.has .b { background: var(--accent); border-color: var(--accent); }
  .spark .bcol .bn { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; height: 13px; }
  .spark .bcol .bd { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .spark .bcol.today .bd { color: var(--accent); font-weight: 700; }

  /* Profile */
  .profile { position: fixed; inset: 0; z-index: 70; background: var(--bar); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .profile[hidden] { display: none; }
  .pf-head { position: sticky; top: 0; z-index: 2; background: var(--bar); border-bottom: 1px solid var(--line); }
  .pf-head-in { max-width: 640px; margin: 0 auto; padding: 13px 18px; display: flex; align-items: center; gap: 12px; }
  .pf-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .pf-close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
  .pf-close:hover { color: var(--ink); border-color: var(--ink-faint); }
  .pf-body { max-width: 640px; margin: 0 auto; padding: 18px 18px 60px; display: flex; flex-direction: column; gap: 14px; }
  .pf-id { display: flex; align-items: center; gap: 15px; }
  .pf-id .big { width: 58px; height: 58px; border-radius: 50%; flex: none; background: var(--accent-wash); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-family: var(--serif); font-size: 24px; font-weight: 600; display: grid; place-items: center; }
  .pf-id .big svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .pf-id .nm { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .pf-id .meta { font-size: 14.5px; color: var(--ink-soft); margin-top: 2px; }
  .pf-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 13.5px; font-weight: 700; padding: 4px 11px; border-radius: 20px; background: var(--surface-2); color: var(--ink-soft); }
  .chip.hot { background: var(--gold-wash); color: var(--gold); }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: inherit; background: var(--paper); color: var(--ink); }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .tgt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .tgt-row:first-of-type { border-top: none; }
  .tgt-info { margin-right: auto; }
  .tgt-k { font-weight: 650; font-size: 14.5px; }
  .tgt-s { font-size: 14px; color: var(--ink-soft); }
  .tgt-val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; min-width: 34px; text-align: center; }
  .tgt-prog { margin-top: 4px; }
  .tgt-bar { height: 7px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin-top: 7px; }
  .tgt-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .5s ease; }
  .tgt-cap { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; display: flex; justify-content: space-between; }

  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-title { font-weight: 700; margin-right: auto; font-size: 14.5px; }
  .cal-nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
  .cal-nav:hover { color: var(--ink); border-color: var(--ink-faint); }
  .cal-nav:disabled { opacity: .35; cursor: not-allowed; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); text-align: center; font-weight: 700; padding-bottom: 3px; }
  .cal-cell { aspect-ratio: 1; border-radius: 7px; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 5px; font-size: 12px; font-weight: 700; }
  .cal-cell.blank { background: none; }
  .cal-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hl0 { background: var(--surface-2); color: var(--ink-faint); }
  .hl1 { background: color-mix(in srgb, var(--accent) 26%, var(--surface)); color: var(--ink-soft); }
  .hl2 { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); color: var(--ink); }
  .hl3 { background: color-mix(in srgb, var(--accent) 72%, var(--surface)); color: #fff; }
  .hl4 { background: var(--accent); color: #fff; }
  .cal-legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 12px; font-size: 12.5px; color: var(--ink-faint); }
  .cal-legend i { width: 15px; height: 15px; border-radius: 4px; display: inline-block; }

  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); padding: 9px; border-radius: 10px; font-size: 15px; font-weight: 600; transition: .12s; }
  .seg button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

  .pf-actions { display: flex; gap: 10px; }
  .pf-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; font-size: 14px; padding: 4px 0; }
  .pf-toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
  .pf-remrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--ink-soft); font-weight: 600; }
  .pf-remrow input[type=time] { font-family: inherit; font-size: 15px; font-weight: 700; padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .btn-soft { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px; border-radius: 11px; font-weight: 650; font-size: 15px; transition: .12s; }
  .btn-soft:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 11px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; transition: .15s; }
  .btn-primary:not(:disabled):hover { background: var(--accent-ink); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; background: var(--ink-faint); box-shadow: none; }

  /* Achievement celebration toasts */
  .ach-wrap { position: fixed; top: calc(env(safe-area-inset-top,0px) + 12px); left: 0; right: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }
  .ach-toast { pointer-events: auto; width: 100%; max-width: 400px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 15px; background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 32px -8px color-mix(in srgb, var(--gold) 42%, transparent), var(--shadow); animation: achpop .38s cubic-bezier(.2,.8,.3,1.2); }
  .ach-toast.out { animation: achout .3s ease forwards; }
  @keyframes achpop { from { opacity: 0; transform: translateY(-14px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes achout { to { opacity: 0; transform: translateY(-10px) scale(.97); } }
  .ach-ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--gold) 20%, var(--surface)); box-shadow: 0 2px 10px -3px color-mix(in srgb, var(--gold) 60%, transparent); }
  .ach-meta { min-width: 0; margin-right: auto; }
  .ach-kind { display: block; font-size: 12.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: color-mix(in srgb, var(--gold) 60%, var(--ink)); }
  .ach-lbl { display: block; font-size: 14.5px; font-weight: 750; color: var(--ink); margin-top: 1px; }
  .ach-x { flex: none; color: var(--ink-faint); font-size: 20px; line-height: 1; background: none; border: none; padding: 0 2px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .ach-toast, .ach-toast.out { animation: none; } }

  /* ---------- Nico — draggable mascot ---------- */
  /* Nico and his kennel are stacked on the same spot so he can walk into it. */
  #nico-zone { position: fixed; left: 6px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: 62px; height: 74px; z-index: 90; pointer-events: none; touch-action: none; }
  #nico { position: absolute; left: 0; bottom: 0; width: 100%; border: none; background: none; padding: 0; pointer-events: auto; cursor: grab; -webkit-tap-highlight-color: transparent; touch-action: none; filter: drop-shadow(0 6px 9px rgba(0,0,0,.22)); opacity: .96; transition: opacity .25s ease; }
  #nico:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  #nico.nico-away { opacity: 0; }
  /* being dragged */
  #nico-zone.dragging { transition: none; }
  #nico-zone.dragging #nico { cursor: grabbing; animation: none !important; transform: scale(1.12); filter: drop-shadow(0 12px 16px rgba(0,0,0,.3)); }
  /* long-press build-up before he heads to bed */
  #nico.charging { animation: nico-charge 3s ease-in forwards; }
  @keyframes nico-charge { 0% { transform: scale(1); } 60% { transform: scale(.94) rotate(-2deg); } 100% { transform: scale(.9) rotate(2deg); } }
  /* Full-screen overlays cover the app, so Nico steps aside — except in
     practice mode, where he stays on screen as your study buddy. */
  body:has(.profile:not([hidden])) #nico-zone,
  body:has(.scrim:not([hidden])) #nico-zone { opacity: 0; pointer-events: none; }
  body.nico-stay:has(.profile:not([hidden])) #nico-zone { opacity: 1; }
  body:has(.profile:not([hidden])) #nico-zone.nico-show { opacity: 1; }
  .nico-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .nico-tail { transform-origin: 120px 138px; animation: nico-wag 1.5s ease-in-out infinite; }
  @keyframes nico-wag { 0%,100% { transform: rotate(2deg); } 50% { transform: rotate(-18deg); } }
  .nico-head { transform-origin: 80px 106px; animation: nico-breathe 3.4s ease-in-out infinite; }
  @keyframes nico-breathe { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(1.4px) rotate(-1deg); } }
  .nico-tongue { display: none; }
  #nico.happy .nico-tongue { display: block; }
  #nico.happy .nico-tail { animation-duration: .34s; }

  /* --- Celebration moves (one is picked at random on a right answer) --- */
  #nico.nod    { animation: nico-hop .55s ease; }
  #nico.jump   { animation: nico-jump .72s cubic-bezier(.3,.9,.4,1); }
  #nico.flip   { animation: nico-flip .82s cubic-bezier(.35,.7,.4,1); }
  #nico.spin   { animation: nico-spin .78s cubic-bezier(.4,.8,.4,1); }
  #nico.wiggle { animation: nico-wiggle .7s ease-in-out; }
  #nico.bounce { animation: nico-bounce .86s ease; }
  @keyframes nico-hop   { 0%,100% { transform: translateY(0); } 42% { transform: translateY(-7px); } }
  @keyframes nico-jump  { 0%,100% { transform: translateY(0) scaleY(1); } 18% { transform: translateY(2px) scaleY(.86); } 55% { transform: translateY(-34px) scaleY(1.08); } 85% { transform: translateY(0) scaleY(.94); } }
  @keyframes nico-flip  { 0% { transform: translateY(0) rotate(0); } 20% { transform: translateY(2px) scaleY(.88); } 55% { transform: translateY(-36px) rotate(-200deg); } 80% { transform: translateY(-6px) rotate(-360deg); } 100% { transform: translateY(0) rotate(-360deg); } }
  @keyframes nico-spin  { 0% { transform: translateY(0) rotateY(0); } 30% { transform: translateY(-14px) rotateY(180deg); } 60% { transform: translateY(-14px) rotateY(360deg); } 100% { transform: translateY(0) rotateY(360deg); } }
  @keyframes nico-wiggle{ 0%,100% { transform: rotate(0); } 20% { transform: rotate(-11deg); } 45% { transform: rotate(9deg); } 70% { transform: rotate(-6deg); } }
  @keyframes nico-bounce{ 0%,100% { transform: translateY(0); } 20% { transform: translateY(-22px); } 40% { transform: translateY(0); } 58% { transform: translateY(-12px); } 76% { transform: translateY(0); } 88% { transform: translateY(-5px); } }
  #nico.nod .nico-head, #nico.jump .nico-head, #nico.bounce .nico-head { animation: nico-nod .52s ease-in-out 2; }
  @keyframes nico-nod { 0%,100% { transform: rotate(0) translateY(0); } 32% { transform: rotate(9deg) translateY(5px); } 66% { transform: rotate(-3deg) translateY(-1px); } }
  /* Wrong — head shake ("no") */
  #nico.shake .nico-head { animation: nico-shake .46s ease-in-out 2; }
  @keyframes nico-shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  /* Tap — a little lunge as he barks */
  #nico.bark { animation: nico-bark .34s ease; }
  @keyframes nico-bark { 0%,100% { transform: scale(1); } 35% { transform: scale(1.14) translateY(-4px); } }
  #nico.bark .nico-head { animation: nico-barkhead .34s ease; }
  @keyframes nico-barkhead { 0%,100% { transform: rotate(0); } 40% { transform: rotate(-11deg) translateY(-3px); } }
  #nico.bark .nico-tongue { display: block; }

  /* --- Kennel / sleeping --- */
  #nico-house { display: none; position: absolute; left: -6px; bottom: 0; width: 76px; border: none; background: none; padding: 0; pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; filter: drop-shadow(0 6px 9px rgba(0,0,0,.22)); }
  #nico-house:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  .nico-house-svg { width: 100%; height: auto; display: block; overflow: visible; }
  @keyframes nico-housein { from { opacity: 0; transform: scale(.6) translateY(10px); } to { opacity: 1; transform: none; } }
  .nico-zzz { animation: nico-zzz 2.6s ease-in-out infinite; opacity: 0; }
  @keyframes nico-zzz { 0%,100% { opacity: .25; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-4px); } }
  /* Nico's sleeping head resting in the doorway — only once he's settled. */
  .nico-sleephead { opacity: 0; transition: opacity .45s ease; }
  .nico-sleephead .sh-breathe { transform-origin: 75px 112px; animation: nico-sleepbreathe 3.6s ease-in-out infinite; }
  @keyframes nico-sleepbreathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.6px) scale(1.03); } }

  /* Stage 1 — bedtime: the kennel pops up and Nico walks into it. */
  #nico-zone.bedtime #nico-house { display: block; animation: nico-housein .4s cubic-bezier(.2,.8,.3,1.2); }
  #nico-zone.bedtime #nico { animation: nico-walkin 1.5s ease-in forwards; z-index: 1; }
  @keyframes nico-walkin {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    12%  { transform: translate(2px,-3px) rotate(-3deg); }
    24%  { transform: translate(5px,0) rotate(2deg); }
    36%  { transform: translate(8px,-3px) rotate(-3deg); }
    48%  { transform: translate(11px,0) rotate(2deg); }
    60%  { transform: translate(14px,-2px) rotate(-2deg); }
    72%  { transform: translate(16px,2px) scale(.82); opacity: 1; }
    100% { transform: translate(18px,12px) scale(.24); opacity: 0; }
  }
  /* Stage 2 — asleep: kennel stays, his head rests in the doorway. */
  #nico-zone.asleep #nico { display: none; }
  #nico-zone.asleep #nico-house { display: block; }
  #nico-zone.asleep .nico-sleephead { opacity: 1; }
  #nico-zone.asleep .nico-zzz { opacity: 1; }
  /* Waking up — he pops back out of the doorway. */
  #nico.popout { animation: nico-popout .6s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes nico-popout { from { transform: translate(18px,12px) scale(.24); opacity: 0; } to { transform: none; opacity: 1; } }

  .nico-bubble { position: absolute; left: 50px; bottom: 50px; background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--line); border-radius: 12px; padding: 5px 11px; font-size: 14px; font-weight: 800; color: var(--ink); white-space: nowrap; box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); opacity: 0; transform: translateY(6px) scale(.86); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 2; }
  .nico-bubble::after { content: ""; position: absolute; left: 12px; bottom: -6px; width: 12px; height: 12px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
  .nico-bubble.show { opacity: 1; transform: none; }
  @media (max-width: 380px) { #nico-zone { width: 56px; } }
  @media (prefers-reduced-motion: reduce) { .nico-tail, .nico-head, .nico-zzz, #nico, #nico .nico-head { animation: none !important; } }
  .btn-danger { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: none; color: var(--ink-soft); font-size: 15px; font-weight: 600; }
  .btn-danger:hover { color: var(--bad); border-color: var(--bad); }

  /* Modals */
  .scrim { position: fixed; inset: 0; background: rgba(15,18,26,.45); display: grid; place-items: center; z-index: 80; padding: 20px; -webkit-backdrop-filter: blur(8px) saturate(140%); backdrop-filter: blur(8px) saturate(140%); }
  .scrim[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); }
  .modal .kick { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .modal h2 { font-family: var(--serif); font-size: 24px; margin: 6px 0 4px; font-weight: 600; letter-spacing: -.01em; }
  .modal p.lead { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
  .modal .btn-primary { margin-top: 4px; }
  .hint { font-size: 13.5px; color: var(--ink-faint); margin-top: 6px; }

  /* Log sheet */
  .ls-eyebrow { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ls-c, var(--accent)); font-weight: 700; }
  .ls-title { font-family: var(--serif); font-size: 21px; font-weight: 600; margin: 5px 0 2px; letter-spacing: -.01em; text-wrap: balance; }
  .ls-crumb { font-size: 14px; color: var(--ink-soft); margin-bottom: 18px; }
  .ls-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .ls-row .li { margin-right: auto; }
  .ls-row .lk { font-weight: 650; font-size: 14.5px; }
  .ls-row .ls { font-size: 13.5px; color: var(--ink-soft); }
  .ls-big { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 19px; min-width: 40px; text-align: center; }
  .ls-presets { display: flex; gap: 7px; margin: 14px 0 4px; }
  .ls-presets button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); padding: 8px; border-radius: 9px; font-size: 14.5px; font-weight: 700; }
  .ls-presets button:hover { border-color: var(--accent); color: var(--accent); }
  .ls-now { font-size: 14px; color: var(--ink-soft); text-align: center; margin: 16px 0 4px; }
  .ls-now b { color: var(--ink); }
  .ls-reset { display: block; margin: 12px auto 0; background: none; border: none; color: var(--ink-faint); font-size: 14px; text-decoration: underline; }
  .ls-reset:hover { color: var(--bad); }
  .step { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); height: 34px; min-width: 36px; padding: 0 9px; border-radius: 9px; font-size: 16px; font-weight: 700; transition: .12s; line-height: 1; }
  .step:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
  .step.minus { min-width: 34px; }
  .step:disabled { opacity: .35; cursor: not-allowed; background: var(--surface); color: var(--ink-faint); border-color: var(--line); }
  .stepper { display: flex; align-items: center; gap: 6px; }

  /* Practice sets list */
  .setlist { display: flex; flex-direction: column; }
  .setrow { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .setrow:first-child { border-top: none; }
  .setrow .si { margin-right: auto; min-width: 0; }
  .setrow .st { font-weight: 650; font-size: 14px; }
  .setrow .sm { font-size: 13.5px; color: var(--ink-soft); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .setbtns { display: flex; align-items: center; gap: 7px; flex: none; }
  .setrow .go { border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 8px 15px; border-radius: 9px; font-weight: 700; font-size: 14.5px; white-space: nowrap; flex: none; transition: .12s; }
  .setrow .go:hover { background: var(--accent-ink); }
  .setrow .go.done { background: var(--surface); color: var(--accent); }
  .reset-set { border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint); width: 34px; height: 34px; border-radius: 9px; font-size: 15px; flex: none; transition: .12s; }
  .reset-set:hover { color: var(--bad); border-color: var(--bad); }
  .q-reset { display: block; margin: 14px auto 0; background: none; border: none; color: var(--ink-faint); font-size: 14px; text-decoration: underline; }
  .q-reset:hover { color: var(--bad); }
  .badge { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; border-radius: 20px; background: color-mix(in srgb, var(--sc) 15%, transparent); color: var(--sc); }
  .lvl { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
  .lvl-easy { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .lvl-medium { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .lvl-hard { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .diff-bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .sstatus { font-weight: 700; }
  .sstatus.good { color: var(--good); } .sstatus.mid { color: var(--warn); } .sstatus.low { color: var(--bad); } .sstatus.muted { color: var(--ink-faint); }

  /* Runner */
  .rn-meta { font-size: 15px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .qlist { display: flex; flex-direction: column; }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .qrow:first-child { border-top: none; }
  .qn { font-weight: 700; font-size: 14px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .opts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .opt { width: 40px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink-soft); display: grid; place-items: center; transition: .1s; }
  button.opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent); color: #fff; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
  .rn-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .rn-count { font-size: 14.5px; color: var(--ink-soft); font-weight: 600; }
  .rn-score { display: flex; align-items: center; gap: 18px; }
  .rs-num { font-family: var(--serif); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .rs-num .rs-tot { font-size: 20px; color: var(--ink-faint); margin-left: 6px; }
  .rs-side { margin-left: auto; text-align: right; }
  .rs-pct { font-family: var(--serif); font-size: 26px; font-weight: 600; }
  .rs-log { font-size: 13.5px; color: var(--good); font-weight: 700; margin-top: 2px; }
  .rs-time { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .qtimer { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-soft); background: var(--surface-2); padding: 3px 10px; border-radius: 20px; border: 1px solid transparent; transition: color .2s, background .2s; }
  .qtimer.done { color: var(--accent); background: var(--accent-wash); }
  .qtimer.warn { color: var(--warn); background: var(--gold-wash); }
  .qtimer.over { color: #fff; background: var(--bad); }
  .qtimer-wrap { display: inline-flex; align-items: center; gap: 5px; }
  .qtimer.live { cursor: pointer; }
  .qtimer.live:hover { border-color: var(--accent); }
  .qtimer.paused { color: var(--warn); background: var(--gold-wash); }
  .qtimer-reset { border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint); width: 26px; height: 26px; border-radius: 8px; font-size: 14.5px; line-height: 1; }
  .qtimer-reset:hover { color: var(--accent); border-color: var(--accent); }
  .qflag { border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint); width: 28px; height: 28px; border-radius: 8px; font-size: 14px; line-height: 1; flex: none; transition: .12s; }
  .qflag:hover { color: var(--bad); border-color: var(--bad); }
  .qflag.on { color: #fff; background: var(--bad); border-color: var(--bad); }
  .qflag.small { width: 24px; height: 24px; font-size: 13.5px; margin-right: 6px; }
  .jfilters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .jchip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 14px; transition: .12s; }
  .jchip:hover { border-color: var(--ink-faint); }
  .jchip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .jchip.lvl-easy.on { background: var(--good); border-color: var(--good); color: #fff; }
  .jchip.lvl-medium.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .jchip.lvl-hard.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .jchip.flag.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .jcell { position: relative; }
  .jcell.flag::after { content: "⚑"; position: absolute; top: 0; right: 3px; font-size: 12.5px; color: var(--bad); line-height: 1; }
  .jcell.flag.ok::after, .jcell.flag.no::after, .jcell.flag.ans::after { color: #fff; }
  .hint-box summary { color: var(--gold); }
  .rev-time { font-size: 12.5px; color: var(--ink-faint); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 8px; }
  .rev-time.slow { color: var(--bad); }
  .tstat .ttime { font-size: 12.5px; font-weight: 700; color: var(--ink-faint); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .revitem { border-top: 1px solid var(--line-soft); padding: 9px 0; }
  .revitem:first-child { border-top: none; }
  .revitem .qrow { border-top: none; padding: 0; }
  .rev-opts { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .rev-opts .opt { width: 30px; height: 30px; font-size: 13.5px; }
  .rev-mark { font-weight: 800; font-size: 15px; margin-left: 8px; width: 18px; text-align: center; }
  .rev-mark.ok { color: var(--good); } .rev-mark.no { color: var(--bad); }
  .rev-tag { font-size: 13px; color: var(--ink-soft); margin-top: 4px; padding-left: 44px; }
  .rev-q { font-size: 14px; color: var(--ink-soft); margin-top: 5px; padding-left: 44px; line-height: 1.4; }

  /* Slide player */
  .rn-prog { height: 7px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .rn-prog > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .3s ease; }
  .rn-sub { font-size: 13.5px; color: var(--ink-soft); margin-top: 7px; font-weight: 600; }
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; margin-top: 14px; }
  /* Reading-comprehension passage panel */
  .rc-passage { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); margin-bottom: 16px; overflow: hidden; }
  .rc-passage .rc-head { display: flex; align-items: center; gap: 8px; padding: 9px 13px; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); border-bottom: 1px solid var(--line); background: var(--surface); }
  .rc-passage .rc-scroll { padding: 13px 15px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
  .rc-passage.open .rc-scroll { max-height: none; }
  .rc-passage .rc-scroll p { font-size: 14.5px; line-height: 1.62; margin: 0 0 11px; color: var(--ink-soft); text-wrap: pretty; }
  .rc-passage .rc-scroll p:last-child { margin-bottom: 0; }
  .rc-passage .rc-ptitle { font-weight: 700; color: var(--ink); margin-bottom: 10px; font-size: 15px; }
  .rc-passage .rc-toggle { width: 100%; border: none; border-top: 1px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 700; font-size: 14px; padding: 9px; cursor: pointer; }
  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; flex-wrap: wrap; }
  .qnum { font-size: 13px; font-weight: 800; color: var(--ink-faint); letter-spacing: .05em; text-transform: uppercase; margin-right: auto; }
  .qtext { font-size: 17px; line-height: 1.5; font-weight: 500; text-wrap: pretty; }
  /* Boldface spans in CR "boldface" questions — the parts you must identify. */
  .bf { font-weight: 800; color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 3px; }

  /* --- Data Insights: real tables and charts inside the source panel --- */
  .di-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 4px 0 10px; }
  .di-table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  .di-table th, .di-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: right; white-space: nowrap; }
  .di-table th { background: color-mix(in srgb, var(--accent) 10%, var(--surface-2)); font-weight: 800; color: var(--ink); }
  .di-table td:first-child, .di-table th:first-child { text-align: left; font-weight: 700; }
  .di-table tbody tr:nth-child(even) td { background: var(--surface-2); }
  .di-table .di-total td { font-weight: 800; border-top: 2px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .di-chart { margin: 6px 0 12px; }
  .di-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .di-chart-title { font-size: 13.5px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .di-axis { stroke: var(--ink-faint); stroke-width: 1; }
  .di-grid { stroke: var(--line); stroke-width: 1; }
  .di-tick { font-size: 9px; fill: var(--ink-faint); font-weight: 700; }
  .di-lab { font-size: 9.5px; fill: var(--ink-soft); font-weight: 700; }
  .qnote { font-size: 13.5px; color: var(--warn); margin-top: 10px; font-weight: 600; }
  .choices { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
  .choice-wrap { display: flex; align-items: stretch; gap: 7px; }
  .choice-wrap .choice { flex: 1; min-width: 0; }
  .choice-elim { flex: none; width: 42px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint); border-radius: 11px; font-size: 14px; font-weight: 800; cursor: pointer; transition: .12s; }
  .choice-elim:hover { border-color: var(--bad); color: var(--bad); }
  .choice-elim.on { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border-color: var(--bad); color: var(--bad); }
  .choice.struck { opacity: .45; }
  .choice.struck .cl, .choice.struck .ct { text-decoration: line-through; }
  .choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 13px 14px; transition: .12s; width: 100%; }
  .choice:hover { border-color: var(--accent); }
  .choice .cl { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); color: var(--ink-soft); font-weight: 800; display: grid; place-items: center; flex: none; font-size: 14.5px; }
  .choice .ct { font-size: 15px; line-height: 1.4; }
  .choice.sel { border-color: var(--accent); background: var(--accent-wash); }
  .choice.sel .cl { background: var(--accent); color: #fff; }
  .rn-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; }
  .navbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; transition: .12s; }
  .navbtn:disabled { opacity: .4; cursor: not-allowed; }
  .navbtn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .navbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .navbtn.primary:hover { background: var(--accent-ink); color: #fff; }
  .navpos { font-size: 14.5px; color: var(--ink-soft); font-weight: 700; font-variant-numeric: tabular-nums; }
  .jumpbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; cursor: pointer; transition: .12s; }
  .jumpbtn:hover { border-color: var(--accent); color: var(--accent); }
  .jgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; max-height: 46vh; overflow-y: auto; padding: 2px; }
  .jcell { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 14.5px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; transition: .1s; }
  .jcell:hover { border-color: var(--accent); color: var(--accent); }
  .jcell.cur { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--accent); }
  .jcell.ans { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
  .jcell.ok { background: color-mix(in srgb, var(--good) 16%, var(--surface)); border-color: var(--good); color: var(--good); }
  .jcell.no { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); border-color: var(--bad); color: var(--bad); }

  /* Mode chooser + feedback + explanation */
  .mode-h { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .modebtn { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 15px; margin-top: 11px; transition: .12s; }
  .modebtn:hover { border-color: var(--accent); background: var(--accent-wash); }
  .modebtn b { font-size: 15.5px; }
  .modebtn span { font-size: 14px; color: var(--ink-soft); line-height: 1.4; }
  .mode-note { font-size: 13.5px; color: var(--ink-faint); margin: 14px 0 0; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--surface)); }
  .choice.correct .cl { background: var(--good); color: #fff; }
  .choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface)); }
  .choice.wrong .cl { background: var(--bad); color: #fff; }
  .feedback { margin-top: 15px; font-weight: 700; font-size: 14.5px; }
  .feedback.ok { color: var(--good); }
  .feedback.no { color: var(--bad); }
  .expl { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; }

          <!-- ears either side -->

          <path d="M90,104 q7,4 6,14 q-1,6 -7,5 q-1,-11 -3,-19 z" fill="#191921"/>
          <!-- head -->
          <ellipse cx="75" cy="107" rx="15" ry="13" fill="#22222c"/>
          <!-- muzzle resting on the threshold -->
          <ellipse cx="75" cy="113" rx="10" ry="7.5" fill="#c17838"/>

      ]},
    { id:"overall", nav:"Overall", color:"var(--c-overall)", icon:ICON.overall, dashboard:true,
      title:"Overall Progress",
      blurb:"Where you are and what to do next." },
    { id:"rc", nav:"RC", color:"var(--c-verbal)", icon:ICON.rc,
      title:"Reading Comprehension",
      blurb:"One of the two Verbal question types (Verbal is 45 min · 23 questions). Passages with question sets testing main idea, detail, inference, and structure.",
      subjects:[
        { name:"Question Types", topics:["Main idea / primary purpose","Supporting detail","Inference","Function of a detail or paragraph","Author's tone & attitude","Passage structure","Application / extension"] },
        { name:"Passage Practice by Domain", topics:["Science & technology passages","Business & economics passages","Social science & humanities passages","Long, dense passages"] }
      ]},
    { id:"cr", nav:"CR", color:"var(--c-cr)", icon:ICON.cr,
      title:"Critical Reasoning",
      blurb:"The other Verbal question type. Short arguments testing your reasoning — assumptions, strengthen / weaken, flaws, paradoxes, and structure.",
      subjects:[
        { name:"Foundations", topics:["Deconstructing arguments","Finding the conclusion","Spotting assumptions"] },
        { name:"Question Types", topics:["Assumption","Strengthen","Weaken","Evaluate the argument","Inference / must be true","Explain the paradox","Identify the flaw","Boldface & method of reasoning","Complete the argument"] }
      ]}
  ];
  const APP_VERSION = "v84";
  const bySub = SECTIONS.filter(s => s.subjects);
  const secById = (id) => SECTIONS.find(s => s.id === id);
  // Target seconds per question (GMAT pacing benchmarks) — drives timer colour & slow flags.
  const PACE = { quant: 130, data: 135, rc: 120, cr: 120 };
  const paceMs = (secId) => (PACE[secId] || 120) * 1000;
  // Real-exam allocation shown at the top of each section tab (approx where not exact).
  const EXAM = {
    quant: "45 min · 21 questions · ~2:10 each",
    data:  "45 min · 20 questions · ~2:15 each",
    rc:    "Verbal · 45 min · ~13 of 23 Qs · ~2:00 each",
    cr:    "Verbal · 45 min · ~10 of 23 Qs · ~2:00 each"
  };

  /* State */
  const KEY = "gmat_tracker_v2";
  const defaults = { name:"", examDate:"", counts:{}, daily:{}, collapsed:{}, active:"overall", subtab:{}, progOpen:false, targets:{ daily:20, weekly:120 }, runs:{}, flags:{}, read:{}, fcMode:"flip", activity:{}, srs:{}, fcsrs:{}, reminder:{ on:false, time:"19:00", nudged:"" }, genSets:[], genPick:{} };
  let state = load();
  let calCursor = new Date(); calCursor.setDate(1);
  let sheet = null; // { id, a, c }

  // Saved state can be damaged — a half-finished sync, a hand-edited backup, an
  // older build. Merging it in blind used to hand the app a string where it
  // expected an object and white-screen it with no way to reach Restore, so
  // every field is coerced back to the shape its default declares.
  function sanitize(p) {
    const out = JSON.parse(JSON.stringify(defaults));
    if (!p || typeof p !== "object" || Array.isArray(p)) return out;
    const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
    Object.keys(defaults).forEach(k => {
      const want = defaults[k], got = p[k];
      if (got === undefined || got === null) return;
      if (Array.isArray(want)) { if (Array.isArray(got)) out[k] = got; return; }
      if (isObj(want)) { if (isObj(got)) out[k] = Object.assign({}, want, got); return; }
      if (typeof got === typeof want) out[k] = got;
    });
    // Keys the defaults don't declare (syncedAt, celebrated, …) are carried
    // through untouched — dropping them would reset sync and re-fire achievements.
    Object.keys(p).forEach(k => { if (!(k in defaults)) out[k] = p[k]; });
    // genSets entries drive the same render path as real sets, so drop any that
    // could not be run.
    out.genSets = out.genSets.filter(g => g && typeof g === "object" && g.id && Array.isArray(g.questions) && g.questions.length);
    if (!SECTIONS.some(s => s.id === out.active)) out.active = defaults.active;
    return out;
  }

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return sanitize(JSON.parse(raw)); } catch (e) {}
    try { const old = JSON.parse(localStorage.getItem("gmat_tracker_v1") || "null");
      if (old) return sanitize({ name: old.name || "", examDate: old.examDate || "", daily: old.daily || {} }); } catch (e) {}
    return JSON.parse(JSON.stringify(defaults));
  }
  function saveRaw() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function save() { saveRaw(); try { scheduleSyncPush(); } catch (e) {} try { checkAchievements(); } catch (e) {} }

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  // Question / passage text: escaped, but [[...]] marks a boldface span — the
  // portions a GMAT "boldface" question asks you to identify.
  const rich = (s) => esc(s == null ? "" : s).replace(/\[\[([\s\S]+?)\]\]/g, '<b class="bf">$1</b>');
  const dkey = (d) => { const x = d || new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
  const topicId = (s, subj, t) => `${s}::${subj}::${t}`;

  // record helpers ({ d: done, c: correct }); tolerates legacy number values
  function getRec(id) { const r = state.counts[id]; if (!r) return { d:0, c:0, ms:0 }; if (typeof r === "number") return { d:r, c:0, ms:0 }; return { d:r.d||0, c:r.c||0, ms:r.ms||0 }; }
  function setRec(id, r) { if ((r.d||0) <= 0 && (r.c||0) <= 0) delete state.counts[id]; else state.counts[id] = { d:r.d, c:r.c, ms:r.ms||0 }; }
  function fmtDur(ms) { if (!ms || ms <= 0) return "—"; const s = Math.round(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function fmtClock(ms) { const s = Math.floor((ms||0)/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  const done = (id) => getRec(id).d;
  const accPct = (c, d) => d > 0 ? Math.round(c / d * 100) : null;
  const accClass = (p) => p === null ? "" : p >= 80 ? "acc-hi" : p >= 65 ? "acc-mid" : "acc-lo";

  function logQ(id, attempted, correct) {
    attempted = Math.max(0, attempted | 0);
    correct = Math.max(0, Math.min(attempted, correct | 0));
    if (attempted <= 0) return;
    const r = getRec(id); r.d += attempted; r.c += correct; setRec(id, r);
    const k = dkey(); state.daily[k] = Math.max(0, (state.daily[k] || 0) + attempted);
    save(); renderView(); renderBotnav();
  }

  // aggregates -> { d, c }
  function subjectAgg(secId, su) { let d=0,c=0,ms=0; su.topics.forEach(t=>{ const r=getRec(topicId(secId,su.name,t)); d+=r.d; c+=r.c; ms+=r.ms; }); return { d, c, ms }; }
  function sectionAgg(sec) { let d=0,c=0,ms=0; if (sec.subjects) sec.subjects.forEach(su=>{ const a=subjectAgg(sec.id,su); d+=a.d; c+=a.c; ms+=a.ms; }); return { d, c, ms }; }
  function grandAgg() { let d=0,c=0,ms=0; bySub.forEach(s=>{ const a=sectionAgg(s); d+=a.d; c+=a.c; ms+=a.ms; }); return { d, c, ms }; }
  const topicCountTotal = () => bySub.reduce((a,s)=>a+s.subjects.reduce((b,su)=>b+su.topics.length,0),0);
  const topicsTouched = () => { let n=0; bySub.forEach(s=>s.subjects.forEach(su=>su.topics.forEach(t=>{ if(done(topicId(s.id,su.name,t))>0) n++; }))); return n; };

  function daysLeft() { if (!state.examDate) return null; const now=new Date(); now.setHours(0,0,0,0); return Math.round((new Date(state.examDate+"T00:00:00")-now)/86400000); }
  function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function weekTotal(){ const s=startOfWeek(new Date()); let n=0; for(let i=0;i<7;i++){ const dd=new Date(s); dd.setDate(s.getDate()+i); n+=state.daily[dkey(dd)]||0; } return n; }
  function todayTotal(){ return state.daily[dkey()]||0; }
  function streak(){ let n=0,cur=new Date(); if(!(state.daily[dkey(cur)]>0)) cur.setDate(cur.getDate()-1); while(state.daily[dkey(cur)]>0){ n++; cur.setDate(cur.getDate()-1); } return n; }
  function heatLevel(count){ if(count<=0) return 0; const t=state.targets.daily||20, r=count/t; if(r<0.34) return 1; if(r<0.67) return 2; if(r<1) return 3; return 4; }

  /* ===================== Achievements / gamification ===================== */
  // Record that the user did something today (login, concept, flash, session, set).
  function markActivity(kind) {
    const k = dkey();
    if (!state.activity) state.activity = {};
    if (!state.activity[k]) state.activity[k] = {};
    state.activity[k][kind] = (state.activity[k][kind] || 0) + 1;
    save();
  }
  const actToday = () => (state.activity && state.activity[dkey()]) || {};
  function weekDayKeys(){ const s=startOfWeek(new Date()), arr=[]; for(let i=0;i<7;i++){ const dd=new Date(s); dd.setDate(s.getDate()+i); arr.push(dkey(dd)); } return arr; }
  function weekAgg(){
    let activeDays=0, concept=0, flash=0, session=0, set=0, conceptDays=0, flashDays=0;
    weekDayKeys().forEach(k=>{ const a=(state.activity&&state.activity[k])||{}, q=state.daily[k]||0;
      if (q>0 || (a.concept||a.flash||a.session||a.set)) activeDays++;
      concept+=a.concept||0; flash+=a.flash||0; session+=a.session||0; set+=a.set||0;
      if (a.concept) conceptDays++; if (a.flash) flashDays++;
    });
    return { activeDays, concept, flash, session, set, conceptDays, flashDays, questions: weekTotal() };
  }
  function dailyTasks(){
    const a=actToday(), q=todayTotal(), tgt=state.targets.daily||0;
    return [
      { icon:"👋", label:"Show up — open the app", done:true },
      { icon:"🎯", label:"Hit today's question target", sub:tgt>0?`${Math.min(q,tgt)} / ${tgt} questions`:"set a daily target in your profile", done:tgt>0&&q>=tgt, prog:tgt>0?q/tgt:0 },
      { icon:"📖", label:"Study a concept guide", done:!!a.concept },
      { icon:"🗂", label:"Review a flash-card deck", done:!!a.flash },
      { icon:"✎", label:"Do some practice", sub:"a set or an adaptive session", done:(a.session||0)+(a.set||0)>0 },
    ];
  }
  function weeklyTasks(){
    const w=weekAgg(), wt=state.targets.weekly||0;
    return [
      { icon:"🎯", label:"Hit your weekly target", sub:wt>0?`${Math.min(w.questions,wt)} / ${wt} questions`:"set a weekly target", done:wt>0&&w.questions>=wt, prog:wt>0?w.questions/wt:0 },
      { icon:"📅", label:"Practise 5 days this week", sub:`${w.activeDays} / 5 days`, done:w.activeDays>=5, prog:w.activeDays/5 },
      { icon:"📖", label:"Study concepts on 3 days", sub:`${w.conceptDays} / 3 days`, done:w.conceptDays>=3, prog:w.conceptDays/3 },
      { icon:"🗂", label:"Review flash cards on 3 days", sub:`${w.flashDays} / 3 days`, done:w.flashDays>=3, prog:w.flashDays/3 },
      { icon:"✎", label:"Finish 3 practice sessions", sub:`${Math.min(w.session+w.set,3)} / 3`, done:(w.session+w.set)>=3, prog:(w.session+w.set)/3 },
    ];
  }
  function allConceptsRead(){ let tot=0,read=0; CONCEPTS.forEach(g=>{ tot+=g.parts.length; read+=guideReadCount(g); }); return tot>0 && read>=tot; }
  function badgeList(){
    const g=grandAgg(), total=g.d, acc=accPct(g.c,g.d), st=streak(), allDaily=dailyTasks().every(t=>t.done);
    return [
      { icon:"🔥", label:"3-day streak", got:st>=3 },
      { icon:"⚡", label:"7-day streak", got:st>=7 },
      { icon:"🏅", label:"30-day streak", got:st>=30 },
      { icon:"⭐", label:"50 questions", got:total>=50 },
      { icon:"🌟", label:"250 questions", got:total>=250 },
      { icon:"💫", label:"500 questions", got:total>=500 },
      { icon:"🎯", label:"80%+ over 50 Qs", got:total>=50 && acc!==null && acc>=80 },
      { icon:"🎓", label:"Read every concept", got:allConceptsRead() },
      { icon:"✨", label:"Perfect day", got:allDaily },
    ];
  }
  function xpTotal(){ const g=grandAgg(); let parts=0; CONCEPTS.forEach(gd=>parts+=guideReadCount(gd)); const bg=badgeList().filter(b=>b.got).length; return g.d + parts*3 + bg*25; }

  /* Achievement celebration toasts — pop up the moment a daily task, weekly
     goal, or badge is newly completed. `state.celebrated` remembers what has
     already been announced so each one fires exactly once. */
  const ACH_BUSY = { on:false };
  function achKeys(){
    const out=[], dk=dkey(), wk=weekDayKeys()[0];
    dailyTasks().forEach(t=>{ if(t.done && t.label.indexOf("Show up")<0) out.push({ k:"d|"+dk+"|"+t.label, kind:"Daily task done", icon:t.icon, label:t.label }); });
    weeklyTasks().forEach(t=>{ if(t.done) out.push({ k:"w|"+wk+"|"+t.label, kind:"Weekly goal done", icon:t.icon, label:t.label }); });
    badgeList().forEach(b=>{ if(b.got) out.push({ k:"b|"+b.label, kind:"Badge unlocked", icon:b.icon, label:b.label }); });
    return out;
  }
  function checkAchievements(){
    if (ACH_BUSY.on) return; ACH_BUSY.on = true;
    try {
      const cur = achKeys();
      if (!state.celebrated) { state.celebrated = {}; cur.forEach(a => state.celebrated[a.k] = 1); saveRaw(); return; } // seed silently the first time
      const fresh = cur.filter(a => !state.celebrated[a.k]);
      if (!fresh.length) return;
      fresh.forEach(a => state.celebrated[a.k] = 1); saveRaw();
      queueAchToasts(fresh);
    } finally { ACH_BUSY.on = false; }
  }
  function queueAchToasts(list){
    let wrap = document.getElementById("ach-wrap");
    if (!wrap) { wrap = document.createElement("div"); wrap.id = "ach-wrap"; wrap.className = "ach-wrap"; document.body.appendChild(wrap); }
    try { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); } catch(e) {}
    list.slice(0, 4).forEach((a, i) => {
      setTimeout(() => {
        const el = document.createElement("div"); el.className = "ach-toast"; el.setAttribute("role", "status");
        el.innerHTML = '<span class="ach-ic">' + a.icon + '</span><span class="ach-meta"><span class="ach-kind">🎉 ' + esc(a.kind) + '</span><span class="ach-lbl">' + esc(a.label) + '</span></span><button class="ach-x" aria-label="Dismiss">&times;</button>';
        const remove = () => { el.classList.add("out"); setTimeout(() => el.remove(), 300); };
        el.querySelector(".ach-x").addEventListener("click", remove);
        wrap.appendChild(el);
        setTimeout(remove, 4500);
      }, i * 400);
    });
  }

  /* Top bar */
  function renderTop() {
    const d = daysLeft();
    const days=document.getElementById("tb-days"), lbl=document.getElementById("tb-label"), dt=document.getElementById("tb-date");

  // Numbered header for the standard sections on every subject tab.

  // Inside a sub-nav pane only one section is on screen and the sub-nav already
  // names it, so the number chip and the collapse affordance are dropped.
  let tabsecPlain = false;
  function tabSecHead(n, title, sub, metaHTML, key) {

            ${r.ms>0&&r.d>0?`<span class="ttime">⏱ ${fmtDur(r.ms/r.d)}</span>`:""}
