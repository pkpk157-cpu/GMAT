<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GMAT Prep Tracker</title>
<meta name="description" content="Track your GMAT Focus Edition prep — exam countdown, daily & weekly targets, per-topic accuracy, weak-spot focus areas, and an activity calendar." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1B212B" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GMAT Prep" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="stylesheet" href="katex/katex.min.css" />
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/auto-render.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --paper:#F6F4EE; --surface:#FFFFFF; --surface-2:#F0EDE5; --ink:#1B2130;
    --ink-soft:#545B6B; --ink-faint:#8A8F9C; --line:#E4E0D6; --line-soft:#EDEAE2;
    --accent:#2E6E67; --accent-ink:#21534E; --accent-wash:#E4EEEC;
    --gold:#B0791E; --gold-wash:#F3EBD8;
    --good:#2F8F6B; --warn:#B0791E; --bad:#C1553B;
    --c-quant:#2E6E67; --c-data:#3F4E9E; --c-overall:#B0791E; --c-verbal:#A6543C; --c-cr:#8E5572;
    --radius:14px; --radius-s:9px;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 8px 24px -14px rgba(20,25,40,.18);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#14181F; --surface:#1B212B; --surface-2:#232B37; --ink:#E9EBEF;
      --ink-soft:#A6ADBB; --ink-faint:#6E7686; --line:#2B333F; --line-soft:#232B36;
      --accent:#5FB3A8; --accent-ink:#8FCDC4; --accent-wash:#1E2F2D;
      --gold:#D8A64A; --gold-wash:#2C2718;
      --good:#5FC79E; --warn:#D8A64A; --bad:#E08869;
      --c-quant:#5FB3A8; --c-data:#8A96D9; --c-overall:#D8A64A; --c-verbal:#D0846A; --c-cr:#C58AA8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"] {
    --paper:#F6F4EE; --surface:#FFFFFF; --surface-2:#F0EDE5; --ink:#1B2130;
    --ink-soft:#545B6B; --ink-faint:#8A8F9C; --line:#E4E0D6; --line-soft:#EDEAE2;
    --accent:#2E6E67; --accent-ink:#21534E; --accent-wash:#E4EEEC;
    --gold:#B0791E; --gold-wash:#F3EBD8;
    --good:#2F8F6B; --warn:#B0791E; --bad:#C1553B;
    --c-quant:#2E6E67; --c-data:#3F4E9E; --c-overall:#B0791E; --c-verbal:#A6543C; --c-cr:#8E5572;
    --shadow:0 1px 2px rgba(20,25,40,.05),0 8px 24px -14px rgba(20,25,40,.18);
  }
  :root[data-theme="dark"] {
    --paper:#14181F; --surface:#1B212B; --surface-2:#232B37; --ink:#E9EBEF;
    --ink-soft:#A6ADBB; --ink-faint:#6E7686; --line:#2B333F; --line-soft:#232B36;
    --accent:#5FB3A8; --accent-ink:#8FCDC4; --accent-wash:#1E2F2D;
    --gold:#D8A64A; --gold-wash:#2C2718;
    --good:#5FC79E; --warn:#D8A64A; --bad:#E08869;
    --c-quant:#5FB3A8; --c-data:#8A96D9; --c-overall:#D8A64A; --c-verbal:#D0846A; --c-cr:#C58AA8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased; line-height: 1.5;
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
  }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; }
  svg { display: block; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
  .tb-inner { max-width: 940px; margin: 0 auto; padding: 11px 18px; display: flex; align-items: center; gap: 14px; }
  .tb-count { display: flex; align-items: center; gap: 11px; margin-right: auto; background: none; border: none; padding: 4px 6px; border-radius: 12px; text-align: left; }
  .tb-count:hover { background: var(--surface-2); }
  .tb-days { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--gold); line-height: 1; letter-spacing: -.02em; }
  .tb-days.past { color: var(--c-verbal); }
  .tb-meta { display: flex; flex-direction: column; gap: 1px; }
  .tb-meta .l { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .tb-meta .d { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--accent-wash); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-weight: 700; font-size: 16px; font-family: var(--serif); display: grid; place-items: center; transition: .15s; }
  .avatar:hover { filter: brightness(.97); }
  .avatar svg { width: 20px; height: 20px; }

  .wrap { max-width: 940px; margin: 0 auto; padding: 20px 18px 40px; }

  /* Bottom nav */
  .botnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); display: flex; justify-content: center; }
  .botnav-inner { width: 100%; max-width: 500px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
  .bn { border: none; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-faint); font-size: 10.5px; font-weight: 700; transition: color .15s; }
  .bn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bn.active { color: var(--tabc); }
  .bn.center { position: relative; }
  .bn.center .hub { width: 54px; height: 54px; border-radius: 50%; margin-top: -24px; margin-bottom: 2px; background: var(--c-overall); color: #fff; display: grid; place-items: center; border: 4px solid var(--paper); box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--c-overall) 70%, transparent); transition: transform .15s; }
  .bn.center .hub svg { width: 26px; height: 26px; stroke-width: 2; }
  .bn.center.active { color: var(--c-overall); }
  .bn.center.active .hub { transform: translateY(-2px); }

  /* Section head */
  .sec-head { margin: 4px 0 6px; }
  .sec-head h2 { font-family: var(--serif); font-size: 25px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; display: flex; align-items: center; gap: 11px; }
  .sec-head h2 .bar { width: 6px; height: 24px; border-radius: 3px; background: var(--secc); flex: none; }
  .sec-head p { margin: 8px 0 0; color: var(--ink-soft); max-width: 62ch; font-size: 14.5px; }
  .sec-head p.sec-exam { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-top: 7px; }
  .sec-stat { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 13px; font-size: 13px; color: var(--ink-soft); }
  .sec-stat b { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sec-stat .acc { color: var(--good); }

  /* Subject cards */
  .subjects { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .subject { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .subj-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .subj-head:hover { background: var(--surface-2); }
  .subj-head .chev { color: var(--ink-faint); transition: transform .2s; font-size: 12px; }
  .subject.collapsed .chev { transform: rotate(-90deg); }
  .subj-head .title { font-weight: 650; font-size: 15.5px; margin-right: auto; letter-spacing: -.01em; }
  .subj-head .count { font-size: 12.5px; font-weight: 600; color: var(--secc); background: color-mix(in srgb, var(--secc) 12%, transparent); padding: 3px 10px; border-radius: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .subject.collapsed .topics { display: none; }

  .topic { display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-top: 1px solid var(--line-soft); }
  .topic .tname { font-size: 14px; margin-right: auto; line-height: 1.3; }
  .acts { display: flex; gap: 5px; flex: none; }
  .mk { width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 800; line-height: 1; display: grid; place-items: center; transition: .12s; }
  .mk.right { color: var(--good); }
  .mk.right:hover { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border-color: var(--good); }
  .mk.wrong { color: var(--bad); }
  .mk.wrong:hover { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border-color: var(--bad); }
  .tstat { display: flex; flex-direction: column; align-items: flex-end; gap: 0; min-width: 50px; border: none; background: none; padding: 3px 3px; border-radius: 8px; flex: none; }
  .tstat:hover { background: var(--surface-2); }
  .tstat .td { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tstat .td.zero { color: var(--ink-faint); font-weight: 600; }
  .tstat .tacc { font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .acc-hi { color: var(--good); } .acc-mid { color: var(--warn); } .acc-lo { color: var(--bad); }

  /* Goals rings */
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .goal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; display: flex; align-items: center; gap: 14px; }
  .ring-wrap { position: relative; width: 66px; height: 66px; flex: none; }
  .ring { width: 66px; height: 66px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring-pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .goal .gk { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 700; }
  .goal .gv { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .goal .gs { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .goal-empty { grid-column: 1 / -1; }
  .link { color: var(--accent); font-weight: 700; background: none; border: none; padding: 0; text-decoration: underline; font-size: inherit; cursor: pointer; }

  /* Stats / panels */
  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); }
  .stat .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .stat .v { font-family: var(--serif); font-size: 32px; font-weight: 600; margin-top: 5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 17px 19px; margin-top: 14px; }
  .panel h3 { margin: 0 0 3px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .panel .sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  .breakdown { display: flex; flex-direction: column; gap: 13px; }
  .bd-row { display: grid; grid-template-columns: 128px 1fr auto; gap: 12px; align-items: center; }
  .bd-row .bl { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .bd-row .bl .d { width: 9px; height: 9px; border-radius: 50%; background: var(--rc); flex: none; }
  .track { height: 9px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--rc); border-radius: 6px; transition: width .5s ease; }
  .bd-row .bv { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; min-width: 74px; text-align: right; }
  .bd-row .bv .ac { font-weight: 700; font-size: 12px; }

  /* Focus areas */
  .focus { display: flex; flex-direction: column; }
  .focus-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line-soft); }
  .focus-row:first-child { border-top: none; }
  .focus-row .fn { font-size: 13.5px; margin-right: auto; min-width: 0; }
  .focus-row .fn .fq { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  .fchip { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: color-mix(in srgb, var(--fc) 14%, transparent); color: var(--fc); white-space: nowrap; text-transform: uppercase; letter-spacing: .03em; }
  .focus-row .facc { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }

  .spark { display: flex; align-items: flex-end; gap: 8px; height: 96px; margin-top: 4px; }
  .spark .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
  .spark .bcol .b { width: 100%; max-width: 40px; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 6px 6px 3px 3px; min-height: 3px; transition: height .4s ease; }
  .spark .bcol.has .b { background: var(--accent); border-color: var(--accent); }
  .spark .bcol .bn { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; height: 13px; }
  .spark .bcol .bd { font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .spark .bcol.today .bd { color: var(--accent); font-weight: 700; }

  /* Profile */
  .profile { position: fixed; inset: 0; z-index: 70; background: var(--paper); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .profile[hidden] { display: none; }
  .pf-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
  .pf-head-in { max-width: 640px; margin: 0 auto; padding: 13px 18px; display: flex; align-items: center; gap: 12px; }
  .pf-title { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; }
  .pf-close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
  .pf-close:hover { color: var(--ink); border-color: var(--ink-faint); }
  .pf-body { max-width: 640px; margin: 0 auto; padding: 18px 18px 60px; display: flex; flex-direction: column; gap: 14px; }
  .pf-id { display: flex; align-items: center; gap: 15px; }
  .pf-id .big { width: 58px; height: 58px; border-radius: 50%; flex: none; background: var(--accent-wash); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-family: var(--serif); font-size: 24px; font-weight: 600; display: grid; place-items: center; }
  .pf-id .big svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .pf-id .nm { font-family: var(--serif); font-size: 21px; font-weight: 600; }
  .pf-id .meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .pf-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; background: var(--surface-2); color: var(--ink-soft); }
  .chip.hot { background: var(--gold-wash); color: var(--gold); }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: inherit; background: var(--paper); color: var(--ink); }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .tgt-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .tgt-row:first-of-type { border-top: none; }
  .tgt-info { margin-right: auto; }
  .tgt-k { font-weight: 650; font-size: 14.5px; }
  .tgt-s { font-size: 12.5px; color: var(--ink-soft); }
  .tgt-val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; min-width: 34px; text-align: center; }
  .tgt-prog { margin-top: 4px; }
  .tgt-bar { height: 7px; background: var(--surface-2); border-radius: 5px; overflow: hidden; margin-top: 7px; }
  .tgt-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width .5s ease; }
  .tgt-cap { font-size: 12px; color: var(--ink-soft); margin-top: 6px; display: flex; justify-content: space-between; }

  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-title { font-weight: 700; margin-right: auto; font-size: 14.5px; }
  .cal-nav { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
  .cal-nav:hover { color: var(--ink); border-color: var(--ink-faint); }
  .cal-nav:disabled { opacity: .35; cursor: not-allowed; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); text-align: center; font-weight: 700; padding-bottom: 3px; }
  .cal-cell { aspect-ratio: 1; border-radius: 7px; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 5px; font-size: 10.5px; font-weight: 700; }
  .cal-cell.blank { background: none; }
  .cal-cell.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hl0 { background: var(--surface-2); color: var(--ink-faint); }
  .hl1 { background: color-mix(in srgb, var(--accent) 26%, var(--surface)); color: var(--ink-soft); }
  .hl2 { background: color-mix(in srgb, var(--accent) 48%, var(--surface)); color: var(--ink); }
  .hl3 { background: color-mix(in srgb, var(--accent) 72%, var(--surface)); color: #fff; }
  .hl4 { background: var(--accent); color: #fff; }
  .cal-legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 12px; font-size: 11px; color: var(--ink-faint); }
  .cal-legend i { width: 15px; height: 15px; border-radius: 4px; display: inline-block; }

  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); padding: 9px; border-radius: 10px; font-size: 13.5px; font-weight: 600; transition: .12s; }
  .seg button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }

  .pf-actions { display: flex; gap: 10px; }
  .btn-soft { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px; border-radius: 11px; font-weight: 650; font-size: 13.5px; transition: .12s; }
  .btn-soft:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 11px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; transition: .15s; }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-danger { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: none; color: var(--ink-soft); font-size: 13.5px; font-weight: 600; }
  .btn-danger:hover { color: var(--bad); border-color: var(--bad); }

  /* Modals */
  .scrim { position: fixed; inset: 0; background: rgba(15,18,26,.55); display: grid; place-items: center; z-index: 80; padding: 20px; backdrop-filter: blur(3px); }
  .scrim[hidden] { display: none; }
  .modal { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); }
  .modal .kick { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

  .setbtns { display: flex; align-items: center; gap: 7px; flex: none; }

  .diff-bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .sstatus { font-weight: 700; }

  /* Runner */
  .rn-meta { font-size: 13.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .qrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
  .qrow:first-child { border-top: none; }
  .qn { font-weight: 700; font-size: 14px; min-width: 34px; font-variant-numeric: tabular-nums; }
  .opts { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }

  button.opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent); color: #fff; }

  .qflag { border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint); width: 28px; height: 28px; border-radius: 8px; font-size: 14px; line-height: 1; flex: none; transition: .12s; }

  .jcell.flag.ok::after, .jcell.flag.no::after, .jcell.flag.ans::after { color: #fff; }
  .hint-box summary { color: var(--gold); }
  .rev-time { font-size: 11px; color: var(--ink-faint); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 8px; }

  .tstat .ttime { font-size: 10px; font-weight: 700; color: var(--ink-faint); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .revitem { border-top: 1px solid var(--line-soft); padding: 9px 0; }

  .revitem .qrow { border-top: none; padding: 0; }

  .rev-opts .opt { width: 30px; height: 30px; font-size: 12px; }
  .rev-mark { font-weight: 800; font-size: 15px; margin-left: 8px; width: 18px; text-align: center; }
  .rev-mark.ok { color: var(--good); } .rev-mark.no { color: var(--bad); }
  .rev-tag { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; padding-left: 44px; }

  /* Slide player */

  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; flex-wrap: wrap; }
  .qnum { font-size: 11.5px; font-weight: 800; color: var(--ink-faint); letter-spacing: .05em; text-transform: uppercase; margin-right: auto; }

  .choices { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
  .choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 13px 14px; transition: .12s; width: 100%; }

  .choice.sel { border-color: var(--accent); background: var(--accent-wash); }

  .rn-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; }

  /* Mode chooser + feedback + explanation */
  .mode-h { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .modebtn { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 15px; margin-top: 11px; transition: .12s; }
  .modebtn:hover { border-color: var(--accent); background: var(--accent-wash); }

  .modebtn span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .mode-note { font-size: 12px; color: var(--ink-faint); margin: 14px 0 0; }
  .choice:disabled { cursor: default; }

  .choice.correct .cl { background: var(--good); color: #fff; }
  .choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--surface)); }

  .expl { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; }

  .expl .ex { padding: 0 13px 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); white-space: pre-line; }

  .footnote { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 30px; }

  @media (max-width: 430px) {
    .tb-days { font-size: 26px; }
    .sec-head h2 { font-size: 22px; }
    .bd-row { grid-template-columns: 84px 1fr auto; }
    .goal { padding: 13px; gap: 11px; }
    .topic { gap: 7px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-inner">
    <button class="tb-count" id="tb-count" title="Exam countdown — tap to edit">
      <span class="tb-days tnum" id="tb-days">—</span>
      <span class="tb-meta"><span class="l" id="tb-label">days to exam</span><span class="d" id="tb-date">set your date</span></span>
    </button>
    <button class="avatar" id="btn-profile" title="Profile, targets, accuracy & activity">P</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="botnav"><div class="botnav-inner" id="botnav"></div></nav>

<!-- Onboarding -->
<div class="scrim" id="onboard" hidden>
  <div class="modal">
    <span class="kick">Welcome</span>
    <h2>Let's set up your prep</h2>
    <p class="lead">Two quick things and you're in. You can change everything later from your profile.</p>
    <div class="field"><label for="ob-name">Your name</label><input id="ob-name" type="text" placeholder="e.g. Pranav" autocomplete="off" /></div>
    <div class="field"><label for="ob-date">Exam date</label><input id="ob-date" type="date" /><div class="hint">The banner counts down the days for you.</div></div>
    <button class="btn-primary" id="ob-save">Start tracking</button>
  </div>
</div>

<!-- Log sheet -->
<div class="scrim" id="logsheet" hidden><div class="modal" id="ls-card"></div></div>

<!-- Profile page -->
<div class="profile" id="profile" hidden>
  <div class="pf-head"><div class="pf-head-in"><h2 class="pf-title">Profile</h2><button class="pf-close" id="pf-close" title="Close">✕</button></div></div>
  <div class="pf-body" id="pf-body"></div>
</div>
<input type="file" id="restore-input" accept="application/json,.json" hidden />

<!-- Practice-set runner -->
<div class="profile" id="runner" hidden>
  <div class="pf-head"><div class="pf-head-in"><h2 class="pf-title" id="rn-title">Practice set</h2><button class="pf-close" id="rn-close" title="Close">✕</button></div></div>
  <div class="pf-body" id="rn-body"></div>
</div>

<!-- Question jumper -->
<div class="scrim" id="jumper" hidden><div class="modal" id="jumper-card"></div></div>

<script src="sets.js"></script>

      blurb:"One of the two Verbal question types (Verbal is 45 min · 23 questions). Passages with question sets testing main idea, detail, inference, and structure.",
      subjects:[
        { name:"Question Types", topics:["Main idea / primary purpose","Supporting detail","Inference","Function of a detail or paragraph","Author's tone & attitude","Passage structure","Application / extension"] },
        { name:"Passage Practice by Domain", topics:["Science & technology passages","Business & economics passages","Social science & humanities passages","Long, dense passages"] }
      ]},
    { id:"cr", nav:"CR", color:"var(--c-cr)", icon:ICON.cr,
      title:"Critical Reasoning",
      blurb:"The other Verbal question type. Short arguments testing your reasoning — assumptions, strengthen / weaken, flaws, paradoxes, and structure.",
      subjects:[
        { name:"Foundations", topics:["Deconstructing arguments","Finding the conclusion","Spotting assumptions"] },
        { name:"Question Types", topics:["Assumption","Strengthen","Weaken","Evaluate the argument","Inference / must be true","Explain the paradox","Identify the flaw","Boldface & method of reasoning","Complete the argument"] }
      ]}
  ];
  const APP_VERSION = "v20";
  const bySub = SECTIONS.filter(s => s.subjects);
  const secById = (id) => SECTIONS.find(s => s.id === id);
  // Target seconds per question (GMAT pacing benchmarks) — drives timer colour & slow flags.
  const PACE = { quant: 130, data: 135, rc: 120, cr: 120 };
  const paceMs = (secId) => (PACE[secId] || 120) * 1000;
  // Real-exam allocation shown at the top of each section tab (approx where not exact).
  const EXAM = {
    quant: "45 min · 21 questions · ~2:10 each",
    data:  "45 min · 20 questions · ~2:15 each",
    rc:    "Verbal · 45 min · ~13 of 23 Qs · ~2:00 each",
    cr:    "Verbal · 45 min · ~10 of 23 Qs · ~2:00 each"
  };

  /* State */
  const KEY = "gmat_tracker_v2";
  const defaults = { name:"", examDate:"", counts:{}, daily:{}, collapsed:{}, active:"overall", targets:{ daily:20, weekly:120 }, runs:{}, flags:{} };
  let state = load();
  let calCursor = new Date(); calCursor.setDate(1);
  let sheet = null; // { id, a, c }

  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw);
      return Object.assign({}, defaults, p, { targets: Object.assign({}, defaults.targets, p.targets || {}) }); } } catch (e) {}
    try { const old = JSON.parse(localStorage.getItem("gmat_tracker_v1") || "null");
      if (old) return Object.assign({}, defaults, { name: old.name || "", examDate: old.examDate || "", daily: old.daily || {} }); } catch (e) {}
    return JSON.parse(JSON.stringify(defaults));
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const dkey = (d) => { const x = d || new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
  const topicId = (s, subj, t) => `${s}::${subj}::${t}`;

  // record helpers ({ d: done, c: correct }); tolerates legacy number values
  function getRec(id) { const r = state.counts[id]; if (!r) return { d:0, c:0, ms:0 }; if (typeof r === "number") return { d:r, c:0, ms:0 }; return { d:r.d||0, c:r.c||0, ms:r.ms||0 }; }
  function setRec(id, r) { if ((r.d||0) <= 0 && (r.c||0) <= 0) delete state.counts[id]; else state.counts[id] = { d:r.d, c:r.c, ms:r.ms||0 }; }
  function fmtDur(ms) { if (!ms || ms <= 0) return "—"; const s = Math.round(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  function fmtClock(ms) { const s = Math.floor((ms||0)/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
  const done = (id) => getRec(id).d;
  const accPct = (c, d) => d > 0 ? Math.round(c / d * 100) : null;
  const accClass = (p) => p === null ? "" : p >= 80 ? "acc-hi" : p >= 65 ? "acc-mid" : "acc-lo";

  function logQ(id, attempted, correct) {
    attempted = Math.max(0, attempted | 0);
    correct = Math.max(0, Math.min(attempted, correct | 0));
    if (attempted <= 0) return;
    const r = getRec(id); r.d += attempted; r.c += correct; setRec(id, r);
    const k = dkey(); state.daily[k] = Math.max(0, (state.daily[k] || 0) + attempted);
    save(); renderView(); renderBotnav();
  }

  // aggregates -> { d, c }
  function subjectAgg(secId, su) { let d=0,c=0,ms=0; su.topics.forEach(t=>{ const r=getRec(topicId(secId,su.name,t)); d+=r.d; c+=r.c; ms+=r.ms; }); return { d, c, ms }; }
  function sectionAgg(sec) { let d=0,c=0,ms=0; if (sec.subjects) sec.subjects.forEach(su=>{ const a=subjectAgg(sec.id,su); d+=a.d; c+=a.c; ms+=a.ms; }); return { d, c, ms }; }
  function grandAgg() { let d=0,c=0,ms=0; bySub.forEach(s=>{ const a=sectionAgg(s); d+=a.d; c+=a.c; ms+=a.ms; }); return { d, c, ms }; }
  const topicCountTotal = () => bySub.reduce((a,s)=>a+s.subjects.reduce((b,su)=>b+su.topics.length,0),0);
  const topicsTouched = () => { let n=0; bySub.forEach(s=>s.subjects.forEach(su=>su.topics.forEach(t=>{ if(done(topicId(s.id,su.name,t))>0) n++; }))); return n; };

  function daysLeft() { if (!state.examDate) return null; const now=new Date(); now.setHours(0,0,0,0); return Math.round((new Date(state.examDate+"T00:00:00")-now)/86400000); }
  function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
  function weekTotal(){ const s=startOfWeek(new Date()); let n=0; for(let i=0;i<7;i++){ const dd=new Date(s); dd.setDate(s.getDate()+i); n+=state.daily[dkey(dd)]||0; } return n; }
  function todayTotal(){ return state.daily[dkey()]||0; }
  function streak(){ let n=0,cur=new Date(); if(!(state.daily[dkey(cur)]>0)) cur.setDate(cur.getDate()-1); while(state.daily[dkey(cur)]>0){ n++; cur.setDate(cur.getDate()-1); } return n; }
  function heatLevel(count){ if(count<=0) return 0; const t=state.targets.daily||20, r=count/t; if(r<0.34) return 1; if(r<0.67) return 2; if(r<1) return 3; return 4; }

  /* Top bar */
  function renderTop() {
    const d = daysLeft();
    const days=document.getElementById("tb-days"), lbl=document.getElementById("tb-label"), dt=document.getElementById("tb-date");
    days.classList.remove("past");
    document.getElementById("btn-profile").innerHTML = state.name ? esc(state.name.trim()[0].toUpperCase()) : ICON.person;
    if (d === null) { days.textContent="—"; lbl.textContent="days to exam"; dt.textContent="set your date"; return; }
    const nice = new Date(state.examDate+"T00:00:00").toLocaleDateString(undefined,{ month:"short", day:"numeric", year:"numeric" });
    if (d>0){ days.textContent=d; lbl.textContent="days to exam"; dt.textContent=nice; }
    else if (d===0){ days.textContent="0"; lbl.textContent="exam day"; dt.textContent=nice; }
    else { days.textContent=Math.abs(d); days.classList.add("past"); lbl.textContent="days since exam"; dt.textContent=nice; }
  }

  /* Bottom nav */
  function renderBotnav() {
    const nav = document.getElementById("botnav"); nav.innerHTML = "";
    SECTIONS.forEach(sec => {
      const b = document.createElement("button");
      b.className = "bn" + (sec.dashboard ? " center" : "") + (state.active === sec.id ? " active" : "");
      b.style.setProperty("--tabc", sec.color);
      b.innerHTML = sec.dashboard ? `<span class="hub">${sec.icon}</span><span class="lab">${sec.nav}</span>` : `${sec.icon}<span class="lab">${sec.nav}</span>`;
      b.onclick = () => { state.active = sec.id; save(); render(); window.scrollTo({ top:0 }); };
      nav.appendChild(b);
    });
  }

  /* Views */
  // Typeset LaTeX (wrapped in \( ... \)) with KaTeX once it has loaded.
  function typeset(el) {
    if (el && window.renderMathInElement) {
      try { window.renderMathInElement(el, { delimiters: [{ left: "\\(", right: "\\)", display: false }, { left: "\\[", right: "\\]", display: true }], throwOnError: false }); } catch (e) {}
    }
  }

  function renderView() {
    const view = document.getElementById("view");
    const sec = secById(state.active) || SECTIONS.find(s=>s.dashboard);
    view.innerHTML = sec.dashboard ? overallHTML() : sectionHTML(sec);
    typeset(view);
  }

  function accBadge(c, d, extra) {
    const p = accPct(c, d);
    return p === null ? "" : `<span class="${accClass(p)} ${extra||""}">${p}%</span>`;
  }

  function sectionHTML(sec) {
    const ag = sectionAgg(sec), p = accPct(ag.c, ag.d);
    let h = `<div class="sec-head" style="--secc:${sec.color}">
      <h2><span class="bar"></span>${esc(sec.title)}</h2>
      <p class="sec-exam">⏱ ${esc(EXAM[sec.id] || "")}</p>
      <div class="sec-stat"><span><b>${ag.d}</b> questions logged</span>${p!==null?`<span>Accuracy <b class="acc ${accClass(p)}">${p}%</b></span>`:""}${ag.ms>0?`<span>Avg <b>${fmtDur(ag.ms/ag.d)}</b>/q</span>`:""}<span><b>${sec.subjects.length}</b> areas</span></div>
    </div><div class="subjects">`;
    sec.subjects.forEach(su => {
      const ckey = sec.id+"::"+su.name, collapsed = state.collapsed[ckey] ? " collapsed" : "";
      const a = subjectAgg(sec.id, su), sp = accPct(a.c, a.d);
      h += `<section class="subject${collapsed}" style="--secc:${sec.color}">
        <div class="subj-head" data-collapse="${esc(ckey)}"><span class="chev">▼</span><span class="title">${esc(su.name)}</span>
        <span class="count">${a.d} done${sp!==null?` · ${sp}%`:""}</span></div><div class="topics">`;
      su.topics.forEach(t => {
        const id = topicId(sec.id, su.name, t), r = getRec(id), p2 = accPct(r.c, r.d);
        h += `<div class="topic">
          <span class="tname">${esc(t)}</span>
          <div class="acts">
            <button class="mk right" data-mk="${esc(id)}" data-c="1" aria-label="Log one correct">✓</button>
            <button class="mk wrong" data-mk="${esc(id)}" data-c="0" aria-label="Log one wrong">✗</button>
          </div>
          <button class="tstat" data-edit="${esc(id)}" title="Log a set or edit">
            <span class="td ${r.d===0?"zero":""}">${r.d}</span>
            ${p2!==null?`<span class="tacc ${accClass(p2)}">${p2}%</span>`:`<span class="tacc" style="color:var(--ink-faint)">—</span>`}
            ${r.ms>0&&r.d>0?`<span class="ttime">⏱ ${fmtDur(r.ms/r.d)}</span>`:""}
          </button>
        </div>`;
      });
      h += `</div></section>`;
    });
    h += `</div>`;
    h += setsPanelHTML(setsFor(sec.id));
    return h;
  }

  function ring(pct, color) {
    const r=26, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
    return `<svg viewBox="0 0 64 64" class="ring"><circle class="ring-bg" cx="32" cy="32" r="${r}"/><circle class="ring-fg" cx="32" cy="32" r="${r}" style="stroke:${color};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg>`;
  }

  function overallHTML() {
    const g = grandAgg(), gt = g.d, gAcc = accPct(g.c, g.d);
    const touched = topicsTouched(), totalTopics = topicCountTotal();
    const dl = daysLeft(), today = todayTotal(), week = weekTotal(), st = streak();
    const dT = state.targets.daily||0, wT = state.targets.weekly||0;

    let h = `<div class="sec-head" style="--secc:var(--c-overall)"><h2><span class="bar"></span>Overall Progress</h2><p>${esc(SECTIONS.find(s=>s.dashboard).blurb)}</p></div>`;

    // goals
    if (dT>0 || wT>0) {
      h += `<div class="goals">`;
      if (dT>0){ const p=today/dT; h += `<div class="goal"><div class="ring-wrap">${ring(p,"var(--accent)")}<span class="ring-pct">${Math.round(p*100)}%</span></div><div class="gt"><div class="gk">Today</div><div class="gv">${today} / ${dT}</div><div class="gs">${today>=dT?"target hit 🎯":(dT-today)+" to go"}</div></div></div>`; }
      if (wT>0){ const p=week/wT; h += `<div class="goal"><div class="ring-wrap">${ring(p,"var(--gold)")}<span class="ring-pct">${Math.round(p*100)}%</span></div><div class="gt"><div class="gk">This week</div><div class="gv">${week} / ${wT}</div><div class="gs">${week>=wT?"weekly goal met ✨":(wT-week)+" to go"}</div></div></div>`; }
      h += `</div>`;
    } else {
      h += `<div class="goals"><div class="goal goal-empty"><span class="gs">Set a <button class="link" data-open-profile="1">daily & weekly target</button> to track your pace.</span></div></div>`;
    }

    // tiles
    h += `<div class="grid-stats">
      <div class="stat"><div class="k">Total logged</div><div class="v">${gt}</div><div class="s">questions, all areas</div></div>
      <div class="stat"><div class="k">Accuracy</div><div class="v ${gAcc!==null?accClass(gAcc):""}">${gAcc===null?"—":gAcc+"%"}</div><div class="s">${gAcc===null?"log correct vs. attempted":g.c+" of "+g.d+" correct"}</div></div>
      <div class="stat"><div class="k">Day streak</div><div class="v" style="color:var(--gold)">${st}</div><div class="s">${st>0?"consecutive active days":"log today to start one"}</div></div>
      <div class="stat"><div class="k">Avg / question</div><div class="v">${g.ms>0?fmtDur(g.ms/g.d):"—"}</div><div class="s">${g.ms>0?"across timed questions":"time your practice sets"}</div></div>
      <div class="stat"><div class="k">${dl===null?"Exam":"Countdown"}</div><div class="v">${dl===null?"—":Math.abs(dl)}</div><div class="s">${dl===null?"set your date":dl>0?"days remaining":dl===0?"today — good luck!":"days ago"}</div></div>
    </div>`;

    h += setsPanelHTML(SETS);

    // focus areas (weak spots)
    const cand = [];
    bySub.forEach(s => s.subjects.forEach(su => su.topics.forEach(t => {
      const id = topicId(s.id, su.name, t), r = getRec(id);
      if (r.d >= 5) cand.push({ sec:s, name:t, d:r.d, c:r.c, p:accPct(r.c,r.d) });
    })));
    cand.sort((a,b)=> a.p - b.p || b.d - a.d);
    h += `<div class="panel"><h3>Focus areas</h3><p class="sub">Your lowest-accuracy topics so far — where extra practice pays off most.</p>`;
    if (cand.length === 0) {
      h += `<p class="footnote" style="margin:2px 0 0;text-align:left">Log at least <b>5 questions</b> in a topic (with ✓ / ✗) and your weak spots will surface here automatically.</p>`;
    } else {
      h += `<div class="focus">`;
      cand.slice(0,5).forEach(f => {
        h += `<div class="focus-row"><div class="fn">${esc(f.name)}<span class="fq">${f.c} / ${f.d} correct</span></div>
          <span class="fchip" style="--fc:${f.sec.color}">${esc(f.sec.nav)}</span>
          <span class="facc ${accClass(f.p)}">${f.p}%</span></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;

    // breakdown
    const secs = bySub.map(s => ({ s, a: sectionAgg(s) }));
    const max = Math.max(1, ...secs.map(x => x.a.d));
    h += `<div class="panel"><h3>Effort by area</h3><p class="sub">Questions practised · accuracy. Keep all four areas moving. Syllabus covered: ${Math.round(touched/totalTopics*100)}% (${touched}/${totalTopics} topics).</p><div class="breakdown">`;
    secs.forEach(({ s, a }) => {
      const pct = a.d===0 ? 2 : Math.round(a.d/max*100), ap = accPct(a.c, a.d);
      h += `<div class="bd-row" style="--rc:${s.color}"><span class="bl"><span class="d"></span>${esc(s.title)}</span>
        <span class="track"><i style="width:${pct}%"></i></span>
        <span class="bv">${a.d} ${ap!==null?`<span class="ac ${accClass(ap)}">· ${ap}%</span>`:`<span class="ac" style="color:var(--ink-faint)">· —</span>`}</span></div>`;
    });
    h += `</div></div>`;

    // 7-day
    h += `<div class="panel"><h3>Last 7 days</h3><p class="sub">Questions logged each day.</p><div class="spark">`;
    const now = new Date(); now.setHours(0,0,0,0);
    const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], arr = [];
    for (let i=6;i>=0;i--){ const dd=new Date(now); dd.setDate(now.getDate()-i); arr.push({ label:i===0?"Today":wd[dd.getDay()], n:state.daily[dkey(dd)]||0, today:i===0 }); }
    const dmax = Math.max(1, ...arr.map(a=>a.n));
    arr.forEach(a => { const hp = a.n===0?3:Math.max(8,Math.round(a.n/dmax*100)); h += `<div class="bcol ${a.n>0?"has":""} ${a.today?"today":""}"><span class="bn">${a.n||""}</span><div class="b" style="height:${hp}%"></div><span class="bd">${a.label}</span></div>`; });
    h += `</div></div>`;

    if (dl!==null && dl>0) {
      h += `<div class="panel"><h3>Pacing</h3><p class="sub" style="margin:0">You have <b style="color:var(--ink)">${dl} day${dl===1?"":"s"}</b> to go. ${gt>0?`You've logged <b style="color:var(--ink)">${gt}</b> questions${gAcc!==null?` at <b style="color:var(--ink)">${gAcc}%</b> accuracy`:""}` : `A common benchmark is 1,500–2,000 practice questions before test day`} — steady daily reps across all four areas keep every topic warm.</p></div>`;
    }
    h += `<p class="footnote">Progress saves on this device · GMAT Focus Edition · ${APP_VERSION}</p>`;
    return h;
  }

  /* Log sheet */
  function openSheet(id) { const p = id.split("::"); sheet = { id, a:5, c:0, secId:p[0], subj:p[1], topic:p[2] }; renderSheet(); document.getElementById("logsheet").hidden = false; }
  function closeSheet() { document.getElementById("logsheet").hidden = true; sheet = null; }
  function renderSheet() {
    if (!sheet) return;
    const sec = secById(sheet.secId), r = getRec(sheet.id), p = accPct(r.c, r.d);
    document.getElementById("ls-card").innerHTML = `
      <div class="ls-eyebrow" style="--ls-c:${sec.color}">${esc(sec.nav)} · ${esc(sheet.subj)}</div>
      <div class="ls-title">${esc(sheet.topic)}</div>
      <div class="ls-crumb">Add a practice set — how many you did and how many you got right.</div>
      <div class="ls-row"><div class="li"><div class="lk">Attempted</div><div class="ls">questions in this set</div></div>
        <div class="stepper"><button class="step minus" data-sa="-1" ${sheet.a<=1?"disabled":""}>−</button><span class="ls-big">${sheet.a}</span><button class="step" data-sa="1">+</button></div></div>
      <div class="ls-row"><div class="li"><div class="lk">Correct</div><div class="ls">of those, how many right</div></div>
        <div class="stepper"><button class="step minus" data-sc="-1" ${sheet.c<=0?"disabled":""}>−</button><span class="ls-big">${sheet.c}</span><button class="step" data-sc="1" ${sheet.c>=sheet.a?"disabled":""}>+</button></div></div>
      <div class="ls-presets"><button data-sap="5">Set 5</button><button data-sap="10">Set 10</button><button data-sap="20">Set 20</button></div>
      <div class="ls-now">Now: <b>${r.d}</b> done${p!==null?` · <b>${p}%</b> accuracy`:""}</div>
      <button class="btn-primary" data-ssave="1" style="margin-top:14px">Add ${sheet.a} question${sheet.a===1?"":"s"}${sheet.c>0?` · ${sheet.c} correct`:""}</button>
      <button class="ls-reset" data-sreset="1">Reset this topic to zero</button>`;
  }

  /* Profile */
  function profileHTML() {
    const g = grandAgg(), gAcc = accPct(g.c, g.d), st = streak(), today = todayTotal(), week = weekTotal();
    const dT = state.targets.daily||0, wT = state.targets.weekly||0, dl = daysLeft();
    const themePref = localStorage.getItem("gmat_theme") || "system";
    const installable = !!window.__gmatInstall;

    let h = `<section class="panel"><div class="pf-id">
      <div class="big">${state.name ? esc(state.name.trim()[0].toUpperCase()) : ICON.person}</div>
      <div><div class="nm">${state.name ? esc(state.name) : "Your Study Log"}</div>
      <div class="meta">${dl===null?"No exam date set":dl>0?`Exam in ${dl} days · ${esc(new Date(state.examDate+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))}`:"Exam date passed"}</div>
      <div class="pf-chips"><span class="chip hot">🔥 ${st}-day streak</span><span class="chip">${g.d} logged</span>${gAcc!==null?`<span class="chip">${gAcc}% accuracy</span>`:""}</div></div></div></section>`;

    h += `<section class="panel"><h3>Details</h3><p class="sub">Your name and target exam date.</p>
      <div class="field"><label for="pf-name">Name</label><input id="pf-name" type="text" value="${esc(state.name)}" placeholder="Your name" autocomplete="off"/></div>
      <div class="field"><label for="pf-date">Exam date</label><input id="pf-date" type="date" value="${esc(state.examDate)}"/></div>
      <button class="btn-primary" data-save-details="1">Save details</button></section>`;

    h += `<section class="panel"><h3>Daily & weekly targets</h3><p class="sub">How many questions you aim to practise. These drive the rings and the calendar colours.</p>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Daily target</div><div class="tgt-s">questions per day</div></div>
        <div class="stepper"><button class="step minus" data-tgt="daily" data-d="-5">−</button><span class="tgt-val">${dT}</span><button class="step" data-tgt="daily" data-d="5">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${dT?Math.min(100,Math.round(today/dT*100)):0}%"></i></div><div class="tgt-cap"><span>Today</span><span>${today} / ${dT||"—"}</span></div></div>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Weekly target</div><div class="tgt-s">questions this week (Mon–Sun)</div></div>
        <div class="stepper"><button class="step minus" data-tgt="weekly" data-d="-10">−</button><span class="tgt-val">${wT}</span><button class="step" data-tgt="weekly" data-d="10">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${wT?Math.min(100,Math.round(week/wT*100)):0}%;background:var(--gold)"></i></div><div class="tgt-cap"><span>This week</span><span>${week} / ${wT||"—"}</span></div></div></section>`;

    h += `<section class="panel"><h3>Activity calendar</h3><p class="sub">Every day you log questions, coloured by how close you got to your daily target.</p>${calendarHTML()}</section>`;

  function calendarHTML() {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    const lead = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
    const title = calCursor.toLocaleDateString(undefined,{ month:"long", year:"numeric" }), tk = dkey();

    for (let d=1;d<=days;d++){ const key=dkey(new Date(y,m,d)), c=state.daily[key]||0, lvl=heatLevel(c), isT=key===tk?" today":"";
      h += `<div class="cal-cell hl${lvl}${isT}" title="${c} question${c===1?"":"s"} on ${esc(new Date(y,m,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}))}">${d}</div>`; }
    h += `</div><div class="cal-legend">Less <i class="hl0"></i><i class="hl1"></i><i class="hl2"></i><i class="hl3"></i><i class="hl4"></i> More</div>`;

  }

  /* Backup / restore */

  function restoreFrom(file) {

  /* Theme */
  function setTheme(v){ if (v==="system"){ document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("gmat_theme","system");}catch(e){} } else { document.documentElement.setAttribute("data-theme",v); try{localStorage.setItem("gmat_theme",v);}catch(e){} } }
  (function(){ const t=localStorage.getItem("gmat_theme"); if (t && t!=="system") document.documentElement.setAttribute("data-theme",t); })();

  /* ===================== Practice sets ===================== */
  const SETS = (window.GMAT_SETS || []).filter(s => s && Array.isArray(s.questions) && s.questions.length);
  const LET = ["A","B","C","D","E","F","G","H"];
  const setsFor = (secId) => SETS.filter(s => s.section === secId);

  function resolveTopic(secId, name) {
    const sec = secById(secId); if (!sec || !sec.subjects) return null;
    for (const su of sec.subjects) for (const t of su.topics) if (t === name) return topicId(secId, su.name, t);
    const low = String(name || "").toLowerCase();
    for (const su of sec.subjects) for (const t of su.topics) { const tl = t.toLowerCase(); if (tl === low || tl.indexOf(low) >= 0 || low.indexOf(tl) >= 0) return topicId(secId, su.name, t); }
    return null;
  }
  function getRun(id) { const r = state.runs[id]; return r ? { ans: r.ans || {}, submitted: !!r.submitted, score: r.score, total: r.total, idx: r.idx || 0, mode: r.mode || null, logged: r.logged || {}, times: r.times || {} } : { ans: {}, submitted: false, idx: 0, mode: null, logged: {}, times: {} }; }
  // Flagged-for-review questions, kept per set (persist across resets).
  function flagsFor(id) { if (!state.flags) state.flags = {}; if (!state.flags[id]) state.flags[id] = {}; return state.flags[id]; }
  function isFlagged(id, n) { return !!(state.flags && state.flags[id] && state.flags[id][n]); }
  function toggleFlag(id, n) { const f = flagsFor(id); if (f[n]) delete f[n]; else f[n] = true; save(); }
  function flaggedCount(id) { return (state.flags && state.flags[id]) ? Object.keys(state.flags[id]).length : 0; }
  function setRun(id, run) { state.runs[id] = run; save(); }
  function ensureRun(id) { const r = state.runs[id] || { ans:{}, submitted:false, idx:0, mode:null, logged:{}, times:{} }; r.ans = r.ans || {}; r.logged = r.logged || {}; r.times = r.times || {}; state.runs[id] = r; return r; }
  // Log a single answered question into its topic + today's count (once per run).
  // Topic count and daily count move together — never bump one without the other.
  function logOne(set, q, correct, ms) {
    const run = ensureRun(set.id);
    if (run.logged[q.n]) return;
    ms = Math.max(0, ms || 0);
    const id = resolveTopic(set.section, q.topic);
    if (id) {
      const rec = getRec(id); rec.d += 1; if (correct) rec.c += 1; rec.ms += ms; setRec(id, rec);
      const day = dkey(); state.daily[day] = Math.max(0, (state.daily[day] || 0) + 1);
      run.logged[q.n] = { day, topic: id, correct: !!correct, ms };
    } else {
      console.warn("GMAT: no topic match for", set.section, "/", q.topic);
      run.logged[q.n] = { day: null, topic: null, correct: !!correct, ms };
    }
    save();
  }
  // Rebuild topic totals + daily activity purely from recorded practice-set
  // attempts. Fixes any drift between the dashboard and the subject tabs.
  function rebuildStats() {
    const counts = {}, daily = {};
    Object.keys(state.runs || {}).forEach(sid => {
      const run = state.runs[sid]; if (!run || !run.logged) return;
      const set = SETS.find(s => s.id === sid);
      Object.keys(run.logged).forEach(n => {
        const meta = run.logged[n]; let topic, day, correct, ms;
        if (meta && typeof meta === "object") { topic = meta.topic; day = meta.day; correct = meta.correct; ms = meta.ms || 0; }
        else if (set) { const q = set.questions.find(x => String(x.n) === String(n)); topic = q ? resolveTopic(set.section, q.topic) : null; day = dkey(); correct = q ? (run.ans[n] === q.correct) : false; ms = (run.times && run.times[n]) || 0; }
        if (topic) { counts[topic] = counts[topic] || { d:0, c:0, ms:0 }; counts[topic].d += 1; if (correct) counts[topic].c += 1; counts[topic].ms += (ms || 0); if (day) daily[day] = (daily[day] || 0) + 1; }
      });
    });
    state.counts = counts; state.daily = daily; save();
  }
  // Reverse a logged question (used when resetting a question or a set).
  function unlogOne(set, run, n) {
    const meta = run.logged[n]; if (!meta) return;
    let day, id, correct, ms;
    if (typeof meta === "object") { day = meta.day; id = meta.topic; correct = meta.correct; ms = meta.ms || 0; }
    else { const q = set.questions.find(x => String(x.n) === String(n)); day = dkey(); id = q ? resolveTopic(set.section, q.topic) : null; correct = false; ms = 0; }
    if (id) { const rec = getRec(id); rec.d = Math.max(0, rec.d - 1); if (correct) rec.c = Math.max(0, rec.c - 1); rec.ms = Math.max(0, rec.ms - ms); setRec(id, rec); }
    if (day) state.daily[day] = Math.max(0, (state.daily[day] || 0) - 1);
    delete run.logged[n];
  }
  function resetQuestion(set, n) {
    const run = ensureRun(set.id);
    unlogOne(set, run, n);
    delete run.ans[n]; delete run.ans[String(n)]; delete run.times[n]; delete run.times[String(n)];
    if (run.submitted) { run.submitted = false; delete run.score; delete run.total; }
    save();
  }
  function resetRun(set, keepMode) {
    const run = ensureRun(set.id);
    Object.keys(run.logged || {}).forEach(n => unlogOne(set, run, n));
    const mode = keepMode ? run.mode : null;
    state.runs[set.id] = { ans:{}, submitted:false, idx:0, mode: mode, logged:{}, times:{} };
    runIndex = 0; save();
  }
  function scoreRun(set, run) {
    let score = 0; const per = [];
    set.questions.forEach(q => { const your = run.ans[q.n] || null, ok = !!your && your === q.correct; if (ok) score++; per.push({ n:q.n, your, correct:q.correct, ok, topic:q.topic, flag:!!q.flag, options:q.options||5 }); });
    return { score, total: set.questions.length, per };
  }
  function logBatch(entries) {
    if (!entries.length) return;
    const k = dkey(); let add = 0;
    entries.forEach(e => { const r = getRec(e.id); r.d += 1; if (e.correct) r.c += 1; setRec(e.id, r); add++; });
    state.daily[k] = Math.max(0, (state.daily[k] || 0) + add); save();
  }

  function setsPanelHTML(list) {

  let runSetId = null, runIndex = 0, qStart = 0, qAccum = 0, qPaused = false, qTimer = null, pendingL = null, timedFor = null;
  function stopTimer() { if (qTimer) { clearInterval(qTimer); qTimer = null; } }
  function elapsedMs() { if (timedFor == null) return 0; return qAccum + (qPaused ? 0 : Math.max(0, Date.now() - qStart)); }

  function openRunner(id) { runSetId = id; runIndex = getRun(id).idx || 0; pendingL = null; timedFor = null; renderRunner(); document.getElementById("runner").hidden = false; document.body.style.overflow = "hidden"; window.scrollTo({ top:0 }); }

  let jumperFlaggedOnly = false, jumperLevel = null;

  function levelCounts(set) { const c = { easy:0, medium:0, hard:0 }; set.questions.forEach(q => { if (c[q.level] != null) c[q.level]++; }); return c; }
  function modeChooserHTML(set, sec, total) {
    const lc = levelCounts(set);
    const diff = (lc.easy||lc.medium||lc.hard) ? `<div class="diff-bar"><span class="lvl lvl-easy">${lc.easy} easy</span><span class="lvl lvl-medium">${lc.medium} medium</span><span class="lvl lvl-hard">${lc.hard} hard</span></div>` : "";

  function questionHTML(set, run, sec, qs, total) {
    if (runIndex > total-1) runIndex = total-1; if (runIndex < 0) runIndex = 0;
    const q = qs[runIndex], committed = run.ans[q.n], nOpt = q.options || 5;
    const answered = Object.keys(run.ans).length, last = runIndex === total-1;
    const practice = run.mode === "practice";
    const revealed = practice && !!committed;          // locked, showing result
    const active = pendingL != null ? pendingL : (committed || null); // highlighted choice
    const tgt = paceMs(set.section);
    const paceCls = (ms) => ms > tgt ? "over" : (ms > tgt*0.75 ? "warn" : "done");
    const timerHTML = committed
      ? `<span class="qtimer ${paceCls(run.times[q.n] || 0)}" title="Time taken">⏱ ${fmtClock(run.times[q.n] || 0)}</span>`
      : `<span class="qtimer-wrap"><button class="qtimer live" id="qtimer" data-live="1" data-target="${tgt}" data-toggle-timer title="Tap to pause / resume">0:00</button><button class="qtimer-reset" data-reset-timer title="Reset timer">↺</button></span>`;
    const flagged = isFlagged(set.id, q.n);
    const flagHTML = `<button class="qflag ${flagged?"on":""}" data-flag="${q.n}" title="${flagged?"Unflag":"Flag to revisit later"}">⚑</button>`;
    let h = `<div class="rn-prog"><i style="width:${Math.round(answered/total*100)}%"></i></div><div class="rn-sub">${answered} of ${total} answered · ${practice?"Practice":"Test"} mode</div>`;
    h += `<div class="qcard" id="qcard"><div class="qtop">${flagHTML}<span class="qnum">Question ${runIndex+1} of ${total}</span>${timerHTML}<span class="badge" style="--sc:${sec.color}">${esc(q.topic)}</span>${q.level?`<span class="lvl lvl-${q.level}">${q.level}</span>`:""}</div>
      <div class="qtext">${esc(q.text || ("Question "+q.n))}</div>${q.note?`<div class="qnote">⚠ ${esc(q.note)}</div>`:""}
      <div class="choices">`;
    LET.slice(0, nOpt).forEach((L, i) => {
      const ct = (q.choices && q.choices[i] != null) ? q.choices[i] : "";
      let cls = "", dis = "";
      if (revealed) { dis = "disabled"; if (L === q.correct) cls = "correct"; else if (L === committed) cls = "wrong"; }
      else if (active === L) cls = "sel";
      h += `<button class="choice ${cls}" data-pick="${L}" ${dis}><span class="cl">${L}</span><span class="ct">${esc(ct)}</span></button>`;
    });
    h += `</div>`;
    if (revealed) {
      const ok = committed === q.correct;
      h += `<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Correct":("✗ Incorrect — correct answer: "+q.correct)}</div>`;
      if (q.expl) h += `<details class="expl" open><summary>Explanation</summary><div class="ex">${esc(q.expl)}</div></details>`;
      h += `<button class="q-reset" data-resetq="${q.n}">↺ Reset this question</button>`;
    } else {
      if (q.hint) h += `<details class="expl hint-box"><summary>💡 Hint</summary><div class="ex">${esc(q.hint)}</div></details>`;
      // Two-step: pick highlights, Confirm commits (prevents misclicks).
      const canConfirm = pendingL != null && pendingL !== committed;
      const label = committed ? `Confirm change to ${pendingL || committed}` : (pendingL ? `Confirm answer ${pendingL}` : "Confirm answer");
      h += `<button class="btn-primary" style="margin-top:16px" data-confirm ${canConfirm?"":"disabled"}>${esc(label)}</button>`;
      h += `<p class="mode-note" style="text-align:center">${pendingL ? "Tap Confirm to lock it in." : (committed ? "Answered — pick another option to change it." : "Pick an option, then Confirm.")}</p>`;
    }
    h += `</div>`;
    const jump = `<button class="navpos jumpbtn" data-openjump title="Jump to any question">${runIndex+1} / ${total} ▾</button>`;
    if (practice) {
      const nextBtn = revealed ? (last ? `<button class="navbtn primary" data-finish>See results</button>` : `<button class="navbtn primary" data-next>Next ›</button>`) : `<button class="navbtn" disabled>Next ›</button>`;
      h += `<div class="rn-nav"><button class="navbtn" data-prev ${runIndex===0?"disabled":""}>‹ Prev</button>${jump}${nextBtn}</div>`;
    } else {
      h += `<div class="rn-nav"><button class="navbtn" data-prev ${runIndex===0?"disabled":""}>‹ Prev</button>${jump}${last?`<button class="navbtn primary" data-finish>Submit</button>`:`<button class="navbtn primary" data-next>Next ›</button>`}</div>`;
      if (!last && answered===total) h += `<button class="btn-primary" style="margin-top:12px" data-finish>Submit &amp; score all ${total}</button>`;
    }
    return h;
  }

  function resultsHTML(set, run, sec, qs) {
    const res = scoreRun(set, run), pct = Math.round(res.score / res.total * 100), ac = accClass(pct);
    const byN = {}; qs.forEach(q => byN[q.n] = q);
    const tgt = paceMs(set.section);
    const tvals = qs.map(q => run.times[q.n]).filter(v => v != null && v > 0);
    const avgMs = tvals.length ? tvals.reduce((a,b)=>a+b,0)/tvals.length : 0;
    const slowCount = tvals.filter(v => v > tgt).length;
    let h = `<div class="rn-score panel"><div class="rs-num ${ac}">${res.score}<span class="rs-tot">/ ${res.total}</span></div><div class="rs-side"><div class="rs-pct ${ac}">${pct}%</div><div class="rs-log">✓ logged to your accuracy</div>${avgMs?`<div class="rs-time">⏱ ${fmtClock(avgMs)} avg / question</div>`:""}</div></div>`;
    h += `<div class="panel" style="margin-top:14px"><h3>Review &amp; solutions</h3><p class="sub">Correct answer in green. Times over your ~${fmtDur(tgt)} pace target are red${slowCount?` — <b>${slowCount}</b> over pace`:""}. Tap a question for the explanation.</p><div class="qlist">`;
    res.per.forEach(p => {
      const n = p.options, q = byN[p.n], tm = run.times[p.n], slow = tm && tm > tgt;
      h += `<div class="revitem"><div class="qrow rev"><button class="qflag small ${isFlagged(set.id,p.n)?"on":""}" data-flag="${p.n}" title="Flag to revisit later">⚑</button><span class="qn">Q${p.n}</span><div class="rev-opts">` +
        LET.slice(0, n).map(L => { let c = ""; if (L === p.correct) c = "correct"; else if (L === p.your && !p.ok) c = "wrong"; return `<span class="opt ${c}">${L}</span>`; }).join("") +
        `</div>${tm?`<span class="rev-time ${slow?"slow":""}">⏱ ${fmtClock(tm)}</span>`:""}<span class="rev-mark ${p.ok?"ok":"no"}">${p.ok?"✓":"✗"}</span></div>` +
        (q && q.text ? `<div class="rev-q">${esc(q.text)}</div>` : "") +
        (q && q.expl ? `<details class="expl" style="margin:6px 0 0 44px"><summary>Explanation</summary><div class="ex">${esc(q.expl)}</div></details>` : "") +
        `<div class="rev-tag">${esc(p.topic)}${q&&q.level?` · <span class="lvl lvl-${q.level}">${q.level}</span>`:""}${!p.your?' · <span style="color:var(--ink-faint)">skipped</span>':""}</div></div>`;
    });
    h += `</div></div>`;
    h += `<div class="rn-foot"><button class="btn-soft" style="flex:none;padding:11px 20px" data-retake="1">Retake</button><button class="btn-primary" style="width:auto;padding:12px 22px" data-close-runner="1">Done</button></div>`;
    return h;
  }

  function renderRunner() {
    stopTimer();
    const set = SETS.find(s => s.id === runSetId); if (!set) return;
    const sec = secById(set.section), run = getRun(set.id), qs = set.questions, total = qs.length;
    const h = run.submitted ? resultsHTML(set, run, sec, qs) : (!run.mode ? modeChooserHTML(set, sec, total) : questionHTML(set, run, sec, qs, total));
    document.getElementById("rn-title").textContent = set.title;
    const body = document.getElementById("rn-body");
    body.innerHTML = h;
    typeset(body);
    const tEl = document.getElementById("qtimer");
    if (tEl && tEl.getAttribute("data-live") === "1") {
      const key = runSetId + ":" + runIndex;
      if (timedFor !== key) startQuestionTimer(key); // fresh timer only on a new question, not on re-render/pick
      updateTimerDisplay(); runTimerInterval();
    }
    // Navigation is via the Prev / Next buttons only (no swipe — avoids accidental page changes).
  }

  document.getElementById("runner").addEventListener("click", (e) => {
    const set = SETS.find(s => s.id === runSetId); if (!set) return;
    const md = e.target.closest("[data-mode]"); if (md) { const run = ensureRun(set.id); run.mode = md.getAttribute("data-mode"); run.idx = 0; runIndex = 0; save(); renderRunner(); window.scrollTo({ top:0 }); return; }
    if (e.target.closest("[data-toggle-timer]")) { toggleTimer(); return; }   // tap the timer to pause / resume
    if (e.target.closest("[data-reset-timer]")) { resetQTimer(); return; }     // ↺ resets this question's timer
    const fl = e.target.closest("[data-flag]"); if (fl) { toggleFlag(set.id, fl.getAttribute("data-flag")); renderRunner(); return; }
    // Step 1: pick highlights the option (no commit) — guards against misclicks.
    const pick = e.target.closest("[data-pick]"); if (pick) {
      const run = ensureRun(set.id); if (run.submitted) return;
      const q = set.questions[runIndex];
      if (run.mode === "practice" && run.ans[q.n]) return; // locked once answered in practice
      pendingL = pick.getAttribute("data-pick");
      renderRunner(); return;
    }
    // Step 2: confirm commits the pending answer.
    if (e.target.closest("[data-confirm]")) {
      if (pendingL == null) return;
      const run = ensureRun(set.id); if (run.submitted) return;
      const q = set.questions[runIndex];
      const firstTime = !run.ans[q.n];
      const elapsed = elapsedMs();
      const chosen = pendingL; pendingL = null;
      run.ans[String(q.n)] = chosen;
      if (firstTime) run.times[String(q.n)] = elapsed;
      save();
      if (run.mode === "practice") {
        logOne(set, q, chosen === q.correct, run.times[q.n] || 0);
        renderRunner(); window.scrollTo({ top:0 }); return;
      }
      if (runIndex < set.questions.length - 1) { runIndex++; saveIdx(); } // advance in test mode
      renderRunner(); window.scrollTo({ top:0 }); return;
    }
    if (e.target.closest("[data-openjump]")) { jumperFlaggedOnly = false; jumperLevel = null; openJumper(); return; }
    const rq = e.target.closest("[data-resetq]"); if (rq) { resetQuestion(set, rq.getAttribute("data-resetq")); renderRunner(); return; }
    if (e.target.closest("[data-prev]")) { goto(runIndex-1, set); return; }
    if (e.target.closest("[data-next]")) { goto(runIndex+1, set); return; }
    if (e.target.closest("[data-finish]")) {
      const run = ensureRun(set.id), answered = Object.keys(run.ans).length;
      if (run.mode !== "practice" && answered < set.questions.length && !confirm(`You've answered ${answered} of ${set.questions.length}. Submit anyway? Unanswered questions won't be logged.`)) return;
      set.questions.forEach(q => { const your = run.ans[q.n]; if (!your) return; logOne(set, q, your === q.correct, run.times[q.n] || 0); });
      const res = scoreRun(set, run); run.submitted = true; run.score = res.score; run.total = res.total; save();
      renderRunner(); window.scrollTo({ top:0 }); return;
    }
    if (e.target.closest("[data-retake]")) { resetRun(set, false); renderRunner(); return; }
    if (e.target.closest("[data-close-runner]")) closeRunner();
  });
  document.getElementById("rn-close").onclick = closeRunner;

  document.getElementById("jumper").addEventListener("click", (e) => {
    if (e.target.id === "jumper" || e.target.closest("[data-closejump]")) { closeJumper(); return; }
    const lf = e.target.closest("[data-levelfilter]"); if (lf) { const v = lf.getAttribute("data-levelfilter"); jumperLevel = v === "all" ? null : v; openJumper(); return; }
    if (e.target.closest("[data-flagfilter]")) { jumperFlaggedOnly = !jumperFlaggedOnly; openJumper(); return; }
    const j = e.target.closest("[data-jump]"); if (j) { const set = SETS.find(s => s.id === runSetId); closeJumper(); if (set) goto(parseInt(j.getAttribute("data-jump"), 10), set); }
  });

  /* Boot */
  function render(){ renderTop(); renderBotnav(); renderView(); }
  render();
  if (!state.examDate && !state.name) document.getElementById("onboard").hidden = false;
  // KaTeX scripts are deferred, so typeset again once they've loaded.
  window.addEventListener("load", () => { typeset(document.getElementById("view")); typeset(document.getElementById("rn-body")); });
})();
</script>

<script>
/* PWA: install prompt + offline service worker with auto-update */
(function () {
  "use strict";
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloaded) return; reloaded = true; window.location.reload(); });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.update();
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update(); });
      }).catch(function () {});
    });
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__gmatInstall = e; });
})();
</script>
</body>
</html>
