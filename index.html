      if (NICO_ANIM.some(c => dog.classList.contains(c))) return;   // stay put mid-reaction
      dog.classList.add("nico-away");
      clearTimeout(t); t = setTimeout(() => dog.classList.remove("nico-away"), 550);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    document.addEventListener("scroll", onScroll, { passive: true, capture: true });
  })();
  function saveIdx() { const set = SETS.find(s => s.id === runSetId); if (!set) return; const run = getRun(set.id); run.idx = runIndex; setRun(set.id, run); }
  function goto(i, set) { const total = set.questions.length; runIndex = Math.max(0, Math.min(total-1, i)); pendingL = null; passageOpen = false; saveIdx(); renderRunner(); window.scrollTo({ top:0 }); }

  let jumperFlaggedOnly = false, jumperLevel = null;
  function openJumper() {
    const set = SETS.find(s => s.id === runSetId); if (!set) return;
    const run = getRun(set.id), practice = run.mode === "practice", fc = flaggedCount(set.id), lc = levelCounts(set);
    let h = `<div class="ls-eyebrow">Jump to question</div><div class="ls-title" style="font-size:18px;margin-bottom:10px">${set.questions.length} questions${practice?" · green = right, red = wrong":""}</div>`;
    h += `<div class="jfilters">`;
    h += `<button class="jchip ${jumperLevel===null?"on":""}" data-levelfilter="all">All</button>`;
    if (lc.easy) h += `<button class="jchip lvl-easy ${jumperLevel==="easy"?"on":""}" data-levelfilter="easy">Easy ${lc.easy}</button>`;
    if (lc.medium) h += `<button class="jchip lvl-medium ${jumperLevel==="medium"?"on":""}" data-levelfilter="medium">Medium ${lc.medium}</button>`;
    if (lc.hard) h += `<button class="jchip lvl-hard ${jumperLevel==="hard"?"on":""}" data-levelfilter="hard">Hard ${lc.hard}</button>`;
    if (fc > 0) h += `<button class="jchip flag ${jumperFlaggedOnly?"on":""}" data-flagfilter>⚑ Flagged ${fc}</button>`;
    h += `</div>`;
    let list = set.questions.map((q, i) => ({ q, i }));
    if (jumperLevel) list = list.filter(x => x.q.level === jumperLevel);
    if (jumperFlaggedOnly) list = list.filter(x => isFlagged(set.id, x.q.n));
    if (!list.length) { h += `<p class="mode-note" style="margin:8px 0 16px">No questions match this filter.</p>`; }
    else {
      h += `<div class="jgrid">`;
      list.forEach(({ q, i }) => {
        const done = run.ans[q.n]; let cls = "";
        if (i === runIndex) cls = "cur";
        else if (done) cls = practice ? (done === q.correct ? "ok" : "no") : "ans";
        if (isFlagged(set.id, q.n)) cls += " flag";
        h += `<button class="jcell ${cls}" data-jump="${i}">${q.n}</button>`;
      });
      h += `</div>`;
    }
    h += `<button class="btn-soft" style="width:100%;margin-top:16px" data-closejump>Close</button>`;
    document.getElementById("jumper-card").innerHTML = h;
    document.getElementById("jumper").hidden = false;
  }
  function closeJumper() { document.getElementById("jumper").hidden = true; }

  function levelCounts(set) { const c = { easy:0, medium:0, hard:0 }; set.questions.forEach(q => { if (c[q.level] != null) c[q.level]++; }); return c; }
  function modeChooserHTML(set, sec, total) {
    const lc = levelCounts(set);
    const diff = (lc.easy||lc.medium||lc.hard) ? `<div class="diff-bar"><span class="lvl lvl-easy">${lc.easy} easy</span><span class="lvl lvl-medium">${lc.medium} medium</span><span class="lvl lvl-hard">${lc.hard} hard</span></div>` : "";
    const answered = Object.keys(getRun(set.id).ans).length;
    const resume = answered > 0 ? `<p class="mode-note" style="margin:0 0 10px"><b>You've answered ${answered} of ${total}.</b> Pick a mode to pick up where you left off.</p>` : "";
    return `<div class="rn-meta"><span class="badge" style="--sc:${sec.color}">${esc(sec.nav)}</span> ${total} questions</div>${diff}
      <div class="qcard"><div class="mode-h">How do you want to run this set?</div>${resume}
      <button class="modebtn" data-mode="practice"><b>Practice mode</b><span>Tells you correct or incorrect right after each answer, with an explanation. Best for learning.</span></button>
      <button class="modebtn" data-mode="test"><b>Test mode</b><span>Answer all ${total} first, then get your score and full solutions at the end.</span></button>
      <p class="mode-note">Either way, every answer is logged into your Quant &amp; Overall progress for today.</p></div>`;
  }

  function questionHTML(set, run, sec, qs, total) {
    if (runIndex > total-1) runIndex = total-1; if (runIndex < 0) runIndex = 0;
    const q = qs[runIndex], committed = run.ans[q.n], nOpt = q.options || 5;
    const answered = Object.keys(run.ans).length, last = runIndex === total-1;
    const practice = run.mode === "practice";
    const revealed = practice && !!committed;          // locked, showing result
    const active = pendingL != null ? pendingL : (committed || null); // highlighted choice
    const tgt = paceMs(set.section);
    const paceCls = (ms) => ms > tgt ? "over" : (ms > tgt*0.75 ? "warn" : "done");
    const timerHTML = committed
      ? `<span class="qtimer ${paceCls(run.times[q.n] || 0)}" title="Time taken">⏱ ${fmtClock(run.times[q.n] || 0)}</span>`
      : `<span class="qtimer-wrap"><button class="qtimer live" id="qtimer" data-live="1" data-target="${tgt}" data-toggle-timer title="Tap to pause / resume">0:00</button><button class="qtimer-reset" data-reset-timer title="Reset timer">↺</button></span>`;
    const flagged = isFlagged(set.id, q.n);
    const flagHTML = `<button class="qflag ${flagged?"on":""}" data-flag="${q.n}" title="${flagged?"Unflag":"Flag to revisit later"}">⚑</button>`;
    let h = `<div class="rn-prog"><i style="width:${Math.round(answered/total*100)}%"></i></div><div class="rn-sub">${answered} of ${total} answered · ${practice?"Practice":"Test"} mode</div>`;
    h += `<div class="qcard" id="qcard">${passageHTML(set)}<div class="qtop">${flagHTML}<span class="qnum">Question ${runIndex+1} of ${total}</span>${timerHTML}<span class="badge" style="--sc:${sec.color}">${esc(q.topic)}</span>${levelBadge(set.section, q)}</div>
      <div class="qtext">${rich(q.text || ("Question "+q.n))}</div>${qTableHTML(q)}${q.note?`<div class="qnote">⚠ ${esc(q.note)}</div>`:""}
      <div class="choices">`;
    const elim = (run.elim && run.elim[q.n]) ? run.elim[q.n] : {};
    LET.slice(0, nOpt).forEach((L, i) => {
      const ct = (q.choices && q.choices[i] != null) ? q.choices[i] : "";
      let cls = "", dis = "";
      if (revealed) { dis = "disabled"; if (L === q.correct) cls = "correct"; else if (L === committed) cls = "wrong"; }
      else if (active === L) cls = "sel";
      const struck = !revealed && elim[L];
      if (struck) cls += " struck";
      const pickBtn = `<button class="choice ${cls}" data-pick="${L}" ${dis}><span class="cl">${L}</span><span class="ct">${esc(ct)}</span></button>`;
      const elimBtn = revealed ? "" : `<button class="choice-elim ${elim[L]?"on":""}" data-elim="${L}" title="${elim[L]?"Restore this option":"Cross out this option"}" aria-label="Cross out option ${L}">✕</button>`;
      h += `<div class="choice-wrap">${pickBtn}${elimBtn}</div>`;
    });
    h += `</div>`;
    if (revealed) {
      const ok = committed === q.correct;
      h += `<div class="feedback ${ok?"ok":"no"}">${ok?"✓ Correct":("✗ Incorrect — correct answer: "+q.correct)}</div>`;
      if (q.expl) h += `<details class="expl" open><summary>Explanation</summary><div class="ex">${rich(q.expl)}</div></details>`;
      h += `<button class="q-reset" data-resetq="${q.n}">↺ Reset this question</button>`;
    } else {
      if (q.hint) h += `<details class="expl hint-box"><summary>💡 Hint</summary><div class="ex">${esc(q.hint)}</div></details>`;
      // Two-step: pick highlights, Confirm commits (prevents misclicks).
      const canConfirm = pendingL != null && pendingL !== committed;
      const label = committed ? `Confirm change to ${pendingL || committed}` : (pendingL ? `Confirm answer ${pendingL}` : "Confirm answer");
      h += `<button class="btn-primary" style="margin-top:16px" data-confirm ${canConfirm?"":"disabled"}>${esc(label)}</button>`;
      h += `<p class="mode-note" style="text-align:center">${pendingL ? "Tap Confirm to lock it in." : (committed ? "Answered — pick another option to change it." : "Pick an option, then Confirm.")}</p>`;
    }
    h += `</div>`;
    const jump = `<button class="navpos jumpbtn" data-openjump title="Jump to any question">${runIndex+1} / ${total} ▾</button>`;
    if (total === 1) {
      // Single question: no Prev/Next/jump to offer — just a way out once answered.
      h += `<div class="rn-nav" style="justify-content:center">${revealed ? `<button class="navbtn primary" data-close-runner>Done</button>` : `<span class="mode-note" style="margin:0">Pick an option, then Confirm.</span>`}</div>`;
    } else if (practice) {
      const nextBtn = revealed ? (last ? `<button class="navbtn primary" data-finish>See results</button>` : `<button class="navbtn primary" data-next>Next ›</button>`) : `<button class="navbtn" disabled>Next ›</button>`;
      h += `<div class="rn-nav"><button class="navbtn" data-prev ${runIndex===0?"disabled":""}>‹ Prev</button>${jump}${nextBtn}</div>`;
    } else {
      h += `<div class="rn-nav"><button class="navbtn" data-prev ${runIndex===0?"disabled":""}>‹ Prev</button>${jump}${last?`<button class="navbtn primary" data-finish>Submit</button>`:`<button class="navbtn primary" data-next>Next ›</button>`}</div>`;
      if (!last && answered===total) h += `<button class="btn-primary" style="margin-top:12px" data-finish>Submit &amp; score all ${total}</button>`;
    }
    return h;
  }

  function resultsHTML(set, run, sec, qs) {
    const res = scoreRun(set, run), pct = Math.round(res.score / res.total * 100), ac = accClass(pct);
    const byN = {}; qs.forEach(q => byN[q.n] = q);
    const tgt = paceMs(set.section);
    const tvals = qs.map(q => run.times[q.n]).filter(v => v != null && v > 0);
    const avgMs = tvals.length ? tvals.reduce((a,b)=>a+b,0)/tvals.length : 0;
    const slowCount = tvals.filter(v => v > tgt).length;
    let h = `<div class="rn-score panel"><div class="rs-num ${ac}">${res.score}<span class="rs-tot">/ ${res.total}</span></div><div class="rs-side"><div class="rs-pct ${ac}">${pct}%</div><div class="rs-log">✓ logged to your accuracy</div>${avgMs?`<div class="rs-time">⏱ ${fmtClock(avgMs)} avg / question</div>`:""}</div></div>`;
    h += `<div class="panel" style="margin-top:14px"><h3>Review &amp; solutions</h3><p class="sub">Correct answer in green. Times over your ~${fmtDur(tgt)} pace target are red${slowCount?` — <b>${slowCount}</b> over pace`:""}. Tap a question for the explanation.</p><div class="qlist">`;
    res.per.forEach(p => {
      const n = p.options, q = byN[p.n], tm = run.times[p.n], slow = tm && tm > tgt;
      h += `<div class="revitem"><div class="qrow rev"><button class="qflag small ${isFlagged(set.id,p.n)?"on":""}" data-flag="${p.n}" title="Flag to revisit later">⚑</button><span class="qn">Q${p.n}</span><div class="rev-opts">` +
        LET.slice(0, n).map(L => { let c = ""; if (L === p.correct) c = "correct"; else if (L === p.your && !p.ok) c = "wrong"; return `<span class="opt ${c}">${L}</span>`; }).join("") +
        `</div>${tm?`<span class="rev-time ${slow?"slow":""}">⏱ ${fmtClock(tm)}</span>`:""}<span class="rev-mark ${p.ok?"ok":"no"}">${p.ok?"✓":"✗"}</span></div>` +
        (q && q.text ? `<div class="rev-q">${rich(q.text)}${qTableHTML(q)}</div>` : "") +
        (q && q.expl ? `<details class="expl" style="margin:6px 0 0 44px"><summary>Explanation</summary><div class="ex">${rich(q.expl)}</div></details>` : "") +
        `<div class="rev-tag">${esc(p.topic)}${q&&q.level?` · ${levelBadge(set.section, q)}`:""}${!p.your?' · <span style="color:var(--ink-faint)">skipped</span>':""}</div></div>`;
    });
    h += `</div></div>`;
    h += `<div class="rn-foot"><button class="btn-soft" style="flex:none;padding:11px 20px" data-retake="1">Retake</button><button class="btn-primary" style="width:auto;padding:12px 22px" data-close-runner="1">Done</button></div>`;
    return h;
  }

  function renderRunner() {
    stopTimer();
    const set = SETS.find(s => s.id === runSetId); if (!set) return;
    const sec = secById(set.section), run = getRun(set.id), qs = set.questions, total = qs.length;
    // A one-question set has nothing to choose between: go straight into it in
    // practice mode (question → hint → answer + explanation).
    const single = total === 1;
    if (single && run.mode !== "practice") { run.mode = "practice"; setRun(set.id, run); }
    const h = run.submitted ? resultsHTML(set, run, sec, qs) : ((!single && (modePrompt || !run.mode)) ? modeChooserHTML(set, sec, total) : questionHTML(set, run, sec, qs, total));
    // In practice mode Nico stays on screen the whole time as your study buddy.
    document.body.classList.toggle("nico-stay", run.mode === "practice" && !run.submitted && !modePrompt);
    document.getElementById("rn-title").textContent = set.title;
    const body = document.getElementById("rn-body");
    body.innerHTML = h;
    typeset(body);
    const tEl = document.getElementById("qtimer");
    if (tEl && tEl.getAttribute("data-live") === "1") {
      const key = runSetId + ":" + runIndex;
      if (timedFor !== key) startQuestionTimer(key); // fresh timer only on a new question, not on re-render/pick
      updateTimerDisplay(); runTimerInterval();
    }
    // Navigation is via the Prev / Next buttons only (no swipe — avoids accidental page changes).
  }

  document.getElementById("runner").addEventListener("click", (e) => {
    const set = SETS.find(s => s.id === runSetId); if (!set) return;
    const md = e.target.closest("[data-mode]"); if (md) { const run = ensureRun(set.id); run.mode = md.getAttribute("data-mode"); modePrompt = false; runIndex = run.idx || 0; save(); renderRunner(); window.scrollTo({ top:0 }); return; }
    if (e.target.closest("[data-passtoggle]")) { passageOpen = !passageOpen; renderRunner(); return; }  // RC passage expand / collapse
    if (e.target.closest("[data-toggle-timer]")) { toggleTimer(); return; }   // tap the timer to pause / resume
    if (e.target.closest("[data-reset-timer]")) { resetQTimer(); return; }     // ↺ resets this question's timer
    const fl = e.target.closest("[data-flag]"); if (fl) { toggleFlag(set.id, fl.getAttribute("data-flag")); renderRunner(); return; }
    // Cross out / restore an option (GMAT elimination). Kept per question.
    const elb = e.target.closest("[data-elim]"); if (elb) {
      const run = ensureRun(set.id); if (run.submitted) return;
      const q = set.questions[runIndex];
      if (run.mode === "practice" && run.ans[q.n]) return; // no changes once answered in practice
      const key = String(q.n); run.elim[key] = run.elim[key] || {};
      const L = elb.getAttribute("data-elim");
      if (run.elim[key][L]) delete run.elim[key][L]; else run.elim[key][L] = 1;
      save(); renderRunner(); return;
    }
    // Step 1: pick highlights the option (no commit) — guards against misclicks.
    const pick = e.target.closest("[data-pick]"); if (pick) {
      const run = ensureRun(set.id); if (run.submitted) return;
      const q = set.questions[runIndex];
      if (run.mode === "practice" && run.ans[q.n]) return; // locked once answered in practice
      const L = pick.getAttribute("data-pick");
      if (run.elim[String(q.n)]) delete run.elim[String(q.n)][L]; // choosing an option un-crosses it
      pendingL = L;
      save(); renderRunner(); return;
    }
    // Step 2: confirm commits the pending answer.
    if (e.target.closest("[data-confirm]")) {
      if (pendingL == null) return;
      const run = ensureRun(set.id); if (run.submitted) return;
      const q = set.questions[runIndex];
      const firstTime = !run.ans[q.n];
      const elapsed = elapsedMs();
      const chosen = pendingL; pendingL = null;
      run.ans[String(q.n)] = chosen;
      if (firstTime) run.times[String(q.n)] = elapsed;
      run.at = Date.now();   // orders "Jump back in" by most recently touched
      save();
      if (run.mode === "practice") {
        logOne(set, q, chosen === q.correct, run.times[q.n] || 0);
        nicoReact(chosen === q.correct);
        renderRunner(); window.scrollTo({ top:0 }); return;
      }
      if (runIndex < set.questions.length - 1) { runIndex++; saveIdx(); } // advance in test mode
      renderRunner(); window.scrollTo({ top:0 }); return;
    }
    if (e.target.closest("[data-openjump]")) { jumperFlaggedOnly = false; jumperLevel = null; openJumper(); return; }
    const rq = e.target.closest("[data-resetq]"); if (rq) { resetQuestion(set, rq.getAttribute("data-resetq")); renderRunner(); return; }
    if (e.target.closest("[data-prev]")) { goto(runIndex-1, set); return; }
    if (e.target.closest("[data-next]")) { goto(runIndex+1, set); return; }
    if (e.target.closest("[data-finish]")) {
      const run = ensureRun(set.id), answered = Object.keys(run.ans).length;
      if (run.mode !== "practice" && answered < set.questions.length && !confirm(`You've answered ${answered} of ${set.questions.length}. Submit anyway? Unanswered questions won't be logged.`)) return;
      set.questions.forEach(q => { const your = run.ans[q.n]; if (!your) return; logOne(set, q, your === q.correct, run.times[q.n] || 0); });
      const res = scoreRun(set, run); run.submitted = true; run.score = res.score; run.total = res.total; save();
      markActivity("set");
      renderRunner(); window.scrollTo({ top:0 }); return;
    }
    if (e.target.closest("[data-retake]")) { resetRun(set, false); renderRunner(); return; }
    if (e.target.closest("[data-close-runner]")) closeRunner();
  });
  document.getElementById("rn-close").onclick = closeRunner;

  document.getElementById("jumper").addEventListener("click", (e) => {
    if (e.target.id === "jumper" || e.target.closest("[data-closejump]")) { closeJumper(); return; }
    const lf = e.target.closest("[data-levelfilter]"); if (lf) { const v = lf.getAttribute("data-levelfilter"); jumperLevel = v === "all" ? null : v; openJumper(); return; }
    if (e.target.closest("[data-flagfilter]")) { jumperFlaggedOnly = !jumperFlaggedOnly; openJumper(); return; }
    const j = e.target.closest("[data-jump]"); if (j) { const set = SETS.find(s => s.id === runSetId); closeJumper(); if (set) goto(parseInt(j.getAttribute("data-jump"), 10), set); }
  });

  /* ===================== Adaptive practice session ===================== */
  // A custom, GMAT-style session: pick how many questions, from which sets, and
  // an optional overall time limit. Questions are ordered by performance —
  // start at medium, get one right → the next is harder, get one wrong → easier.
  const LEVELS = ["easy", "medium", "hard"];
  const lvlIdx = (l) => { const i = LEVELS.indexOf(l); return i < 0 ? 1 : i; };   // unknown → medium
  let cfg = null;   // config: { sets:Set<id>, count, time(min) }
  let sess = null;  // live session

  function selectedPoolCount() { let n = 0; SETS.forEach(s => { if (cfg.sets.has(s.id)) n += s.questions.length; }); return n; }

  function openSessionConfig() {
    if (!cfg) cfg = { sets: new Set(SETS.map(s => s.id)), count: 10, time: 0 };
    cfg.sets = new Set([...cfg.sets].filter(id => SETS.some(s => s.id === id)));
    if (!cfg.sets.size) SETS.forEach(s => cfg.sets.add(s.id));
    renderSessionConfig();
    document.getElementById("sess-config").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function closeSessionConfig() {
    document.getElementById("sess-config").hidden = true;
    if (document.getElementById("session").hidden) document.body.style.overflow = "";
  }
  function renderSessionConfig() {
    const total = selectedPoolCount();
    const counts = [5, 10, 15, 20, 30], times = [0, 10, 20, 30, 45];
    let h = `<span class="kick">Practice session</span><h2>Build your session</h2><p class="lead">Choose how many questions, which topics, and an optional time limit. The order adapts to how you're doing — right answers make the next question harder.</p><div class="sc-body">`;
    h += `<div><div class="sc-h">Number of questions</div><div class="sc-seg">`;
    counts.forEach(c => h += `<button class="${cfg.count === c ? "on" : ""}" data-count="${c}">${c}</button>`);
    h += `</div></div>`;
    h += `<div><div class="sc-h">Time limit</div><div class="sc-seg">`;
    times.forEach(t => h += `<button class="${cfg.time === t ? "on" : ""}" data-time="${t}">${t === 0 ? "None" : t + " min"}</button>`);
    h += `</div></div>`;
    h += `<div><div class="sc-h">Topics to include</div><div class="sc-sources">`;
    SECTIONS.filter(s => s.subjects).forEach(sec => {
      const list = SETS.filter(s => s.section === sec.id); if (!list.length) return;
      const allOn = list.every(s => cfg.sets.has(s.id));
      h += `<div class="sc-secrow"><span style="color:${sec.color}">●</span> ${esc(sec.nav)}<button class="sec-toggle" data-sectoggle="${sec.id}">${allOn ? "Clear" : "All"}</button></div>`;
      list.forEach(s => {
        const on = cfg.sets.has(s.id);
        h += `<div class="sc-setrow ${on ? "on" : ""}" data-settoggle="${esc(s.id)}"><span class="cb">${on ? "✓" : ""}</span><span>${esc(s.title)}</span><span class="qn">${s.questions.length} Qs</span></div>`;
      });
    });
    h += `</div></div>`;
    const eff = Math.min(cfg.count, total);
    h += `<button class="sc-start" data-sessstart="1" ${total === 0 ? "disabled" : ""}>${total === 0 ? "Select at least one topic" : `Start ${eff} question${eff === 1 ? "" : "s"}${cfg.time ? " · " + cfg.time + " min" : ""} →`}</button>`;
    h += `</div>`;
    document.getElementById("sess-config-card").innerHTML = h;
  }

  function sessPick() {
    const li = lvlIdx(sess.curLevel);
    const avail = sess.pool.filter(x => !sess.used.has(x.key));
    if (!avail.length) return null;
    let bestD = 99; avail.forEach(x => { const d = Math.abs(lvlIdx(x.lvl) - li); if (d < bestD) bestD = d; });
    const tier = avail.filter(x => Math.abs(lvlIdx(x.lvl) - li) === bestD);
    return tier[Math.floor(Math.random() * tier.length)];
  }
  function startSession() {
    const pool = [];
    SETS.forEach(s => { if (!cfg.sets.has(s.id)) return; s.questions.forEach(q => pool.push({ set: s, q, lvl: LEVELS.includes(q.level) ? q.level : "medium", key: s.id + "#" + q.n })); });
    if (!pool.length) return;
    const count = Math.min(cfg.count, pool.length);
    sess = { pool, count, order: [], idx: 0, answers: {}, elim: {}, pending: null, curLevel: "medium", used: new Set(), timeMs: cfg.time * 60000, endsAt: cfg.time ? Date.now() + cfg.time * 60000 : 0, timer: null, qStart: 0, submitted: false, logged: false, timeUp: false };
    const first = sessPick(); if (first) { sess.order.push(first); sess.used.add(first.key); }
    closeSessionConfig();
    document.getElementById("session").hidden = false;
    document.body.style.overflow = "hidden";
    sess.qStart = Date.now();
    renderSession(); startSessTimer(); window.scrollTo({ top: 0 });
    if (window.gtrack) gtrack("adaptive-session-start");
  }

  function startSessTimer() { stopSessTimer(); if (!sess || !sess.timeMs) return; sess.timer = setInterval(sessTick, 500); sessTick(); }
  function stopSessTimer() { if (sess && sess.timer) { clearInterval(sess.timer); sess.timer = null; } }
  function sessTick() {
    if (!sess) return;
    const rem = Math.max(0, sess.endsAt - Date.now());
    const el = document.getElementById("ss-timer");
    if (el) { el.textContent = "⏱ " + fmtClock(rem); el.className = "ss-timer" + (rem <= 60000 ? " low" : ""); }
    if (rem <= 0 && !sess.submitted) finishSession(true);
  }

  function renderSession() {
    if (!sess) return;
    const body = document.getElementById("ss-body");
    if (sess.submitted) { body.innerHTML = sessResultsHTML(); typeset(body); return; }
    const cur = sess.order[sess.idx], q = cur.q, sec = secById(cur.set.section), nOpt = q.options || 5;
    let h = `<div class="ss-top"><span class="ss-prog">Question ${sess.idx + 1} of ${sess.count}</span>`;
    if (sess.timeMs) h += `<span class="ss-timer" id="ss-timer">⏱ ${fmtClock(Math.max(0, sess.endsAt - Date.now()))}</span>`;
    h += `</div><div class="ss-trace">`;
    for (let i = 0; i < sess.count; i++) {
      if (i < sess.idx) { const o = sess.order[i], a = sess.answers[i]; h += `<i class="${o.lvl} ${a && a.correct ? "ok" : "no"}"></i>`; }
      else if (i === sess.idx) h += `<i class="${cur.lvl}" style="outline:2px solid var(--accent)"></i>`;
      else h += `<i style="background:var(--line)"></i>`;
    }
    h += `</div>`;
    const elim = sess.elim[sess.idx] || {}, pend = sess.pending;
    h += `<div class="qcard">${passageHTML(cur.set)}<div class="qtop"><span class="qnum">${esc(sec.title)}</span><span class="badge" style="--sc:${sec.color}">${esc(q.topic)}</span><span class="lvl lvl-${cur.lvl}">${cur.lvl}</span></div>`;
    h += `<div class="qtext">${rich(q.text || ("Question " + q.n))}</div>${qTableHTML(q)}${q.note ? `<div class="qnote">⚠ ${esc(q.note)}</div>` : ""}<div class="choices">`;
    LET.slice(0, nOpt).forEach((L, i) => {
      const ct = (q.choices && q.choices[i] != null) ? q.choices[i] : "";
      let cls = pend === L ? "sel" : ""; if (elim[L]) cls += " struck";
      h += `<div class="choice-wrap"><button class="choice ${cls}" data-sesspick="${L}"><span class="cl">${L}</span><span class="ct">${esc(ct)}</span></button><button class="choice-elim ${elim[L] ? "on" : ""}" data-sesselim="${L}" aria-label="Cross out option ${L}">✕</button></div>`;
    });
    h += `</div>`;
    const last = sess.idx === sess.count - 1;
    h += `<button class="btn-primary" style="margin-top:16px" data-sessnext ${pend ? "" : "disabled"}>${last ? "Finish session" : "Next question ›"}</button>`;
    h += `<p class="mode-note" style="text-align:center">${pend ? "Locked in — tap to continue." : "Pick an option to continue. No going back — just like the real test."}</p></div>`;
    body.innerHTML = h; typeset(body);
  }

  function sessCommitAndAdvance() {
    if (!sess || sess.pending == null) return;
    const cur = sess.order[sess.idx], q = cur.q;
    const correct = sess.pending === q.correct, ms = Math.max(0, Date.now() - sess.qStart);
    sess.answers[sess.idx] = { chosen: sess.pending, correct, ms, level: cur.lvl };
    sess.pending = null;
    sess.curLevel = LEVELS[Math.max(0, Math.min(2, lvlIdx(sess.curLevel) + (correct ? 1 : -1)))];
    if (sess.idx >= sess.count - 1) { finishSession(false); return; }
    const nxt = sessPick(); if (!nxt) { finishSession(false); return; }
    sess.order.push(nxt); sess.used.add(nxt.key); sess.idx++; sess.qStart = Date.now(); passageOpen = false;
    renderSession(); window.scrollTo({ top: 0 });
  }

  function finishSession(timeUp) {
    if (!sess) return;
    stopSessTimer(); sess.submitted = true; sess.timeUp = !!timeUp;
    if (!sess.logged) { sessLog(); markActivity("session"); sess.logged = true; }
    renderSession(); window.scrollTo({ top: 0 });
  }
  function sessLog() {
    const k = dkey(); let add = 0;
    sess.order.forEach((o, i) => {
      const a = sess.answers[i]; if (!a) return;
      const id = resolveTopic(o.set.section, o.q.topic);
      if (id) { const rec = getRec(id); rec.d += 1; if (a.correct) rec.c += 1; rec.ms += a.ms || 0; setRec(id, rec); add++; }
      else console.warn("GMAT session: no topic match for", o.set.section, "/", o.q.topic);
      srsOnAnswer(o.set.id, o.q.n, a.correct);
    });
    if (add) state.daily[k] = Math.max(0, (state.daily[k] || 0) + add);
    save();
  }
  function sessResultsHTML() {
    let correct = 0, tms = 0; const rows = [];
    sess.order.forEach((o, i) => { const a = sess.answers[i]; if (!a) return; rows.push({ o, a }); if (a.correct) correct++; tms += a.ms; });
    const done = rows.length, pct = done ? Math.round(correct / done * 100) : 0, ac = accClass(pct), avg = done ? tms / done : 0;
    let h = `<div class="rn-score panel"><div class="rs-num ${ac}">${correct}<span class="rs-tot">/ ${done}</span></div><div class="rs-side"><div class="rs-pct ${ac}">${pct}%</div><div class="rs-log">✓ logged to your progress</div>${avg ? `<div class="rs-time">⏱ ${fmtClock(avg)} avg / question</div>` : ""}</div></div>`;
    if (sess.timeUp) h += `<div class="qnote" style="margin-top:12px">⏱ Time's up — the session ended at your time limit. ${done} of ${sess.count} answered.</div>`;
    h += `<div class="panel" style="margin-top:14px"><h3>Difficulty journey</h3><p class="sub">Each answer set the next question's level. Green = right, red = wrong — a rising green streak means the questions were getting harder.</p><div class="ss-trace">`;
    rows.forEach(({ o, a }) => h += `<i class="${o.lvl} ${a.correct ? "ok" : "no"}" title="${o.lvl} · ${a.correct ? "correct" : "wrong"}"></i>`);
    h += `</div></div>`;
    h += `<div class="panel" style="margin-top:14px"><h3>Review &amp; solutions</h3><p class="sub">Correct answer in green. Tap a question for the explanation.</p><div class="qlist">`;
    rows.forEach(({ o, a }, i) => {
      const q = o.q, nOpt = q.options || 5;
      h += `<div class="revitem"><div class="qrow rev"><span class="qn">Q${i + 1}</span><div class="rev-opts">` +
        LET.slice(0, nOpt).map(L => { let c = ""; if (L === q.correct) c = "correct"; else if (L === a.chosen && !a.correct) c = "wrong"; return `<span class="opt ${c}">${L}</span>`; }).join("") +
        `</div><span class="rev-time">⏱ ${fmtClock(a.ms)}</span><span class="rev-mark ${a.correct ? "ok" : "no"}">${a.correct ? "✓" : "✗"}</span></div>` +
        (q.text ? `<div class="rev-q">${rich(q.text)}${qTableHTML(q)}</div>` : "") +
        (q.expl ? `<details class="expl" style="margin:6px 0 0 44px"><summary>Explanation</summary><div class="ex">${rich(q.expl)}</div></details>` : "") +
        `<div class="rev-tag">${esc(q.topic)} · <span class="lvl lvl-${o.lvl}">${o.lvl}</span> · ${esc(secById(o.set.section).nav)}</div></div>`;
    });
    h += `</div></div><div class="rn-foot"><button class="btn-soft" style="flex:none;padding:11px 20px" data-sessagain="1">New session</button><button class="btn-primary" style="width:auto;padding:12px 22px" data-sessclose="1">Done</button></div>`;
    return h;
  }
  function closeSession(force) {
    if (sess && !sess.submitted && !force && !confirm("End this practice session? Answers so far won't be saved to your stats.")) return false;
    stopSessTimer(); sess = null;
    document.getElementById("session").hidden = true;
    document.body.style.overflow = "";
    render(); return true;
  }

  document.getElementById("sess-config").addEventListener("click", (e) => {
    if (e.target.id === "sess-config") { closeSessionConfig(); return; }
    if (!cfg) return;
    const c = e.target.closest("[data-count]"); if (c) { cfg.count = parseInt(c.getAttribute("data-count"), 10); renderSessionConfig(); return; }
    const t = e.target.closest("[data-time]"); if (t) { cfg.time = parseInt(t.getAttribute("data-time"), 10); renderSessionConfig(); return; }
    const st = e.target.closest("[data-sectoggle]"); if (st) { const id = st.getAttribute("data-sectoggle"), list = SETS.filter(s => s.section === id), allOn = list.every(s => cfg.sets.has(s.id)); list.forEach(s => { if (allOn) cfg.sets.delete(s.id); else cfg.sets.add(s.id); }); renderSessionConfig(); return; }
    const sr = e.target.closest("[data-settoggle]"); if (sr) { const id = sr.getAttribute("data-settoggle"); if (cfg.sets.has(id)) cfg.sets.delete(id); else cfg.sets.add(id); renderSessionConfig(); return; }
    if (e.target.closest("[data-sessstart]")) startSession();
  });
  document.getElementById("session").addEventListener("click", (e) => {
    if (e.target.closest("[data-sessclose]")) { closeSession(true); return; }
    if (e.target.closest("[data-sessagain]")) { closeSession(true); openSessionConfig(); return; }
    if (!sess || sess.submitted) return;
    if (e.target.closest("[data-passtoggle]")) { passageOpen = !passageOpen; renderSession(); return; }
    const el = e.target.closest("[data-sesselim]"); if (el) { const L = el.getAttribute("data-sesselim"), k = sess.idx; sess.elim[k] = sess.elim[k] || {}; if (sess.elim[k][L]) delete sess.elim[k][L]; else sess.elim[k][L] = 1; renderSession(); return; }
    const pk = e.target.closest("[data-sesspick]"); if (pk) { const L = pk.getAttribute("data-sesspick"); if (sess.elim[sess.idx]) delete sess.elim[sess.idx][L]; sess.pending = L; renderSession(); return; }
    if (e.target.closest("[data-sessnext]")) sessCommitAndAdvance();
  });
  document.getElementById("ss-close").onclick = () => closeSession(false);

  /* Events — flash cards */
  document.getElementById("fc-close").onclick = closeFlash;

  /* Events — focus timer */
  document.getElementById("fo-close").onclick = closeFocus;
  document.getElementById("fo-body").addEventListener("click", (e) => {
    if (e.target.closest("[data-fostart]")) { foc.running ? focusPause() : focusStart(); return; }
    if (e.target.closest("[data-foreset]")) { focusReset(); return; }
    const m = e.target.closest("[data-fomin]"); if (m) { focusSetMin(parseInt(m.getAttribute("data-fomin"), 10)); return; }
  });

  /* Events — review queue */
  document.getElementById("rv-close").onclick = closeReview;
  document.getElementById("rv-body").addEventListener("click", (e) => {
    if (!rev) return;
    if (e.target.closest("[data-rvclose]")) { closeReview(); return; }
    if (e.target.closest("[data-rvmore]")) { openReview(); return; }
    if (e.target.closest("[data-passtoggle]")) { passageOpen = !passageOpen; renderReview(); return; }
    if (e.target.closest("[data-rvnext]")) { rev.idx++; rev.pending = null; passageOpen = false; renderReview(); window.scrollTo({ top:0 }); return; }
    if (e.target.closest("[data-rvcheck]")) { reviewCheck(); return; }
    const el = e.target.closest("[data-rvelim]"); if (el) { const k = rev.idx, L = el.getAttribute("data-rvelim"); rev.elim[k] = rev.elim[k] || {}; if (rev.elim[k][L]) delete rev.elim[k][L]; else rev.elim[k][L] = 1; renderReview(); return; }
    const pk = e.target.closest("[data-rvpick]"); if (pk) { if (rev.answered[rev.idx]) return; const L = pk.getAttribute("data-rvpick"); if (rev.elim[rev.idx]) delete rev.elim[rev.idx][L]; rev.pending = L; renderReview(); return; }
    const aib = e.target.closest("[data-aiexplain]"); if (aib) { aiExplainRun(aib); return; }
  });
  document.getElementById("fc-body").addEventListener("click", (e) => {
    if (!fcDeck) return;
    const md = e.target.closest("[data-fcmode]"); if (md) { fcSetMode(md.getAttribute("data-fcmode")); return; }
    const gr = e.target.closest("[data-fcgrade]"); if (gr) { fcGradeGo(gr.getAttribute("data-fcgrade") === "1"); return; }
    if (e.target.closest("[data-fcclose]")) { closeFlash(); return; }
    if (e.target.closest("[data-fcflip]")) { fcFlip(); return; }
    if (e.target.closest("[data-fcprev]")) { fcGo(-1); return; }
    if (e.target.closest("[data-fcnext]")) { fcGo(1); return; }
    if (e.target.closest("[data-fcshuffle]")) { for (let i = fcOrder.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [fcOrder[i], fcOrder[j]] = [fcOrder[j], fcOrder[i]]; } fcIdx = 0; fcFlipped = false; fcSession = { knew:0, didnt:0 }; renderFlash(); return; }
    if (e.target.closest("[data-fcrestart]")) { fcOrder = fcDeckOrder(fcDeck); fcIdx = 0; fcFlipped = false; fcSession = { knew:0, didnt:0 }; renderFlash(); return; }
  });

  /* ===== Hardware / gesture Back button: step up one layer instead of closing the app ===== */
  function backCloseTopLayer() {
    const vis = (id) => { const el = document.getElementById(id); return el && !el.hidden; };
    if (vis("jumper"))   { closeJumper();  return true; }
    if (vis("sess-config")) { closeSessionConfig(); return true; }
    if (vis("session"))  { closeSession(false); return true; }
    if (vis("flash"))    { closeFlash(); return true; }
    if (vis("logsheet")) { closeSheet();   return true; }
    if (vis("concept")) {
      if (cnPartIdx >= 0) gotoPart(-1);    // article → back to contents
      else closeConcept();                 // contents → back to the section page
      return true;
    }
    if (vis("runner")) {
      const run = runSetId ? getRun(runSetId) : null;
      if (run && run.mode === "test" && !run.submitted) {
        if (confirm("Exit test mode? Your answers are saved — you can resume this set later.")) closeRunner();
      } else closeRunner();          // practice / results → straight back to the section page
      return true;
    }
    if (vis("achv"))     { closeAchv();    return true; }
    if (vis("focus"))    { closeFocus();   return true; }
    if (vis("review"))   { closeReview();  return true; }
    if (vis("profile"))  { closeProfile(); return true; }
    if (vis("onboard"))  { return true; } // ignore Back during first-run setup
    return false;                          // base tab — nothing to close
  }
  function armBack() { try { history.pushState({ gmat: 1 }, ""); } catch (e) {} }
  window.addEventListener("popstate", () => {
    if (backCloseTopLayer()) { armBack(); }                     // handled a layer — re-arm
    else if (confirm("Close GMAT Prep?")) { history.back(); }   // base: user confirmed exit
    else { armBack(); }                                         // base: stay in the app
  });
  armBack();

  /* Boot */
  markActivity("login");            // opening the app counts as showing up today
  try { reminderNudge(); applyReminder(); } catch (e) {}   // daily reminder: nudge + (re)schedule
  function render(){ renderTop(); renderBotnav(); renderView(); }
  render();
  // Cross-device sync: pull the latest on open, push on leave, and re-pull when
  // the app is brought back to the foreground. All no-ops until a device is linked.
  try { if (syncLinked()) pull(true).catch(() => {}); } catch (e) {}
  document.addEventListener("visibilitychange", () => {
    if (!syncLinked()) return;
    if (document.visibilityState === "visible") { pull(true).catch(() => {}); }
    else { if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; } push().catch(() => {}); }
  });
  window.addEventListener("focus", () => { if (syncLinked()) pull(true).catch(() => {}); });
  if (!state.examDate && !state.name) document.getElementById("onboard").hidden = false;
  // KaTeX scripts are deferred, so typeset again once they've loaded.
  window.addEventListener("load", () => { typeset(document.getElementById("view")); typeset(document.getElementById("rn-body")); });
})();
</script>

<script>
/* PWA: install prompt + offline service worker with auto-update */
(function () {
  "use strict";
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloaded) return; reloaded = true; window.location.reload(); });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.update();
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update(); });
      }).catch(function () {});
    });
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__gmatInstall = e; });
})();
</script>
</body>
