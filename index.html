  // Build a set, persist it, splice it into the live SETS array (so the runner
  // and every aggregate see it immediately) and open it.
  function generateSet(secId) {
    const G = window.GMAT_GEN;
    if (!G) { alert("The generator didn't load. Pull the latest version from your profile and try again."); return; }
    const sel = document.querySelector(`[data-gencount="${secId}"]`);
    const count = sel ? parseInt(sel.value, 10) || 10 : 10;
    const set = G.makeSet(genPicked(secId), count);
    if (!set || !set.questions.length) { alert("Couldn't build a set from those topics — try picking another one."); return; }
    state.genSets = (state.genSets || []).concat([set]);
    // Keep the newest 20 generated sets; drop the oldest along with its run.
    while (state.genSets.length > 20) {
      const gone = state.genSets.shift();
      delete state.runs[gone.id];
      const at = SETS.findIndex(x => x.id === gone.id); if (at >= 0) SETS.splice(at, 1);
    }
    SETS.push(set);
    save(); renderView();
    openRunner(set.id);
    if (window.gtrack) gtrack("generate-set");
  }

  /* ===================== Difficulty recalibration =====================
     A question's printed level comes from whoever wrote it, and it is a claim
     about the average test-taker, not about you. Once you have answered enough
     questions in a given topic-and-level bucket, your own results are the
     better estimate — so the badge shifts to match how that bucket actually
     behaves for you, and says so when it does.

     Deliberately conservative: it needs a real sample before it moves anything,
     it only ever shifts one band, and it never rewrites the stored data. */
  const LEVEL_ORDER = ["easy", "medium", "hard"];
  // Roughly what each band should feel like for the person it was written for.
  const LEVEL_BASELINE = { easy: 0.85, medium: 0.70, hard: 0.55 };
  const RECAL_MIN_SAMPLE = 6;     // fewer than this and a bucket says nothing
  const RECAL_MARGIN = 0.15;      // how far off baseline before the badge moves
  let recalCache = null;

  function recalBuckets() {
    if (recalCache) return recalCache;
    const buckets = {};
    const setById = {};
    SETS.forEach(s => { setById[s.id] = s; });
    Object.keys(state.runs || {}).forEach(sid => {
      const set = setById[sid], run = state.runs[sid];
      if (!set || !run || !run.logged) return;
      Object.keys(run.logged).forEach(n => {
        const rec = run.logged[n];
        if (!rec || typeof rec.correct !== "boolean") return;
        const q = set.questions.find(x => String(x.n) === String(n));
        if (!q || !q.level || !q.topic) return;
        const k = set.section + "::" + q.topic + "::" + q.level;
        const b = buckets[k] || (buckets[k] = { n: 0, c: 0 });
        b.n++; if (rec.correct) b.c++;
      });
    });
    recalCache = buckets;
    return buckets;
  }
  function clearRecal() { recalCache = null; }

  // Returns { level, shifted, why } — `shifted` is -1 (easier for you),
  // +1 (harder for you) or 0 (left as written).
  function personalLevel(section, q) {
    const lvl = q && q.level;
    if (!lvl || LEVEL_ORDER.indexOf(lvl) < 0) return { level: lvl, shifted: 0, why: "" };
    const b = recalBuckets()[section + "::" + q.topic + "::" + lvl];
    if (!b || b.n < RECAL_MIN_SAMPLE) return { level: lvl, shifted: 0, why: "" };
    const acc = b.c / b.n, base = LEVEL_BASELINE[lvl];
    const at = LEVEL_ORDER.indexOf(lvl);
    const pctTxt = Math.round(acc * 100) + "% on " + b.n + " " + lvl + " " + q.topic + " questions";
    if (acc >= base + RECAL_MARGIN && at > 0)
      return { level: LEVEL_ORDER[at - 1], shifted: -1, why: "Marked " + lvl + ", but you're at " + pctTxt + " — easier for you." };
    if (acc <= base - RECAL_MARGIN && at < LEVEL_ORDER.length - 1)
      return { level: LEVEL_ORDER[at + 1], shifted: 1, why: "Marked " + lvl + ", but you're at " + pctTxt + " — harder for you." };
    return { level: lvl, shifted: 0, why: "" };
  }
  // The level badge, recalibrated against your own results where there is
  // enough evidence to justify it.
  function levelBadge(section, q) {
    if (!q || !q.level) return "";
    const p = personalLevel(section, q);
    if (!p.shifted) return `<span class="lvl lvl-${p.level}">${p.level}</span>`;
    return `<span class="lvl lvl-${p.level} lvl-recal" title="${esc(p.why)}">${p.level}<i>· for you</i></span>`;
  }
  // Per-section summary of every bucket your results disagree with.
  function recalSummary(secId) {
    const out = [];
    const buckets = recalBuckets();
    Object.keys(buckets).forEach(k => {
      const [sec, topic, lvl] = k.split("::");
      if (sec !== secId) return;
      const b = buckets[k];
      if (b.n < RECAL_MIN_SAMPLE) return;
      const acc = b.c / b.n, base = LEVEL_BASELINE[lvl], at = LEVEL_ORDER.indexOf(lvl);
      if (acc >= base + RECAL_MARGIN && at > 0) out.push({ topic, lvl, acc, n: b.n, dir: -1 });
      else if (acc <= base - RECAL_MARGIN && at < LEVEL_ORDER.length - 1) out.push({ topic, lvl, acc, n: b.n, dir: 1 });
    });
    return out.sort((a, b) => (a.dir - b.dir) || (a.acc - b.acc));
  }

  function recalPanelHTML(sec) {
    const rows = recalSummary(sec.id);
    if (!rows.length) return "";
    let h = `<div class="panel recal" style="--secc:${sec.color}"><h4>Difficulty, recalibrated for you</h4>` +
      `<p>These labels came from whoever wrote the questions. On ${esc(sec.nav)} your own results disagree, so the badges on these questions now show your level instead.</p><ul>`;
    rows.forEach(r => {
      h += `<li><span class="rdir ${r.dir < 0 ? "down" : "up"}">${r.dir < 0 ? "easier" : "harder"}</span>` +
        `<span><b>${esc(r.topic)}</b> · marked ${esc(r.lvl)} · you're at ${Math.round(r.acc * 100)}% over ${r.n} question${r.n === 1 ? "" : "s"}</span></li>`;
    });
    return h + `</ul></div>`;
  }

  /* ===================== Generate practice ===================== */
  let genBusy = false, genStatus = "", genStatusCls = "";
  function setGenStatus(msg, cls) { genStatus = msg || ""; genStatusCls = cls || ""; renderView(); }

  // Generate a set through the Claude API. Only reachable once the user has
  // saved their own key; the request and the key never leave this device except
  // to go to api.anthropic.com.
  async function generateAiSet(secId) {
    const AI = window.GMAT_GEN && window.GMAT_GEN.ai;
    if (!AI || !AI.hasKey()) { setGenStatus("Add an API key under Profile → AI question generation first.", "bad"); return; }
    if (genBusy) return;
    const sel = document.querySelector(`[data-gencount="${secId}"]`);
    const count = sel ? parseInt(sel.value, 10) || 4 : 4;
    const sec = secById(secId);
    genBusy = true; setGenStatus("Writing " + count + " question" + (count === 1 ? "" : "s") + "… this takes a few seconds.", "");
    try {
      const out = await AI.generate({ section: secId, count: count, label: sec ? sec.nav : secId });
      state.genSets = (state.genSets || []).concat([out.set]);
      while (state.genSets.length > 20) {
        const gone = state.genSets.shift();
        delete state.runs[gone.id];
        const at = SETS.findIndex(x => x.id === gone.id); if (at >= 0) SETS.splice(at, 1);
      }
      SETS.push(out.set);
      save();
      genBusy = false;
      const dropped = out.rejected.length;
      setGenStatus(dropped ? ("Kept " + out.set.questions.length + "; dropped " + dropped + " that failed validation.") : "", dropped ? "" : "");
      openRunner(out.set.id);
      if (window.gtrack) gtrack("generate-ai-set");
    } catch (e) {
      genBusy = false;
      setGenStatus((e && e.message) || "Generation failed.", "bad");
    }
  }

  // Builds fresh questions on this device from parameterised templates. The
  // answer is computed by the template rather than written down, so a
  // generated question cannot carry a wrong key.
  function genTopicsFor(secId) {
    const G = window.GMAT_GEN;
    return G ? G.TOPICS.filter(t => t.section === secId) : [];
  }
  function genPicked(secId) {
    const all = genTopicsFor(secId).map(t => t.id);
    const cur = (state.genPick && state.genPick[secId]) || [];
    const kept = cur.filter(id => all.indexOf(id) >= 0);
    return kept.length ? kept : all.slice(0, 1);
  }
  function generatorPanelHTML(sec) {
    const topics = genTopicsFor(sec.id);
    const key = tsecKey(sec.id, "generate");
    const open = `<section class="panel tabsec ${tsecCollapsed(key) ? "collapsed" : ""}" id="tab-generate" style="--secc:${sec.color}">` +
      tabSecHead(ICON.spark, "Generate practice", "Build a fresh set on any topic — new numbers every time, answers computed on the spot.", "", key) +
      `<div class="tabsec-body">`;
    const AI = window.GMAT_GEN && window.GMAT_GEN.ai;
    const aiOn = !!(AI && AI.hasKey());
    const mine0 = (state.genSets || []).filter(g => g.section === sec.id);
    // RC and CR have no template generators — a passage or an argument has to be
    // written, not parameterised — so those tabs offer the AI path instead.
    if (!topics.length) {
      let h = open;
      if (!aiOn) {
        h += `<p class="footnote" style="margin:0 0 4px;text-align:left">${esc(sec.nav)} questions need a written passage or argument, which the offline templates can't produce. Add an Anthropic API key under <b>Profile → AI question generation</b> to generate them.</p>`;
        return h + genListHTML(mine0, sec) + `</div></section>`;
      }
      h += `<div class="gen-row"><label for="gen-n-${esc(sec.id)}">Questions</label>` +
        `<select id="gen-n-${esc(sec.id)}" data-gencount="${esc(sec.id)}">` +
        [3, 4, 6, 8].map(n => `<option value="${n}"${n === 4 ? " selected" : ""}>${n}</option>`).join("") +
        `</select><button class="gen-go" data-genai="${esc(sec.id)}"${genBusy ? " disabled" : ""}>${genBusy ? "Writing…" : "✨ Generate with AI"}</button></div>`;
      if (genStatus) h += `<p class="ai-status ${genStatusCls}">${esc(genStatus)}</p>`;
      h += genListHTML(mine0, sec);
      h += `<p class="gen-note">Written by ${esc(AI.MODEL)} and billed to your own Anthropic account. These answers are model-written, not computed or checked against a printed key — useful for extra reps, but the verified sets above are the source of truth.</p>`;
      return h + `</div></section>`;
    }
    const picked = genPicked(sec.id);
    let h = open + `<div class="gen-chips">`;
    topics.forEach(t => {
      const on = picked.indexOf(t.id) >= 0;
      h += `<button type="button" class="gen-chip" aria-pressed="${on}" data-gentopic="${esc(sec.id)}|${esc(t.id)}">${esc(t.label)}</button>`;
    });
    h += `</div><div class="gen-row"><label for="gen-n-${esc(sec.id)}">Questions</label>` +
      `<select id="gen-n-${esc(sec.id)}" data-gencount="${esc(sec.id)}">` +
      [5, 10, 15, 20].map(n => `<option value="${n}"${n === 10 ? " selected" : ""}>${n}</option>`).join("") +
      `</select><button class="gen-go" data-gengo="${esc(sec.id)}"${picked.length ? "" : " disabled"}>✨ Generate set</button></div>`;
    h += genListHTML((state.genSets || []).filter(g => g.section === sec.id), sec);
    if (aiOn) h += `<div class="gen-row" style="margin-top:12px"><button class="gen-go" style="margin-left:0" data-genai="${esc(sec.id)}"${genBusy ? " disabled" : ""}>${genBusy ? "Writing…" : "✨ Or write new ones with AI"}</button></div>`;
    if (genStatus) h += `<p class="ai-status ${genStatusCls}">${esc(genStatus)}</p>`;
    h += `<p class="gen-note">Generated questions are built from templates and scored the same way as the rest of the app, so they count towards your topic accuracy. They supplement the verified bank — they don't replace it.</p>`;
    return h + `</div></section>`;
  }

  // The list of sets already generated for a section (shared by both paths).
  function genListHTML(mine, sec) {
    let h = "";
    if (mine.length) {
      h += `<div class="setlist" style="margin-top:15px">`;
      mine.slice().reverse().forEach(gs => {
        const run = getRun(gs.id), answered = Object.keys(run.ans).length;
        let status, cls;
        if (run.submitted) { const pct = Math.round((run.score / run.total) * 100); status = `${run.score}/${run.total} · ${pct}%`; cls = pct >= 80 ? "good" : pct >= 65 ? "mid" : "low"; }
        else if (answered) { status = `${answered}/${gs.questions.length} answered`; cls = ""; }
        else { status = "not started"; cls = "muted"; }
        h += `<div class="setrow"><span class="set-ic" style="--secc:${sec.color}">✨</span><div class="si"><div class="st">${esc(gs.title)}</div>
          <div class="sm"><span class="badge" style="--sc:${sec.color}">${gs.ai ? "AI · unverified" : "Generated"}</span><span>${gs.questions.length} Qs</span><span class="sstatus ${cls}">${status}</span></div></div>
          <div class="setbtns"><button class="reset-set" data-gendel="${esc(gs.id)}" title="Delete this generated set">🗑</button><button class="go ${run.submitted ? "done" : ""}" data-runset="${esc(gs.id)}">${run.submitted ? "Review" : answered ? "Resume" : "Start"}</button></div></div>`;
      });
      h += `</div>`;
    }
    return h;
  }

  function sectionHTML(sec) {
    const ag = sectionAgg(sec), p = accPct(ag.c, ag.d);
    let h = `<div class="sec-head" style="--secc:${sec.color}">
      <h2><span class="bar"></span>${esc(sec.title)}</h2>
      <p class="sec-exam">⏱ ${esc(EXAM[sec.id] || "")}</p>
      <div class="sec-stat"><span><b>${ag.d}</b> questions logged</span>${p!==null?`<span>Accuracy <b class="acc ${accClass(p)}">${p}%</b></span>`:""}${ag.ms>0?`<span>Avg <b>${fmtDur(ag.ms/ag.d)}</b>/q</span>`:""}<span><b>${sec.subjects.length}</b> areas</span></div>
    </div>`;
    // One pane at a time. Stacking all six made a subject tab eight screens
    // long; the sub-nav keeps everything reachable in a single tap.
    h += subnavHTML(sec);
    h += panePlain(() => paneHTML(sec, subtabOf(sec.id)));
    return h;
  }

  /* Sub-nav for the subject tabs */
  const PANES = [
    { id:"practice", label:"Practice" },
    { id:"concepts", label:"Concepts" },
    { id:"cards",    label:"Cards" },
    { id:"build",    label:"Build" },
    { id:"log",      label:"Log" }
  ];
  function subtabOf(secId) {
    const v = state.subtab && state.subtab[secId];
    return PANES.some(p => p.id === v) ? v : "practice";
  }
  function subnavHTML(sec) {
    const cur = subtabOf(sec.id);
    const btns = PANES.map(p =>
      `<button class="subnav-b${p.id === cur ? " on" : ""}" data-subtab="${esc(p.id)}" aria-current="${p.id === cur ? "page" : "false"}">${esc(p.label)}</button>`
    ).join("");
    return `<div class="subnav" style="--secc:${sec.color}" role="tablist">${btns}</div>`;
  }
  // Renders a pane with the section headers in their plain (un-numbered,
  // non-collapsible) form, restoring the flag even if the builder throws.
  function panePlain(fn) {
    tabsecPlain = true;
    try { return fn(); } finally { tabsecPlain = false; }
  }
  function paneHTML(sec, pane) {
    if (pane === "concepts") return conceptsPanelHTML(conceptsFor(sec.id), sec);
    if (pane === "cards")    return flashcardsPanelHTML(sec.id, sec, ICON.flash);
    if (pane === "build")    return generatorPanelHTML(sec);
    if (pane === "log")      return recalPanelHTML(sec) + questionsLoggedHTML(sec);
    return setsPanelHTML(setsFor(sec.id), { num: ICON.practice, sec });
  }

  function ring(pct, color) {
    const r=26, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
    return `<svg viewBox="0 0 64 64" class="ring"><circle class="ring-bg" cx="32" cy="32" r="${r}"/><circle class="ring-fg" cx="32" cy="32" r="${r}" style="stroke:${color};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg>`;
  }

  function overallHTML() {
    const g = grandAgg(), gt = g.d, gAcc = accPct(g.c, g.d);
    const touched = topicsTouched(), totalTopics = topicCountTotal();
    const dl = daysLeft(), today = todayTotal(), week = weekTotal(), st = streak();
    const dT = state.targets.daily||0, wT = state.targets.weekly||0;

    let h = `<div class="sec-head" style="--secc:var(--c-overall)"><h2><span class="bar"></span>Overall Progress</h2><p>${esc(SECTIONS.find(s=>s.dashboard).blurb)}</p></div>`;

    // adaptive practice session entry
    h += `<button class="cta-session" data-session-open="1"><span class="ico">🎯</span><div><div class="t">Start a practice session</div><div class="s">Pick topics, length &amp; a timer — questions get harder as you get them right, just like the real test.</div></div></button>`;

    // spaced-repetition review entry
    const due = reviewDueCount();
    if (due > 0) {
      h += `<button class="cta-review" data-review-open="1"><span class="ico">↻</span><div><div class="t">Review ${due} question${due===1?"":"s"}</div><div class="s">Your missed &amp; flagged questions, resurfaced on a spaced schedule. Clear them to lock in what you learn.</div></div><span class="cta-badge">${due}</span></button>`;
    }

    // focus timer entry
    h += `<button class="cta-focus" data-focus-open="1"><span class="ico">🍅</span><div><div class="t">Focus timer</div><div class="s">Pomodoro deep-work blocks with a break reminder${focusTodayCount()>0?` · ${focusTodayCount()} today`:""}</div></div><span class="cn-chev">›</span></button>`;

    // goals
    if (dT>0 || wT>0) {
      h += `<div class="goals">`;
      if (dT>0){ const p=today/dT; h += `<div class="goal"><div class="ring-wrap">${ring(p,"var(--accent)")}<span class="ring-pct">${Math.round(p*100)}%</span></div><div class="gt"><div class="gk">Today</div><div class="gv">${today} / ${dT}</div><div class="gs">${today>=dT?"target hit 🎯":(dT-today)+" to go"}</div></div></div>`; }
      if (wT>0){ const p=week/wT; h += `<div class="goal"><div class="ring-wrap">${ring(p,"var(--gold)")}<span class="ring-pct">${Math.round(p*100)}%</span></div><div class="gt"><div class="gk">This week</div><div class="gv">${week} / ${wT}</div><div class="gs">${week>=wT?"weekly goal met ✨":(wT-week)+" to go"}</div></div></div>`; }
      h += `</div>`;
    } else {
      h += `<div class="goals"><div class="goal goal-empty"><span class="gs">Set a <button class="link" data-open-profile="1">daily & weekly target</button> to track your pace.</span></div></div>`;
    }

    // Jump back in: the sets already under way. The full catalogue lives on the
    // subject tabs — listing all of it here made the dashboard eight screens long.
    const wip = SETS.map(s => ({ s, run: getRun(s.id) }))
      .filter(x => !x.run.submitted && Object.keys(x.run.ans).length > 0)
      // Most recently touched first; runs started before `at` was recorded fall
      // back to whichever has more answered.
      .sort((a, b) => (b.run.at || 0) - (a.run.at || 0)
                   || Object.keys(b.run.ans).length - Object.keys(a.run.ans).length)
      .slice(0, 3);
    if (wip.length) {
      h += `<div class="panel"><h3>Jump back in</h3><p class="sub">Sets you have started but not finished.</p><div class="setlist">`;
      wip.forEach(({ s, run }) => {
        const sec = secById(s.section), answered = Object.keys(run.ans).length;
        h += `<div class="setrow"><span class="set-ic" style="--secc:${sec.color}">${topicIcon(s.title, s.section)}</span><div class="si"><div class="st">${esc(s.title)}</div>
          <div class="sm"><span class="badge" style="--sc:${sec.color}">${esc(sec.nav)}</span><span class="sstatus">${answered}/${s.questions.length} answered</span></div></div>
          <div class="setbtns"><button class="go" data-runset="${esc(s.id)}">Resume</button></div></div>`;
      });
      h += `</div></div>`;
    }

    // Everything below is reference rather than action, so it sits behind one
    // toggle instead of adding four dashboards to the first screen.
    const po = !!state.progOpen;
    h += `<button class="prog-toggle ${po ? "on" : ""}" data-progtoggle="1" aria-expanded="${po}"><span class="t">Progress &amp; stats</span><span class="s">${gt} logged${gAcc!==null?` · ${gAcc}% accuracy`:""}${st>0?` · ${st}-day streak`:""}</span><span class="chev">▾</span></button>`;
    if (!po) { h += `<p class="footnote">Progress saves on this device · GMAT Focus Edition · ${APP_VERSION}</p>`; return h; }

    // tiles
    h += `<div class="grid-stats">
      <div class="stat"><div class="k">Total logged</div><div class="v">${gt}</div><div class="s">questions, all areas</div></div>
      <div class="stat"><div class="k">Accuracy</div><div class="v ${gAcc!==null?accClass(gAcc):""}">${gAcc===null?"—":gAcc+"%"}</div><div class="s">${gAcc===null?"log correct vs. attempted":g.c+" of "+g.d+" correct"}</div></div>
      <div class="stat"><div class="k">Day streak</div><div class="v" style="color:var(--gold)">${st}</div><div class="s">${st>0?"consecutive active days":"log today to start one"}</div></div>
      <div class="stat"><div class="k">Avg / question</div><div class="v">${g.ms>0?fmtDur(g.ms/g.d):"—"}</div><div class="s">${g.ms>0?"across timed questions":"time your practice sets"}</div></div>
      <div class="stat"><div class="k">${dl===null?"Exam":"Countdown"}</div><div class="v">${dl===null?"—":Math.abs(dl)}</div><div class="s">${dl===null?"set your date":dl>0?"days remaining":dl===0?"today — good luck!":"days ago"}</div></div>
    </div>`;

    // focus areas (weak spots)
    const cand = [];
    bySub.forEach(s => s.subjects.forEach(su => su.topics.forEach(t => {
      const id = topicId(s.id, su.name, t), r = getRec(id);
      if (r.d >= 5) cand.push({ sec:s, name:t, d:r.d, c:r.c, p:accPct(r.c,r.d) });
    })));
    cand.sort((a,b)=> a.p - b.p || b.d - a.d);
    h += `<div class="panel"><h3>Focus areas</h3><p class="sub">Your lowest-accuracy topics so far — where extra practice pays off most.</p>`;
    if (cand.length === 0) {
      h += `<p class="footnote" style="margin:2px 0 0;text-align:left">Log at least <b>5 questions</b> in a topic (with ✓ / ✗) and your weak spots will surface here automatically.</p>`;
    } else {
      h += `<div class="focus">`;
      cand.slice(0,5).forEach(f => {
        h += `<div class="focus-row"><div class="fn">${esc(f.name)}<span class="fq">${f.c} / ${f.d} correct</span></div>
          <span class="fchip" style="--fc:${f.sec.color}">${esc(f.sec.nav)}</span>
          <span class="facc ${accClass(f.p)}">${f.p}%</span></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;

    // breakdown
    const secs = bySub.map(s => ({ s, a: sectionAgg(s) }));
    const max = Math.max(1, ...secs.map(x => x.a.d));
    h += `<div class="panel"><h3>Effort by area</h3><p class="sub">Questions practised · accuracy. Keep all four areas moving. Syllabus covered: ${Math.round(touched/totalTopics*100)}% (${touched}/${totalTopics} topics).</p><div class="breakdown">`;
    secs.forEach(({ s, a }) => {
      const pct = a.d===0 ? 2 : Math.round(a.d/max*100), ap = accPct(a.c, a.d);
      h += `<div class="bd-row" style="--rc:${s.color}"><span class="bl"><span class="d"></span>${esc(s.title)}</span>
        <span class="track"><i style="width:${pct}%"></i></span>
        <span class="bv">${a.d} ${ap!==null?`<span class="ac ${accClass(ap)}">· ${ap}%</span>`:`<span class="ac" style="color:var(--ink-faint)">· —</span>`}</span></div>`;
    });
    h += `</div></div>`;

    // 7-day
    h += `<div class="panel"><h3>Last 7 days</h3><p class="sub">Questions logged each day.</p><div class="spark">`;
    const now = new Date(); now.setHours(0,0,0,0);
    const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], arr = [];
    for (let i=6;i>=0;i--){ const dd=new Date(now); dd.setDate(now.getDate()-i); arr.push({ label:i===0?"Today":wd[dd.getDay()], n:state.daily[dkey(dd)]||0, today:i===0 }); }
    const dmax = Math.max(1, ...arr.map(a=>a.n));
    arr.forEach(a => { const hp = a.n===0?3:Math.max(8,Math.round(a.n/dmax*100)); h += `<div class="bcol ${a.n>0?"has":""} ${a.today?"today":""}"><span class="bn">${a.n||""}</span><div class="b" style="height:${hp}%"></div><span class="bd">${a.label}</span></div>`; });
    h += `</div></div>`;

    if (dl!==null && dl>0) {
      h += `<div class="panel"><h3>Pacing</h3><p class="sub" style="margin:0">You have <b style="color:var(--ink)">${dl} day${dl===1?"":"s"}</b> to go. ${gt>0?`You've logged <b style="color:var(--ink)">${gt}</b> questions${gAcc!==null?` at <b style="color:var(--ink)">${gAcc}%</b> accuracy`:""}` : `A common benchmark is 1,500–2,000 practice questions before test day`} — steady daily reps across all four areas keep every topic warm.</p></div>`;
    }
    h += `<p class="footnote">Progress saves on this device · GMAT Focus Edition · ${APP_VERSION}</p>`;
    return h;
  }

  /* Log sheet */
  function openSheet(id) { const p = id.split("::"); sheet = { id, a:5, c:0, secId:p[0], subj:p[1], topic:p[2] }; renderSheet(); document.getElementById("logsheet").hidden = false; }
  function closeSheet() { document.getElementById("logsheet").hidden = true; sheet = null; }
  function renderSheet() {
    if (!sheet) return;
    const sec = secById(sheet.secId), r = getRec(sheet.id), p = accPct(r.c, r.d);
    document.getElementById("ls-card").innerHTML = `
      <div class="ls-eyebrow" style="--ls-c:${sec.color}">${esc(sec.nav)} · ${esc(sheet.subj)}</div>
      <div class="ls-title">${esc(sheet.topic)}</div>
      <div class="ls-crumb">Add a practice set — how many you did and how many you got right.</div>
      <div class="ls-row"><div class="li"><div class="lk">Attempted</div><div class="ls">questions in this set</div></div>
        <div class="stepper"><button class="step minus" data-sa="-1" ${sheet.a<=1?"disabled":""}>−</button><span class="ls-big">${sheet.a}</span><button class="step" data-sa="1">+</button></div></div>
      <div class="ls-row"><div class="li"><div class="lk">Correct</div><div class="ls">of those, how many right</div></div>
        <div class="stepper"><button class="step minus" data-sc="-1" ${sheet.c<=0?"disabled":""}>−</button><span class="ls-big">${sheet.c}</span><button class="step" data-sc="1" ${sheet.c>=sheet.a?"disabled":""}>+</button></div></div>
      <div class="ls-presets"><button data-sap="5">Set 5</button><button data-sap="10">Set 10</button><button data-sap="20">Set 20</button></div>
      <div class="ls-now">Now: <b>${r.d}</b> done${p!==null?` · <b>${p}%</b> accuracy`:""}</div>
      <button class="btn-primary" data-ssave="1" style="margin-top:14px">Add ${sheet.a} question${sheet.a===1?"":"s"}${sheet.c>0?` · ${sheet.c} correct`:""}</button>
      <button class="ls-reset" data-sreset="1">Reset this topic to zero</button>`;
  }

  /* Profile */
  function syncPanelInner() {
    let h = `<h3>Sync across devices</h3>`;
    if (!syncLinked()) {
      h += `<p class="sub">Keep your progress in step between your phone and iPad. It's stored in a private GitHub Gist that only you can see — create a token with <b>gist</b> scope, paste it below, then link your other devices with the same token.</p>
      <p class="footnote" style="text-align:left;margin:0 0 12px"><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=GMAT%20Prep%20sync" target="_blank" rel="noopener">Create a token on GitHub →</a> &nbsp;(tick only the <b>gist</b> scope)</p>
      <div class="field"><label for="sync-token">GitHub token</label><input id="sync-token" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false"></div>
      <button class="btn-primary" style="width:100%"${syncBusy ? " disabled" : ""} data-sync-link="1">${syncBusy ? "Linking…" : "Link this device"}</button>`;
    } else {
      const last = getLastSync();
      h += `<p class="sub">Synced ✓${last ? ` · last synced ${relTime(last)}` : ""}. Your progress updates automatically when you open the app or switch away from it.</p>
      <div class="pf-actions"><button class="btn-soft"${syncBusy ? " disabled" : ""} data-sync-now="1">${syncBusy ? "Syncing…" : "↻ Sync now"}</button><button class="btn-soft" data-sync-unlink="1">Unlink</button></div>`;
    }
    if (syncStatus) h += `<p class="footnote" style="text-align:left;margin:12px 0 0">${esc(syncStatus)}</p>`;
    h += `<p class="footnote" style="text-align:left;margin:12px 0 0">Your token stays on this device and is only ever sent to GitHub. A private gist is unlisted (not searchable) rather than encrypted — fine for personal study stats. Revoke the token anytime in GitHub settings.</p>`;
    return h;
  }

  function profileHTML() {
    const g = grandAgg(), gAcc = accPct(g.c, g.d), st = streak(), today = todayTotal(), week = weekTotal();
    const dT = state.targets.daily||0, wT = state.targets.weekly||0, dl = daysLeft();
    const themePref = localStorage.getItem("gmat_theme") || "system";
    const installable = !!window.__gmatInstall;

    let h = `<section class="panel"><div class="pf-id">
      <div class="big">${state.name ? esc(state.name.trim()[0].toUpperCase()) : ICON.person}</div>
      <div><div class="nm">${state.name ? esc(state.name) : "Your Study Log"}</div>
      <div class="meta">${dl===null?"No exam date set":dl>0?`Exam in ${dl} days · ${esc(new Date(state.examDate+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}))}`:"Exam date passed"}</div>
      <div class="pf-chips"><span class="chip hot">🔥 ${st}-day streak</span><span class="chip">${g.d} logged</span>${gAcc!==null?`<span class="chip">${gAcc}% accuracy</span>`:""}</div></div></div></section>`;

    h += `<section class="panel"><h3>Details</h3><p class="sub">Your name and target exam date.</p>
      <div class="field"><label for="pf-name">Name</label><input id="pf-name" type="text" value="${esc(state.name)}" placeholder="Your name" autocomplete="off"/></div>
      <div class="field"><label for="pf-date">Exam date</label><input id="pf-date" type="date" value="${esc(state.examDate)}"/></div>
      <button class="btn-primary" data-save-details="1">Save details</button></section>`;

    h += `<section class="panel"><h3>Daily & weekly targets</h3><p class="sub">How many questions you aim to practise. These drive the rings and the calendar colours.</p>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Daily target</div><div class="tgt-s">questions per day</div></div>
        <div class="stepper"><button class="step minus" data-tgt="daily" data-d="-5">−</button><span class="tgt-val">${dT}</span><button class="step" data-tgt="daily" data-d="5">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${dT?Math.min(100,Math.round(today/dT*100)):0}%"></i></div><div class="tgt-cap"><span>Today</span><span>${today} / ${dT||"—"}</span></div></div>
      <div class="tgt-row"><div class="tgt-info"><div class="tgt-k">Weekly target</div><div class="tgt-s">questions this week (Mon–Sun)</div></div>
        <div class="stepper"><button class="step minus" data-tgt="weekly" data-d="-10">−</button><span class="tgt-val">${wT}</span><button class="step" data-tgt="weekly" data-d="10">+</button></div></div>
      <div class="tgt-prog"><div class="tgt-bar"><i style="width:${wT?Math.min(100,Math.round(week/wT*100)):0}%;background:var(--gold)"></i></div><div class="tgt-cap"><span>This week</span><span>${week} / ${wT||"—"}</span></div></div></section>`;

    h += `<section class="panel"><h3>Activity calendar</h3><p class="sub">Every day you log questions, coloured by how close you got to your daily target.</p>${calendarHTML()}</section>`;

    h += `<section class="panel"><h3>Backup & restore</h3><p class="sub">Your data lives on this device only. Download a backup so you never lose it — then restore it on a new phone or after reinstalling.</p>
      <div class="pf-actions"><button class="btn-soft" data-backup="1">⬇ Back up data</button><button class="btn-soft" data-restore="1">⬆ Restore</button></div>
      ${installable?`<button class="btn-primary" style="margin-top:12px" data-install="1">Install app on this device</button>`:""}</section>`;

    h += `<section class="panel" id="sync-panel">${syncPanelInner()}</section>`;

    h += `<section class="panel" id="ai-panel">${aiPanelInner()}</section>`;

    h += `<section class="panel"><h3>Appearance</h3><p class="sub">Choose how the app looks.</p>
      <div class="seg"><button data-theme-set="light" class="${themePref==='light'?'on':''}">Light</button><button data-theme-set="dark" class="${themePref==='dark'?'on':''}">Dark</button><button data-theme-set="system" class="${themePref==='system'?'on':''}">System</button></div></section>`;

    // Study reminders
    const rem = state.reminder || { on:false, time:"19:00" };
    const perm = ("Notification" in window) ? Notification.permission : "unsupported";
    let remStatus;
    if (perm === "unsupported") remStatus = "Your browser doesn't support notifications.";
    else if (perm === "denied") remStatus = "Notifications are blocked — enable them for this site in your browser settings.";
    else if (rem.on && perm === "granted") remStatus = `On — you'll get a nudge at ${fmtTime12(rem.time)} on days you haven't practised.`;
    else remStatus = "Get a daily nudge to keep your streak alive.";
    h += `<section class="panel"><h3>Study reminders</h3><p class="sub">${esc(remStatus)}</p>
      <label class="pf-toggle"><span>Daily practice reminder</span><input type="checkbox" id="rem-on" ${rem.on?"checked":""} ${perm==="unsupported"||perm==="denied"?"disabled":""}></label>

  /* Backup / restore */
  function backup() {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "gmat-prep-backup-" + dkey() + ".json"; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
    } catch (e) { alert("Couldn't create the backup on this device."); }
  }
  function restoreFrom(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const p = JSON.parse(reader.result);
        if (!p || typeof p !== "object" || !("counts" in p) || !("daily" in p)) throw new Error("shape");
        if (!confirm("Restore this backup? It replaces your current data on this device.")) return;
        state = sanitize(p);
        save(); renderProfile(); render();
      } catch (e) { alert("That doesn't look like a GMAT Prep backup file."); }
    };
    reader.readAsText(file);
  }

  /* ---- Cross-device sync (private GitHub Gist store) ----
     No backend: the full state JSON lives in one private gist the user owns.
     GitHub's REST API is CORS-enabled for authenticated calls, so both iOS
     Safari and Android Chrome can read/write it directly. Cumulative data is
     max/union-merged (never loses logged questions); settings are last-write-
     wins by a syncedAt marker. */
  const SYNC_TOKEN_KEY = "gmat_sync_token";
  const SYNC_GIST_KEY  = "gmat_sync_gist";
  const SYNC_AT_KEY    = "gmat_sync_at";
  const SYNC_FILE = "gmat-prep-data.json";
  let syncStatus = "";      // human-readable status shown in the Sync panel
  let syncBusy = false;     // disables buttons + shows spinner text
  let pushTimer = null;     // debounce handle for push-after-save

  function syncCfg() { try { return { token: localStorage.getItem(SYNC_TOKEN_KEY) || "", gist: localStorage.getItem(SYNC_GIST_KEY) || "" }; } catch (e) { return { token:"", gist:"" }; } }
  function setSyncCfg(token, gist) { try { if (token != null) localStorage.setItem(SYNC_TOKEN_KEY, token); if (gist != null) localStorage.setItem(SYNC_GIST_KEY, gist); } catch (e) {} }
  function syncLinked() { const c = syncCfg(); return !!(c.token && c.gist); }
  function unlink() { try { localStorage.removeItem(SYNC_TOKEN_KEY); localStorage.removeItem(SYNC_GIST_KEY); localStorage.removeItem(SYNC_AT_KEY); } catch (e) {} syncStatus = ""; }
  function getLastSync() { try { return parseInt(localStorage.getItem(SYNC_AT_KEY) || "0", 10) || 0; } catch (e) { return 0; } }
  function setLastSync(t) { try { localStorage.setItem(SYNC_AT_KEY, String(t)); } catch (e) {} }
  function relTime(t) {
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 45) return "just now";
    const m = Math.round(s / 60); if (m < 60) return m + " min ago";
    const h = Math.round(m / 60); if (h < 24) return h + " hr ago";
    const d = Math.round(h / 24); return d + " day" + (d === 1 ? "" : "s") + " ago";
  }

  async function ghFetch(path, opts) {
    const c = syncCfg(); opts = opts || {};
    const res = await fetch("https://api.github.com" + path, Object.assign({}, opts, {
      headers: Object.assign({
        "Authorization": "Bearer " + c.token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      }, opts.headers || {})
    }));
    if (res.status === 401 || res.status === 403) throw new Error("auth");
    if (!res.ok) throw new Error("http " + res.status);
    return res.json();
  }

  /* ---- merge helpers ---- */
  function mergeCounts(a, b) {
    const out = {}, ids = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    const norm = (r) => !r ? { d:0, c:0, ms:0 } : (typeof r === "number" ? { d:r, c:0, ms:0 } : { d:r.d||0, c:r.c||0, ms:r.ms||0 });
    ids.forEach(id => {
      const x = norm((a || {})[id]), y = norm((b || {})[id]);
      const yWins = (y.d > x.d) || (y.d === x.d && y.c > x.c) || (y.d === x.d && y.c === x.c && y.ms > x.ms);
      const w = yWins ? y : x;
      if (w.d > 0 || w.c > 0) out[id] = { d:w.d, c:w.c, ms:w.ms };
    });
    return out;
  }
  function mergeMaxNum(a, b) { const out = {}, ks = new Set(Object.keys(a || {}).concat(Object.keys(b || {}))); ks.forEach(k => { out[k] = Math.max((a || {})[k] || 0, (b || {})[k] || 0); }); return out; }
  function mergeActivity(a, b) {
    const out = {}, dks = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    dks.forEach(dk => { const x = (a || {})[dk] || {}, y = (b || {})[dk] || {}, m = {}, kinds = new Set(Object.keys(x).concat(Object.keys(y)));
      kinds.forEach(kd => { m[kd] = Math.max(x[kd] || 0, y[kd] || 0); }); out[dk] = m; });
    return out;
  }
  function mergeNestedUnion(a, b) {   // { outer: { inner: truthy } } — e.g. flags, read
    const out = {}, ok = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    ok.forEach(o => { out[o] = Object.assign({}, (a || {})[o] || {}, (b || {})[o] || {}); });
    return out;
  }
  function mergeRuns(a, b) {
    const out = {}, ks = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    const ansN = (r) => r && r.ans ? Object.keys(r.ans).length : 0;
    ks.forEach(k => { const x = (a || {})[k], y = (b || {})[k]; if (!x) { out[k] = y; return; } if (!y) { out[k] = x; return; } out[k] = ansN(y) > ansN(x) ? y : x; });
    return out;
  }
  function mergeSrs(a, b, cloudNewer) {   // union keys; on conflict take the newer side
    const out = {}, ks = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    ks.forEach(k => { const x = (a || {})[k], y = (b || {})[k]; out[k] = (x && y) ? (cloudNewer ? y : x) : (x || y); });
    return out;
  }
  function mergeState(local, cloud) {
    local = local || {}; cloud = cloud || {};
    const lt = local.syncedAt || 0, ct = cloud.syncedAt || 0, cloudNewer = ct > lt;
    const lww = (key, dflt) => { const lv = local[key], cv = cloud[key];
      if (lv === undefined) return cv === undefined ? dflt : cv;
      if (cv === undefined) return lv; return cloudNewer ? cv : lv; };
    const m = Object.assign({}, defaults, local, cloud);
    m.counts   = mergeCounts(local.counts, cloud.counts);
    m.daily    = mergeMaxNum(local.daily, cloud.daily);
    m.activity = mergeActivity(local.activity, cloud.activity);
    m.flags    = mergeNestedUnion(local.flags, cloud.flags);
    m.read     = mergeNestedUnion(local.read, cloud.read);
    m.runs     = mergeRuns(local.runs, cloud.runs);
    m.srs      = mergeSrs(local.srs, cloud.srs, cloudNewer);
    m.fcsrs    = mergeSrs(local.fcsrs, cloud.fcsrs, cloudNewer);
    m.celebrated = Object.assign({}, local.celebrated, cloud.celebrated);   // union: never re-congratulate
    m.name     = lww("name", "");
    m.examDate = lww("examDate", "");
    m.active   = lww("active", "overall");
    m.fcMode   = lww("fcMode", "flip");
    m.collapsed = lww("collapsed", {});
    m.reminder = lww("reminder", defaults.reminder);
    m.targets  = Object.assign({}, defaults.targets, lww("targets", defaults.targets));
    m.syncedAt = Math.max(lt, ct);
    // Cloud data comes from another device or a hand-edited gist, so it is the
    // likeliest source of a wrong-shaped field.
    return sanitize(m);
  }

  async function pull(silent) {
    if (!syncLinked() || !navigator.onLine) return;
    const c = syncCfg();
    const g = await ghFetch("/gists/" + c.gist);
    const f = g.files && g.files[SYNC_FILE];
    if (!f) return;
    let content = f.content;
    if (f.truncated && f.raw_url) { content = await (await fetch(f.raw_url)).text(); }
    const cloud = JSON.parse(content);
    state = mergeState(state, cloud);
    save();
    render(); renderTop(); renderBotnav();
    if (!document.getElementById("profile").hidden) renderProfile();
    if (!silent) { syncStatus = "Synced ✓"; renderSyncPanel(); }
  }
  async function push() {
    if (!syncLinked() || !navigator.onLine) return;
    const c = syncCfg();
    const payload = Object.assign({}, state, { syncedAt: Date.now() });
    await ghFetch("/gists/" + c.gist, { method:"PATCH", body: JSON.stringify({
      files: { [SYNC_FILE]: { content: JSON.stringify(payload) } }
    }) });
    state.syncedAt = payload.syncedAt;
    setLastSync(payload.syncedAt);
  }
  function scheduleSyncPush() {
    if (!syncLinked() || !navigator.onLine) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(() => { pushTimer = null; push().then(() => renderSyncPanel()).catch(() => {}); }, 4000);
  }
  async function linkDevice(token) {
    setSyncCfg(token, "");                                  // store token, clear any old gist id
    const gists = await ghFetch("/gists?per_page=100");    // validates token + discovers existing store
    let found = "";
    for (let i = 0; i < gists.length; i++) { if (gists[i].files && gists[i].files[SYNC_FILE]) { found = gists[i].id; break; } }
    if (found) {
      setSyncCfg(null, found);
      await pull(true);
      setLastSync(Date.now());
      syncStatus = "Linked — pulled your existing data onto this device.";
    } else {
      state.syncedAt = Date.now();
      const created = await ghFetch("/gists", { method:"POST", body: JSON.stringify({
        description: "GMAT Prep Tracker — synced study data (private)", public: false,
        files: { [SYNC_FILE]: { content: JSON.stringify(state) } }
      }) });
      save();
      setSyncCfg(null, created.id);
      setLastSync(state.syncedAt);
      syncStatus = "Linked — this device is now your sync source.";
    }
    renderSyncPanel();
  }
  async function syncNow() {
    if (!syncLinked() || syncBusy) return;
    syncBusy = true; syncStatus = "Syncing…"; renderSyncPanel();
    try { await pull(true); await push(); syncStatus = "Synced ✓"; }
    catch (e) { syncStatus = e.message === "auth" ? "Token was rejected — re-link this device." : (!navigator.onLine ? "You're offline — will sync when back online." : "Sync failed — try again."); }
    syncBusy = false; renderSyncPanel();
  }
  /* ---- AI question generation (optional add-on) ---- */
  function aiPanelInner() {

        <p class="sub" style="margin-top:8px">Questions written this way are produced by ${esc(AI.MODEL)} and are <b>not</b> verified the way the rest of the bank is — treat them as extra drilling, not as a source of truth.</p>
        <div class="pf-actions"><button class="btn-soft" data-ai-forget="1">Remove key from this device</button></div>`;
    } else {

        <p class="sub" style="margin-top:8px">The key is stored only in this device's browser storage and is sent only to api.anthropic.com. It is never included in a backup or in cross-device sync, and you can revoke it any time at <b>console.anthropic.com</b>. Generating questions is billed to your own account.</p>
        <p class="footnote" style="text-align:left;margin:0 0 12px"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Create an API key →</a></p>
        <div class="field"><label for="ai-key">Anthropic API key</label><input id="ai-key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></div>
        <div class="pf-actions"><button class="btn-primary" data-ai-save="1">Save key</button></div>`;

  }
  function renderAiPanel() { const el = document.getElementById("ai-panel"); if (el) el.innerHTML = aiPanelInner(); }

  function renderSyncPanel() { const el = document.getElementById("sync-panel"); if (el) el.innerHTML = syncPanelInner(); }

  /* Events — view */
  document.getElementById("view").addEventListener("click", (e) => {
    const sn = e.target.closest("[data-subtab]");
    if (sn) { state.subtab[state.active] = sn.getAttribute("data-subtab"); save(); renderView(); window.scrollTo({ top:0 }); return; }
    const pg = e.target.closest("[data-progtoggle]"); if (pg) { state.progOpen = !state.progOpen; save(); renderView(); return; }
    const mk = e.target.closest("[data-mk]"); if (mk) { logQ(mk.getAttribute("data-mk"), 1, mk.getAttribute("data-c")==="1"?1:0); return; }
    const ed = e.target.closest("[data-edit]"); if (ed) { openSheet(ed.getAttribute("data-edit")); return; }
    const col = e.target.closest("[data-collapse]"); if (col) { const k=col.getAttribute("data-collapse"); state.collapsed[k]=!state.collapsed[k]; save(); renderView(); return; }
    const ts = e.target.closest("[data-tabsec]"); if (ts) { const k=ts.getAttribute("data-tabsec"); state.collapsed[k]=!state.collapsed[k]; save(); renderView(); return; }
    const rset = e.target.closest("[data-resetset]"); if (rset) { const set = SETS.find(s => s.id === rset.getAttribute("data-resetset")); if (set && confirm(`Reset "${set.title}"?\n\nThis clears your answers and removes what this set added to your accuracy and today's count.`)) { resetRun(set, false); render(); } return; }
    const rs = e.target.closest("[data-runset]"); if (rs) { openRunner(rs.getAttribute("data-runset")); return; }
    const gt = e.target.closest("[data-gentopic]"); if (gt) {
      const [secId, topId] = gt.getAttribute("data-gentopic").split("|");
      const cur = genPicked(secId).slice(), at = cur.indexOf(topId);
      if (at >= 0) { if (cur.length > 1) cur.splice(at, 1); } else cur.push(topId);
      state.genPick = state.genPick || {}; state.genPick[secId] = cur; save(); renderView(); return;
    }
    const gg = e.target.closest("[data-gengo]"); if (gg) { generateSet(gg.getAttribute("data-gengo")); return; }
    const ga = e.target.closest("[data-genai]"); if (ga) { generateAiSet(ga.getAttribute("data-genai")); return; }
    const gd = e.target.closest("[data-gendel]"); if (gd) {

        delete state.runs[id];

    if (e.target.closest("[data-review-open]")) { openReview(); return; }
    if (e.target.closest("[data-focus-open]")) { openFocus(); return; }
    if (e.target.closest("[data-open-profile]")) openProfile();
  });
  // Keyboard: Enter / Space toggles a section header (it has role="button").
  document.getElementById("view").addEventListener("keydown", (e) => {

  /* Events — log sheet */
  document.getElementById("logsheet").addEventListener("click", (e) => {
    if (e.target.id === "logsheet") { closeSheet(); return; }
    if (!sheet) return;
    const sa = e.target.closest("[data-sa]"); if (sa) { sheet.a = Math.max(1, sheet.a + parseInt(sa.getAttribute("data-sa"),10)); if (sheet.c > sheet.a) sheet.c = sheet.a; renderSheet(); return; }
    const sc = e.target.closest("[data-sc]"); if (sc) { sheet.c = Math.max(0, Math.min(sheet.a, sheet.c + parseInt(sc.getAttribute("data-sc"),10))); renderSheet(); return; }

  });

  /* Events — profile */
  document.getElementById("profile").addEventListener("click", (e) => {
    const tgt = e.target.closest("[data-tgt]"); if (tgt) { const k=tgt.getAttribute("data-tgt"); state.targets[k]=Math.max(0,(state.targets[k]||0)+parseInt(tgt.getAttribute("data-d"),10)); save(); renderProfile(); return; }

    if (e.target.closest("[data-refresh]")) { try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(r => { if (r) r.update(); }); } catch (e) {} location.reload(); return; }
    if (e.target.closest("[data-install]")) { const p=window.__gmatInstall; if (p) { p.prompt(); p.userChoice.finally(()=>{ window.__gmatInstall=null; renderProfile(); }); } return; }
    if (e.target.closest("[data-sync-link]")) {

      linkDevice(t).catch(err => { syncStatus = err && err.message === "auth" ? "That token was rejected — check it has the gist scope." : "Couldn't link — check your connection and try again."; })

  // Reminder toggle / time (change events, not clicks)

  /* Theme */
  function setTheme(v){ if (v==="system"){ document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("gmat_theme","system");}catch(e){} } else { document.documentElement.setAttribute("data-theme",v); try{localStorage.setItem("gmat_theme",v);}catch(e){} } }
  (function(){ const t=localStorage.getItem("gmat_theme"); if (t && t!=="system") document.documentElement.setAttribute("data-theme",t); })();

  /* ===================== Practice sets ===================== */
  // Merge the expansion questions (sets-extra.js) into their parent sets, each
  // appended with the next sequential `n`. Kept in a separate file so the large
  // hand-formatted sets.js stays untouched.
  (function () {
    const extra = window.GMAT_SETS_EXTRA || [], base = window.GMAT_SETS || [];
    extra.forEach(x => {
      const set = base.find(s => s.id === x.setId);
      if (!set || !Array.isArray(set.questions) || !Array.isArray(x.add)) return;
      // Number from the highest existing n, not from the count — a base set
      // whose numbering has gaps would otherwise collide with itself.
      let next = set.questions.reduce((m, q) => Math.max(m, q.n || 0), 0);
      x.add.forEach(q => { set.questions.push(Object.assign({ n: ++next }, q)); });
    });
    // Whole new sets (e.g. new RC passages in sets-rc.js) are appended as-is.
    (window.GMAT_SETS_NEW || []).forEach(s => { if (s && Array.isArray(s.questions) && s.questions.length && !base.some(b => b.id === s.id)) base.push(s); });
  })();
  // Sets the user generated on this device live in state, so they survive a
  // reload and their runs are tracked exactly like a hand-authored set's.
  (function () {
    const base = window.GMAT_SETS || [];
    (state.genSets || []).forEach(gs => {
      if (gs && Array.isArray(gs.questions) && gs.questions.length && !base.some(b => b.id === gs.id)) base.push(gs);
    });
  })();
  const SETS = (window.GMAT_SETS || []).filter(s => s && Array.isArray(s.questions) && s.questions.length);
  const LET = ["A","B","C","D","E","F","G","H"];
  const setsFor = (secId) => SETS.filter(s => s.section === secId);

  /* ===== Concept guides (theory) ===== */
  const CONCEPTS = (window.GMAT_CONCEPTS || []).filter(g => g && Array.isArray(g.parts) && g.parts.length);
  const conceptsFor = (secId) => CONCEPTS.filter(g => g.section === secId);

  /* ===================== Flash cards (quick-reference rules & formulas) ===================== */
  const FLASHCARDS = window.GMAT_FLASHCARDS || [];
  const flashDecksFor = (secId) => { const s = FLASHCARDS.find(x => x.section === secId); return s ? s.decks : []; };
  const DECK_ICONS = { "fc-q-pct":"%","fc-q-pl":"🏷","fc-q-int":"💰","fc-q-ratio":"⚖","fc-q-speed":"🚄","fc-q-work":"🛠","fc-q-avg":"📊","fc-q-exp":"^","fc-q-alg":"𝑥","fc-q-num":"#","fc-q-prob":"🎲","fc-q-seq":"∑","fc-d-ds":"◧","fc-d-ds2":"🎯","fc-d-graph":"📈","fc-rc-oct":"📖","fc-rc-types":"❓","fc-rc-traps":"⚠","fc-cr-anatomy":"🧩","fc-cr-types":"🗂","fc-cr-tools":"🔧","fc-cr-flaws":"⚡" };
  // Pick a topic emoji from a title — gives every concept guide and practice set
  // a glanceable icon, matching the flash-card deck vocabulary. Checked most-
  // specific first; falls back to a per-section default.
  function topicIcon(title, secId) {
    const t = (title || "").toLowerCase(), h = (...ws) => ws.some(w => t.indexOf(w) >= 0);
    if (h("passage")) return "📄";
    if (h("data sufficiency")) return "◧";
    if (h("data insights", "what data")) return "🧮";
    if (h("two-part", "two part")) return "🔀";
    if (h("graphic", "graph", "trend")) return "📈";
    if (h("table")) return "▦";
    if (h("multi-source", "multi source", "source")) return "🗂";
    if (h("octaave", "how rc")) return "📖";
    if (h("opinion")) return "🗣";
    if (h("contradiction")) return "↔";
    if (h("tone")) return "🎭";
    if (h("awareness")) return "👁";
    if (h("avoid")) return "🚫";
    if (h("verify", "eliminate")) return "✅";
    if (h("inference", "must be true")) return "🔎";
    if (h("conditional")) return "🔗";
    if (h("weaken")) return "⬇";
    if (h("strengthen")) return "💪";
    if (h("assumption")) return "🧱";
    if (h("evaluate")) return "🔬";
    if (h("paradox", "resolve", "explain")) return "🧩";
    if (h("flaw")) return "⚡";
    if (h("boldface", "method of reasoning")) return "🏗";
    if (h("conclusion")) return "🎯";
    if (h("how cr", "critical reasoning")) return "💬";
    if (h("pacing")) return "⏱";
    if (h("scoring")) return "🏆";
    if (h("what to study")) return "🗺";
    if (h("how gmat quant", "quant —", "how it works")) return "⚙";
    if (h("percent")) return "%";
    if (h("ratio", "proportion")) return "⚖";
    if (h("interest")) return "💰";
    if (h("profit", "loss", "discount")) return "🏷";
    if (h("speed", "distance")) return "🚄";
    if (h("work", "pipe")) return "🛠";
    if (h("average")) return "📊";
    if (h("mixture", "alligation")) return "⚗";
    if (h("exponent", "root", "power")) return "√";
    if (h("algebra")) return "𝑥";
    if (h("probab")) return "🎲";
    if (h("sequence", "series", "progression")) return "∑";
    if (h("geometry", "triangle", "angle", "circle")) return "📐";
    if (h("number", "simplification")) return "#";
    return secId === "quant" ? "🔢" : secId === "data" ? "📊" : secId === "rc" ? "📖" : secId === "cr" ? "💡" : "★";
  }

  function flashcardsPanelHTML(secId, sec, num) {
    const decks = flashDecksFor(secId), secc = sec ? sec.color : "var(--accent)";
    const total = decks.reduce((a, d) => a + d.cards.length, 0);
    const key = tsecKey(secId, "flash"), secDue = fcSectionDue(secId);
    const meta = total ? `${total} cards${secDue ? ` · <span style="color:var(--gold)">${secDue} due</span>` : ""}` : "";
    let h = `<section class="panel tabsec ${tsecCollapsed(key) ? "collapsed" : ""}" id="tab-flash" style="--secc:${secc}">${tabSecHead(num, "Flash cards", "Rate each card — the ones you don't know come back sooner (spaced repetition).", meta, key)}`;
    if (!decks.length) return h + `<div class="tabsec-body"><p class="footnote" style="margin:0;text-align:left">No flash cards here yet.</p></div></section>`;
    h += `<div class="tabsec-body">`;
    decks.forEach(d => {
      const due = fcDeckDue(d);
      h += `<button class="fc-deckrow" data-flashdeck="${esc(d.id)}"><span class="fc-deckicon">${DECK_ICONS[d.id] || "★"}</span><span class="fc-deckmeta"><span class="fc-decktitle">${esc(d.title)}</span><span class="fc-decksub">${d.cards.length} card${d.cards.length === 1 ? "" : "s"}</span></span>${due ? `<span class="fc-due">${due} due</span>` : ""}<span class="cn-chev">›</span></button>`;
    });
    return h + `</div></section>`;
  }

  /* Flash-card confidence (spaced repetition) */
  const FC_INTERVALS = { 1:1, 2:3, 3:8, 4:20, 5:45 };
  const fcCardKey = (deckId, i) => deckId + "#" + i;
  function fcGrade(deckId, i, knew) {
    if (!state.fcsrs) state.fcsrs = {};
    const k = fcCardKey(deckId, i), e = state.fcsrs[k] || { box:0 };
    if (knew) { e.box = Math.min(5, (e.box || 0) + 1); e.due = addDaysKey(FC_INTERVALS[e.box] || 45); }
    else { e.box = 1; e.due = dkey(); }
    state.fcsrs[k] = e; save();
  }
  function fcCardStudied(deckId, i) { return !!(state.fcsrs && state.fcsrs[fcCardKey(deckId, i)]); }
  function fcCardDueNow(deckId, i) { const e = state.fcsrs && state.fcsrs[fcCardKey(deckId, i)]; return !!(e && (!e.due || e.due <= dkey())); }
  function fcDeckDue(deck) { let n = 0; deck.cards.forEach((_, i) => { if (fcCardDueNow(deck.id, i)) n++; }); return n; }
  function fcSectionDue(secId) { return flashDecksFor(secId).reduce((a, d) => a + fcDeckDue(d), 0); }
  // Order cards: due-for-review first, then never-studied, then not-yet-due.
  function fcDeckOrder(deck) {
    const idx = deck.cards.map((_, i) => i);
    const rank = (i) => fcCardDueNow(deck.id, i) ? 0 : (!fcCardStudied(deck.id, i) ? 1 : 2);
    return idx.sort((a, b) => rank(a) - rank(b));
  }

  let fcDeck = null, fcSecId = null, fcIdx = 0, fcFlipped = false, fcOrder = [], fcSession = { knew:0, didnt:0 };
  function openFlashDeck(deckId, secId) {
    const decks = flashDecksFor(secId), d = decks.find(x => x.id === deckId);
    if (!d) return;
    fcDeck = d; fcSecId = secId; fcIdx = 0; fcFlipped = false; fcSession = { knew:0, didnt:0 };
    fcOrder = fcDeckOrder(d);
    document.getElementById("fc-title").textContent = d.title;
    const sec = secById(secId);
    document.getElementById("flash").style.setProperty("--secc", sec ? sec.color : "var(--accent)");
    renderFlash();
    document.getElementById("flash").hidden = false;
    document.body.style.overflow = "hidden"; window.scrollTo({ top: 0 });
    markActivity("flash");
    if (window.gtrack) gtrack("flashcards-open");
  }
  function closeFlash() { document.getElementById("flash").hidden = true; fcDeck = null; document.body.style.overflow = ""; render(); }
  function fcModeCur() { return state.fcMode === "both" ? "both" : "flip"; }
  function renderFlash() {
    if (!fcDeck) return;
    const n = fcOrder.length, mode = fcModeCur();
    const body = document.getElementById("fc-body");
    if (fcIdx >= n) {   // completion after grading through the deck
      const done = fcSession.knew + fcSession.didnt;
      body.innerHTML = `<div class="fc-view">
        <div class="rn-score panel"><div class="rs-num">${fcSession.knew}<span class="rs-tot">/ ${done}</span></div><div class="rs-side"><div class="rs-pct">knew it</div><div class="rs-log">${fcSession.didnt} to revisit</div></div></div>
        <div class="panel" style="margin-top:14px"><h3>Deck reviewed</h3><p class="sub" style="margin:0">Cards you didn't know come back sooner; ones you knew are spaced further out. ${fcSession.didnt?`<b>${fcSession.didnt}</b> card${fcSession.didnt===1?"":"s"} will resurface soon.`:"Great recall! 🎉"}</p></div>
        <div class="rn-foot"><button class="btn-soft" style="flex:none;padding:11px 20px" data-fcrestart>Study again</button><button class="btn-primary" style="width:auto;padding:12px 22px" data-fcclose>Done</button></div>
      </div>`;
      typeset(body); return;
    }
    const card = fcDeck.cards[fcOrder[fcIdx]];
    const modebar = `<div class="fc-modebar">
      <button class="fc-modebtn ${mode === "flip" ? "on" : ""}" data-fcmode="flip">🔄 Flip to reveal</button>
      <button class="fc-modebtn ${mode === "both" ? "on" : ""}" data-fcmode="both">👁 Both sides</button></div>`;
    let cardHTML, hint = "", answerShown;
    if (mode === "both") {
      answerShown = true;
      cardHTML = `<div class="fc-card both"><div class="fc-cc">
        <span class="fc-tag">Prompt</span><div class="fc-q">${card.f}</div>
        <div class="fc-div"></div>
        <span class="fc-tag">Answer</span><div class="fc-a">${card.b}</div>
      </div></div>`;
    } else {
      answerShown = fcFlipped;
      cardHTML = `<div class="fc-card ${fcFlipped ? "back" : ""}" data-fcflip="1"><div class="fc-cc">
        <span class="fc-tag">${fcFlipped ? "Answer" : "Prompt"}</span>
        <div class="${fcFlipped ? "fc-a" : "fc-q"}">${fcFlipped ? card.b : card.f}</div>
      </div></div>`;
      hint = `<div class="fc-hint">Tap the card ${fcFlipped ? "to see the prompt" : "or press Flip to reveal the answer"}</div>`;
    }
    // Confidence buttons appear once the answer is visible; they grade + advance.
    const grade = answerShown
      ? `<div class="fc-grade"><button class="fc-g no" data-fcgrade="0">😕 Didn't know</button><button class="fc-g yes" data-fcgrade="1">😎 Knew it</button></div>`
      : "";
    const nav = mode === "both"
      ? `<div class="fc-nav"><button data-fcprev ${fcIdx === 0 ? "disabled" : ""}>‹ Prev</button><button data-fcnext ${fcIdx === n - 1 ? "disabled" : ""}>Next ›</button></div>`
      : `<div class="fc-nav"><button data-fcprev ${fcIdx === 0 ? "disabled" : ""}>‹ Prev</button><button class="fc-flip" data-fcflip="1">Flip</button><button data-fcnext ${fcIdx === n - 1 ? "disabled" : ""}>Next ›</button></div>`;
    body.innerHTML = `<div class="fc-view">
      ${modebar}
      <div class="fc-count">Card ${fcIdx + 1} of ${n}</div>
      <div class="fc-prog"><i style="width:${Math.round((fcIdx + 1) / n * 100)}%"></i></div>
      <div class="fc-stage">${cardHTML}</div>
      ${hint}${grade}${nav}
      <div class="fc-tools"><button data-fcshuffle>🔀 Shuffle</button><button data-fcrestart>↺ Restart</button></div>
    </div>`;
    typeset(body);
  }
  function fcFlip() { if (fcModeCur() === "both") return; fcFlipped = !fcFlipped; renderFlash(); }
  function fcSetMode(m) { state.fcMode = m; save(); fcFlipped = false; renderFlash(); }
  function fcGo(step) { const n = fcOrder.length; fcIdx = Math.max(0, Math.min(n - 1, fcIdx + step)); fcFlipped = false; renderFlash(); }
  function fcGradeGo(knew) {
    if (!fcDeck) return;
    fcGrade(fcDeck.id, fcOrder[fcIdx], knew);
    fcSession[knew ? "knew" : "didnt"]++;
    fcIdx++; fcFlipped = false; renderFlash(); window.scrollTo({ top:0 });
  }
  // Concept "read" tracking — a part counts as read once opened.
  function conceptRead(gid, pid) { return !!(state.read && state.read[gid] && state.read[gid][pid]); }
  function markConceptRead(gid, pid) { if (!state.read) state.read = {}; if (!state.read[gid]) state.read[gid] = {}; if (!state.read[gid][pid]) { state.read[gid][pid] = 1; save(); } }
  function guideReadCount(g) { return g.parts.reduce((n, p) => n + (conceptRead(g.id, p.id) ? 1 : 0), 0); }
  // Link a concept section to its practice set by keyword overlap of titles.
  const CN_STOP = new Set(["the","of","a","an","and","to","in","is","are","for","with","by","on","or","questions","question","argument","arguments","exercise","set","must","true","how","works","work","what","its","concepts","concept","reasoning","data","insights","study","skip"]);
  function cnKeywords(s) { return (String(s).toLowerCase().match(/[a-z]+/g) || []).filter(w => w.length > 2 && !CN_STOP.has(w)); }
  function practiceSetForPart(part, section) {
    const pw = cnKeywords(part.title); if (!pw.length) return null;
    let best = null, score = 0;
    setsFor(section).forEach(set => { const sw = new Set(cnKeywords(set.title)); let sc = 0; pw.forEach(w => { if (sw.has(w)) sc++; }); if (sc > score) { score = sc; best = set; } });
    return score > 0 ? best : null;
  }

  function conceptsPanelHTML(list, sec) {
    const secc = sec ? sec.color : "var(--accent)", key = tsecKey(sec ? sec.id : "", "concepts");
    if (!list.length) {
      return `<section class="panel tabsec ${tsecCollapsed(key) ? "collapsed" : ""}" id="tab-concepts" style="--secc:${secc}">${tabSecHead(ICON.concepts, "Concepts &amp; theory", "Study guides in a clean, readable format.", "", key)}<div class="tabsec-body"><p class="footnote" style="margin:0;text-align:left">No guides here yet.</p></div></section>`;
    }
    let totalParts = 0, totalRead = 0;
    list.forEach(g => { totalParts += g.parts.length; totalRead += guideReadCount(g); });
    const pct = totalParts ? totalRead / totalParts : 0, allDone = totalRead === totalParts;
    const meta = `<span class="cn-ring" title="${totalRead} of ${totalParts} sections read">${ring(pct, allDone?"var(--good)":"var(--accent)")}<span class="cn-ringpct">${totalRead}/${totalParts}</span></span>`;
    let h = `<section class="panel tabsec ${tsecCollapsed(key) ? "collapsed" : ""}" id="tab-concepts" style="--secc:${secc}">${tabSecHead(ICON.concepts, "Concepts &amp; theory", "Study guides in a clean, readable format — tap to read, then jump into practice.", meta, key)}<div class="tabsec-body"><div class="cn-toc">`;
    list.forEach(g => {
      const done = guideReadCount(g), n = g.parts.length, complete = done === n;
      h += `<button class="cn-tocrow ${complete?"done":""}" data-openconcept="${esc(g.id)}">
        <span class="cn-tocic">${topicIcon(g.title, sec?sec.id:"")}</span>
        <span class="cn-tocmeta"><span class="cn-toct">${esc(g.title)}${g.sample?' <span style="color:var(--ink-faint);font-weight:600">· sample</span>':''}</span><span class="cn-tocs">${complete?"All read":done>0?(done+" of "+n+" read"):(n+" sections")}${g.source?" · "+esc(g.source):""}</span></span>
        <span class="cn-tocstat ${complete?"done":""}">${complete?"✓":done+"/"+n}</span>
        <span class="cn-chev">›</span></button>`;
    });
    return h + `</div></div></section>`;
  }

      const set = SETS.find(s => s.id === sid);
      Object.keys(run.logged).forEach(n => {
        const meta = run.logged[n]; let topic, day, correct, ms;
        if (meta && typeof meta === "object") { topic = meta.topic; day = meta.day; correct = meta.correct; ms = meta.ms || 0; }
        else if (set) { const q = set.questions.find(x => String(x.n) === String(n)); topic = q ? resolveTopic(set.section, q.topic) : null; day = dkey(); correct = q ? (run.ans[n] === q.correct) : false; ms = (run.times && run.times[n]) || 0; }

  let runSetId = null, runIndex = 0, qStart = 0, qAccum = 0, qPaused = false, qTimer = null, pendingL = null, timedFor = null;

  function diTableHTML(t) {
    if (!t || !Array.isArray(t.head) || !Array.isArray(t.rows)) return "";

    return `${t.title ? `<div class="di-chart-title">${esc(t.title)}</div>` : ""}<div class="di-table-wrap"><table class="di-table"><thead>${head}</thead><tbody>${rows}${tot}</tbody></table></div>`;
  }
  function diChartHTML(c) {
    if (!c || !Array.isArray(c.points) || !c.points.length) return "";
    const W = 320, H = 170, L = 34, R = 8, T = 10, B = 26;          // viewBox + plot margins
    const iw = W - L - R, ih = H - T - B;
    const ys = c.points.map(p => p.y);
    const yMax = c.yMax != null ? c.yMax : Math.ceil(Math.max(...ys) * 1.12);
    const yMin = c.yMin != null ? c.yMin : 0;
    const sx = (i) => L + (c.points.length === 1 ? iw / 2 : (iw * i) / (c.points.length - 1));
    const sxBar = (i) => L + (iw * (i + 0.5)) / c.points.length;
    const sy = (v) => T + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
    let g = "";
    // horizontal grid + y ticks
    const steps = 4;
    for (let k = 0; k <= steps; k++) {
      const v = yMin + ((yMax - yMin) * k) / steps, y = sy(v);
      g += `<line class="di-grid" x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}"/>`;
      g += `<text class="di-tick" x="${L - 5}" y="${(y + 3).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`;
    }
    g += `<line class="di-axis" x1="${L}" y1="${T}" x2="${L}" y2="${T + ih}"/><line class="di-axis" x1="${L}" y1="${T + ih}" x2="${W - R}" y2="${T + ih}"/>`;
    const col = c.color || "var(--accent)";
    if (c.type === "bar") {
      const bw = Math.max(6, (iw / c.points.length) * 0.62);
      c.points.forEach((p, i) => {
        const x = sxBar(i), y = sy(p.y);

        g += `<text class="di-lab" x="${x.toFixed(1)}" y="${T + ih + 13}" text-anchor="middle">${esc(p.x)}</text>`;
      });
    } else if (c.type === "scatter") {
      c.points.forEach(p => { g += `<circle cx="${sx(0) + ((p.x - c.xMin) / (c.xMax - c.xMin)) * iw}" cy="${sy(p.y)}" r="3.6" fill="${col}" opacity=".85"/>`; });
      for (let k = 0; k <= 4; k++) {

      c.points.forEach((p, i) => {

        if (c.points.length <= 13) g += `<text class="di-lab" x="${sx(i).toFixed(1)}" y="${T + ih + 13}" text-anchor="middle">${esc(p.x)}</text>`;

  function stopTimer() { if (qTimer) { clearInterval(qTimer); qTimer = null; } }

  // Nico reacts to a graded answer: nod + happy hop when right, head-shake when wrong.
  const NICO_MOVES = ["jump", "flip", "spin", "bounce", "wiggle", "nod"];
  const NICO_ANIM = ["nod", "shake", "jump", "flip", "spin", "wiggle", "bounce", "bark", "tuckin", "popout"];

  function nicoSay(text, ms) {

  // A short synthesized "woof" — no audio file needed.
  function nicoBarkSound() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = nicoBarkSound.ctx || (nicoBarkSound.ctx = new AC());
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain(), filt = ctx.createBiquadFilter();
      osc.type = "sawtooth";

  function nicoPlay(cls, hold) {

  /* Nico interactions

  (function () {
